# The Library's starting list: books, research papers and tech blogs worth reading next to the labs.
# Loaded once, by migrations 0009 and 0010, into the library_item table; after that admins change the list in the app
# (Admin > Library). Editing this file later changes nothing in an existing database.
# note: why it is worth reading, in plain words. topic: a short label for the filter. lab and practice: the LabBox lab
# (and where in it) that puts the idea into practice. level: beginner | intermediate | advanced. free: free to read
# online. featured: the big "Start here" card of its section (one per section).

books:
- title: AI Engineering
  authors: Chip Huyen
  year: 2025
  url: https://github.com/chiphuyen/aie-book
  topic: AI
  note: How to build real products on top of foundation models, from prompts and RAG to evaluation and cost. The best single
    book to read alongside the AI labs.
  lab: rag-vector-databases
  practice: chapters 11 and 12, answers with sources and evaluation
  level: intermediate
  free: false
  featured: true
  image: book-ai-engineering.webp
- title: Build a Large Language Model (From Scratch)
  authors: Sebastian Raschka
  year: 2024
  url: https://www.manning.com/books/build-a-large-language-model-from-scratch
  topic: AI
  note: Builds a small GPT step by step in Python, so tokens, attention and training stop being magic.
  lab: langchain
  practice: chapters 1 to 4, how language models work
  level: intermediate
  free: false
  image: book-build-a-large-language-model-from-scratc.webp
- title: Hands-On Large Language Models
  authors: Jay Alammar, Maarten Grootendorst
  year: 2024
  url: https://www.llm-book.com/
  topic: AI
  note: Hundreds of clear illustrations of how language models, embeddings and semantic search work, with runnable code.
  lab: rag-vector-databases
  practice: chapters 2 and 3, embeddings and search
  level: intermediate
  free: false
  image: book-hands-on-large-language-models.webp
- title: Introduction to Information Retrieval
  authors: Christopher D. Manning, Prabhakar Raghavan, Hinrich Schütze
  year: 2008
  url: https://nlp.stanford.edu/IR-book/
  topic: RAG and search
  note: The classic textbook on search, free online. Inverted indexes, ranking, BM25 and evaluation, all explained from
    first principles; the foundation under every RAG system.
  lab: rag-vector-databases
  practice: chapter 9, BM25 and hybrid search
  level: intermediate
  free: true
  image: book-introduction-to-information-retrieval.webp
- title: Speech and Language Processing (3rd edition draft)
  authors: Dan Jurafsky, James H. Martin
  year: 2025
  url: https://web.stanford.edu/~jurafsky/slp3/
  topic: AI
  note: The standard university text on language processing, free online and kept up to date, including chapters on transformers,
    embeddings and retrieval.
