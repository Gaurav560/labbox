  practice: chapters 2 to 4, tokens, embeddings and attention
  level: advanced
  free: true
  image: book-speech-and-language-processing-3rd-editi.webp
- title: Deep Learning
  authors: Ian Goodfellow, Yoshua Bengio, Aaron Courville
  year: 2016
  url: https://www.deeplearningbook.org/
