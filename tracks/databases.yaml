# Skill map for the databases track. A node lights up when all its chapters are complete.
# Nodes without chapters are shown as "coming soon".
track: databases
title: Databases
nodes:
  - id: sql-select
    title: SELECT and WHERE
    chapters: [sql-from-zero/01-select-and-where]
  - id: sql-group
    title: JOIN and GROUP BY
    requires: [sql-select]
    chapters: [sql-from-zero/02-group-by]
  - id: redis-basics
    title: Why Redis, keys and expiry
    chapters: [redis-in-practice/why-redis, redis-in-practice/01-what-redis-is, redis-in-practice/02-expiring-keys]
  - id: redis-types
    title: Redis data types
    requires: [redis-basics]
    chapters: [redis-in-practice/03-hashes-and-lists, redis-in-practice/04-sets-and-sorted-sets]
  - id: pg-indexes
    title: Indexes and EXPLAIN
    requires: [sql-group]
    chapters: [postgres-indexing-incident/01-slow-checkout]
  - id: redis-python
    title: Redis from Python
    requires: [redis-types]
    chapters: [redis-in-practice/05-redis-from-python]
  - id: redis-cache
    title: Caching, savings and stampedes
    requires: [redis-python]
    chapters: [redis-in-practice/06-caching-for-real, redis-in-practice/cache-savings, redis-in-practice/stampede]
  - id: redis-atomic
    title: Atomic operations and locks
    requires: [redis-cache]
    chapters: [redis-in-practice/07-atomic-operations, redis-in-practice/08-distributed-locks]
  - id: redis-streams
    title: Redis streams
    requires: [redis-atomic]
    chapters: [redis-in-practice/09-streams]
  - id: redis-operations
    title: Running Redis in production
    requires: [redis-streams]
    chapters: [redis-in-practice/performance, redis-in-practice/10-memory-and-eviction, redis-in-practice/11-persistence]
  - id: redis-scale
    title: Scaling Redis
    requires: [redis-operations]
    chapters: [redis-in-practice/12-scaling, redis-in-practice/13-production-capstone]
  - id: pg-transactions
    title: Transactions
    requires: [pg-indexes]
    chapters: [postgres-transactions-and-locks/01-all-or-nothing]
  - id: pg-locks
    title: Locks and blockers
    requires: [pg-transactions]
    chapters: [postgres-transactions-and-locks/02-checkout-frozen]
  - id: mongodb
    title: MongoDB
    requires: [sql-select]
