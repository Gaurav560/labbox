# Skill map for the languages track. A node lights up when all its chapters are complete.
# Nodes without chapters are shown as "coming soon".
track: languages
title: Programming languages
nodes:
  - id: py-functions
    title: Python functions
    chapters: [python-basics/01-functions]
  - id: py-numbers-decisions
    title: Python numbers and decisions
    requires: [py-functions]
    chapters: [python-basics/02-numbers-and-text, python-basics/03-decisions]
  - id: py-loops-strings
    title: Python loops and strings
    requires: [py-numbers-decisions]
    chapters: [python-basics/04-loops, python-basics/05-strings]
  - id: py-lists-dicts
    title: Python lists and dictionaries
    requires: [py-loops-strings]
    chapters: [python-basics/06-lists, python-basics/07-dictionaries]
  - id: py-sets-functions
    title: Python sets, tuples and functions
    requires: [py-lists-dicts]
    chapters: [python-basics/08-tuples-and-sets, python-basics/09-functions-in-depth]
  - id: py-errors-files
    title: Python errors and files
    requires: [py-sets-functions]
    chapters: [python-basics/10-errors, python-basics/11-files]
  - id: py-programs
    title: Python programs and the capstone
    requires: [py-errors-files]
    chapters: [python-basics/12-running-a-program, python-basics/13-capstone]
  - id: java-methods
    title: Java methods
    chapters: [java-basics/01-methods]
  - id: java-types-decisions
    title: Java types and decisions
    requires: [java-methods]
    chapters: [java-basics/02-variables-and-types, java-basics/03-decisions]
  - id: java-loops-strings
    title: Java loops, strings and arrays
    requires: [java-types-decisions]
    chapters: [java-basics/04-loops, java-basics/05-strings, java-basics/06-arrays]
  - id: java-objects
    title: Java classes and interfaces
    requires: [java-loops-strings]
    chapters: [java-basics/07-classes-and-objects, java-basics/08-interfaces]
  - id: java-collections-errors
    title: Java collections and exceptions
    requires: [java-objects]
    chapters: [java-basics/09-collections, java-basics/10-exceptions]
  - id: java-programs
    title: Java streams, files and the capstone
    requires: [java-collections-errors]
    chapters: [java-basics/11-lambdas-and-streams, java-basics/12-files-and-cli, java-basics/13-capstone]
  - id: js-functions
    title: JavaScript functions
    chapters: [javascript-basics/01-first-program]
  - id: js-types-decisions
    title: JavaScript types and decisions
    requires: [js-functions]
    chapters: [javascript-basics/02-values-and-types, javascript-basics/03-decisions]
  - id: js-loops-strings
    title: JavaScript loops and strings
    requires: [js-types-decisions]
    chapters: [javascript-basics/04-loops, javascript-basics/05-strings]
  - id: js-arrays-objects
    title: JavaScript arrays, objects and sets
    requires: [js-loops-strings]
    chapters: [javascript-basics/06-arrays, javascript-basics/07-objects, javascript-basics/08-objects-and-sets]
  - id: js-methods-errors
    title: JavaScript array methods and errors
    requires: [js-arrays-objects]
    chapters: [javascript-basics/09-array-methods, javascript-basics/10-errors]
  - id: js-classes-async
    title: JavaScript classes, async and the capstone
    requires: [js-methods-errors]
    chapters: [javascript-basics/11-classes, javascript-basics/12-async, javascript-basics/13-capstone]
  - id: js-values
    title: JavaScript values
    chapters: [javascript-inside-out/01-values-and-equality]
  - id: go-first-steps
    title: Go first steps
    chapters: [go-basics/01-first-program, go-basics/02-numbers-and-text, go-basics/03-decisions, go-basics/04-loops]
  - id: go-slices
    title: Go slices and errors
    requires: [go-first-steps]
    chapters: [go-basics/01-slices-and-errors]
  - id: go-strings-slices
    title: Go strings and more slices
    requires: [go-slices]
    chapters: [go-basics/06-strings, go-basics/07-more-slices]
  - id: py-collections
    title: Lists and dicts
    requires: [py-functions]
    chapters: [python-collections/01-lists-and-dicts, python-collections/02-sets-and-sorting]
  - id: java-collections
    title: Java collections
    requires: [java-methods]
    chapters: [java-collections/01-lists-and-maps, java-collections/02-sets-and-sorting]
  - id: js-async
    title: Closures and promises
    requires: [js-values]
    chapters: [javascript-inside-out/02-closures-and-promises]
  - id: go-maps
    title: Go maps and structs
    requires: [go-strings-slices]
    chapters: [go-basics/02-maps-and-structs]
  - id: go-interfaces
    title: Go methods and interfaces
    requires: [go-maps]
    chapters: [go-basics/09-methods-and-interfaces]
  - id: go-errors-pointers
    title: Go errors and pointers
    requires: [go-interfaces]
    chapters: [go-basics/10-errors-in-depth, go-basics/11-pointers]
  - id: go-files-goroutines
    title: Go files and goroutines
    requires: [go-errors-pointers]
    chapters: [go-basics/12-files-and-cli, go-basics/13-goroutines]
  - id: sql-basics
    title: SQL from zero
    requires: [py-functions, java-methods]
    chapters: [sql-from-zero/01-select-and-where, sql-from-zero/02-group-by]
  - id: py-traps
    title: Python traps
    requires: [py-collections]
  - id: java-concurrency
    title: Concurrency traps
    requires: [java-collections]
  - id: rust-first-steps
    title: Rust first steps
    chapters: [rust-basics/why-rust, rust-basics/variables, rust-basics/types, rust-basics/functions, rust-basics/control-flow]
  - id: rust-ownership
    title: Rust ownership
    requires: [rust-first-steps]
    chapters: [rust-basics/ownership, rust-basics/borrowing, rust-basics/slices-and-strings]
  - id: rust-shaping-data
    title: Rust structs, enums and modules
    requires: [rust-ownership]
    chapters: [rust-basics/structs, rust-basics/enums, rust-basics/match, rust-basics/modules]
  - id: rust-collections-errors
    title: Rust collections and errors
    requires: [rust-shaping-data]
    chapters: [rust-basics/vec-and-string, rust-basics/hashmap, rust-basics/errors, rust-basics/error-types]
  - id: rust-abstractions
    title: Rust generics, traits, closures and tests
    requires: [rust-collections-errors]
    chapters: [rust-basics/generics, rust-basics/traits, rust-basics/lifetimes, rust-basics/closures, rust-basics/iterators, rust-basics/testing]
