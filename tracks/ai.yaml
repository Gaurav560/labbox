# Skill map for the AI track. A node lights up when all its chapters are complete.
# Nodes without chapters are shown as "coming soon".
track: ai
title: AI engineering
nodes:
  - id: ai-first-steps
    title: Calling a model from Spring
    chapters: [spring-ai/why-ai, spring-ai/prompts, spring-ai/options]
  - id: ai-answers
    title: Streaming and structured answers
    requires: [ai-first-steps]
    chapters: [spring-ai/streaming, spring-ai/structured]
  - id: ai-conversations
    title: Memory and tools
    requires: [ai-answers]
    chapters: [spring-ai/memory, spring-ai/tools, spring-ai/tool-safety]
  - id: ai-extending
    title: Advisors and MCP
    requires: [ai-conversations]
    chapters: [spring-ai/advisors, spring-ai/mcp]
  - id: ai-retrieval
    title: Embeddings and vector stores
    requires: [ai-extending]
    chapters: [spring-ai/embeddings, spring-ai/vector-store]
  - id: ai-rag
    title: Documents and RAG
    requires: [ai-retrieval]
    chapters: [spring-ai/etl, spring-ai/rag]
  - id: ai-pictures-and-tests
    title: Pictures and evaluation
    requires: [ai-rag]
    chapters: [spring-ai/vision, spring-ai/evaluation]
  - id: ai-production
    title: Guardrails, cost and metrics
    requires: [ai-pictures-and-tests]
    chapters: [spring-ai/guardrails, spring-ai/production]
  - id: ai-agents
    title: Agents, and Atlas goes live
    requires: [ai-production]
    chapters: [spring-ai/agents, spring-ai/live]
  - id: l4j-foundations
    title: How AI learns (LangChain4j, Part 1)
    chapters: [langchain4j/ai-basics, langchain4j/neurons, langchain4j/language-models]
  - id: l4j-inside-llms
    title: Tokens, embeddings and attention
    requires: [l4j-foundations]
    chapters: [langchain4j/tokens, langchain4j/embeddings, langchain4j/transformers]
  - id: l4j-calling
    title: Calling a model from Java
    requires: [l4j-inside-llms]
    chapters: [langchain4j/raw-http, langchain4j/openai-sdk, langchain4j/first-app]
  - id: l4j-controlling
    title: Parameters, hallucinations and cost
    requires: [l4j-calling]
    chapters: [langchain4j/parameters, langchain4j/hallucinations, langchain4j/usage]
  - id: l4j-ai-services
    title: AI Services, templates and structured output
    requires: [l4j-controlling]
    chapters: [langchain4j/ai-services, langchain4j/templates, langchain4j/structured]
  - id: l4j-apps
    title: Streaming, memory and a Spring Boot API
    requires: [l4j-ai-services]
    chapters: [langchain4j/streaming, langchain4j/memory, langchain4j/rest-api]
  - id: l4j-tools
    title: Tools and MCP
    requires: [l4j-apps]
    chapters: [langchain4j/tools, langchain4j/mcp-client, langchain4j/mcp-server]
  - id: l4j-knowledge
    title: Embedding stores, RAG and local models
    requires: [l4j-tools]
    chapters: [langchain4j/embedding-stores, langchain4j/rag, langchain4j/local-models]
  - id: l4j-production
    title: Guardrails, observability and agents
    requires: [l4j-knowledge]
    chapters: [langchain4j/guardrails, langchain4j/observability, langchain4j/agents]
  - id: l4j-agentic
    title: Workflows, supervisors, and Setu goes live
    requires: [l4j-production]
    chapters: [langchain4j/workflows, langchain4j/supervisor, langchain4j/capstone]
  - id: lc-foundations
    title: How language models work (LangChain, Part 1)
    chapters: [langchain/ai-basics, langchain/tokens, langchain/embeddings, langchain/transformers]
  - id: lc-calling
    title: Calling a model from Python
    requires: [lc-foundations]
    chapters: [langchain/raw-http, langchain/openai-sdk, langchain/first-app, langchain/parameters, langchain/hallucinations]
  - id: lc-agents
    title: Agents, tools and structured output
    requires: [lc-calling]
    chapters: [langchain/agent-loop, langchain/create-agent, langchain/tools, langchain/structured]
  - id: lc-agent-apps
    title: Images, memory and streaming agents
    requires: [lc-agents]
    chapters: [langchain/images, langchain/memory, langchain/streaming]
  - id: lc-knowledge
    title: Documents, vector stores, RAG and MCP
    requires: [lc-agent-apps]
    chapters: [langchain/documents, langchain/vector-stores, langchain/rag, langchain/retrieval-quality, langchain/mcp]
  - id: lc-production
    title: Middleware, guardrails, approvals and evals
    requires: [lc-knowledge]
    chapters: [langchain/middleware, langchain/custom-middleware, langchain/guardrails, langchain/human-in-the-loop, langchain/evals]
  - id: lc-capstone
    title: Navin goes live
    requires: [lc-production]
    chapters: [langchain/capstone]
  - id: lg-graphs
    title: Thinking in graphs (LangGraph, Part 1)
    chapters: [langgraph/why-graphs, langgraph/state, langgraph/branches, langgraph/model-nodes, langgraph/patterns, langgraph/send-command]
  - id: lg-persistence
    title: Persistence and people (LangGraph, Part 2)
    chapters: [langgraph/threads, langgraph/long-chats, langgraph/durable, langgraph/interrupts, langgraph/time-travel, langgraph/stores]
  - id: lg-agents
    title: Agents in graphs (LangGraph, Part 3)
    chapters: [langgraph/agent-graph, langgraph/reflection, langgraph/agentic-rag, langgraph/subgraphs, langgraph/multi-agent, langgraph/streaming, langgraph/functional-api]
  - id: lg-production
    title: Production (LangGraph, Part 4)
    chapters: [langgraph/testing, langgraph/server, langgraph/deep-agents, langgraph/research-team, langgraph/capstone]
  - id: rag-scratch
    title: Retrieval from scratch (RAG and vector databases, Part 1)
    chapters: [rag-vector-databases/why-rag, rag-vector-databases/embeddings, rag-vector-databases/vector-search, rag-vector-databases/chunking]
  - id: rag-inside
    title: Inside a vector database (RAG and vector databases, Part 2)
    requires: [rag-scratch]
    chapters: [rag-vector-databases/ivf, rag-vector-databases/hnsw, rag-vector-databases/quantization, rag-vector-databases/qdrant]
  - id: rag-works
    title: RAG that works (RAG and vector databases, Part 3)
    requires: [rag-inside]
    chapters: [rag-vector-databases/hybrid, rag-vector-databases/rerank, rag-vector-databases/grounded-answers, rag-vector-databases/evaluation, rag-vector-databases/capstone]
  - id: fde-role
    title: The role (Forward Deployed Engineer, Part 1)
    chapters: [forward-deployed-engineer/the-role, forward-deployed-engineer/discovery, forward-deployed-engineer/scoping]
  - id: fde-data
    title: The customer's data (Forward Deployed Engineer, Part 2)
    requires: [fde-role]
    chapters: [forward-deployed-engineer/messy-data, forward-deployed-engineer/customer-database, forward-deployed-engineer/legacy-system, forward-deployed-engineer/data-contract]
  - id: fde-models
    title: Building with models (Forward Deployed Engineer, Part 3)
    requires: [fde-data]
    chapters: [forward-deployed-engineer/first-call, forward-deployed-engineer/extraction, forward-deployed-engineer/policy-lookup, forward-deployed-engineer/tools, forward-deployed-engineer/mcp-server, forward-deployed-engineer/day-five-demo]
  - id: fde-proving
    title: Proving it works (Forward Deployed Engineer, Part 4)
    requires: [fde-models]
    chapters: [forward-deployed-engineer/golden-set, forward-deployed-engineer/evals, forward-deployed-engineer/failure-analysis]
  - id: fde-ready
    title: Ready for real claims (Forward Deployed Engineer, Part 5)
    requires: [fde-proving]
    chapters: [forward-deployed-engineer/privacy, forward-deployed-engineer/reliability, forward-deployed-engineer/human-review, forward-deployed-engineer/monitoring]
  - id: fde-leaving
    title: Leaving well (Forward Deployed Engineer, Part 6)
    requires: [fde-ready]
    chapters: [forward-deployed-engineer/handover, forward-deployed-engineer/second-customer]
