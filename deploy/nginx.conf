# Upgrade only real WebSocket requests on /preview (plain HTTP keeps keep-alive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# /etc/nginx/sites-available/labbox
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    root /opt/labbox/frontend/dist;
    index index.html;

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Checks can take up to the lab's timeout (max 300 s) plus container start-up.
        proxy_read_timeout 360s;
    }

    # Certificate share pages (/c/<id>): the card tags LinkedIn and X read come from the backend.
    location /c/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Learner app previews (HTTP and WebSocket). In production serve these from their own origin
    # (preview.<domain>, a second server block with the same location) so learner JavaScript
    # cannot reach the main app's storage. See README, "Previews".
    location /preview/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 10m;
    }

    # Single page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
