# The Deploy button (owner, 27 November): Actions, Deploy, Run workflow, pick a branch. The same checks as CI run
# on that commit; when they pass, the production branch moves to it. The live site (the owner's laptop for now)
# looks at production every minute and puts it live (deploy/laptop/release.sh); this run then waits until the
# live site reports the new commit. GitHub never runs anything on the laptop: the laptop pulls.
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to put live
        required: true
        default: design/ukiyo

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  resolve:
    name: Which commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying $(git log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: resolve
    uses: ./.github/workflows/labs.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  promote:
    name: Promote
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only this job, only to move the production branch
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}", fetch-depth: 0 }
      - name: Move the production branch to this commit
        run: git push --force origin "${{ needs.resolve.outputs.sha }}:refs/heads/production"

  live:
    name: Live
    needs: [resolve, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait until the live site serves this commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          # A repository variable LIVE_URL overrides the address (Settings, Secrets and variables, Variables).
          URL: ${{ vars.LIVE_URL || 'https://labbox.gauravships.systems' }}
        run: |
          for i in $(seq 180); do
            got="$(curl -fsS -m 10 "$URL/api/health" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("release",""))' 2>/dev/null || true)"
            if [ "$got" = "$SHA" ]; then
              echo "Live at $URL: $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Not live after 30 minutes (live reports '${got:-nothing}'). On the laptop: deploy/laptop/prod status, then deploy/laptop/prod logs deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
