id: go-basics
template: go
title: "Go basics"
subtitle: Slices, errors, maps and structs, in the service that runs Tapri Counter's tills.
track: languages
tags: [go]
level: beginner
story:
  company: Tapri Counter
  character: { name: Meera, role: "CTO, Tapri Counter" }
  pitch: "Tapri Counter is rewriting its till service in Go, and the first pieces are yours."
cover_scene: "Tapri Counter's till room: a tiny glowing kitchen counter where small gopher-like delivery robots carry chai cups along neat glowing conveyor lines between cash tills."
chapters:
  - id: 01-slices-and-errors
    title: Rupees, paise and bad input
    minutes: 15
    goal: Add up a slice of prices and parse money text, returning an error when it is wrong.
    tasks:
      - id: total
        title: "till.go: Total(prices)"
        hints:
          - "prices is a slice of ints in paise. You need their sum."
          - "range over the slice and add each value to a total."
          - "Start a running total at zero, add every price inside a for range loop, then return the total."
      - id: parse_amount
        title: "till.go: ParseAmount(text)"
        hints:
          - "\"12.50\" means 12 rupees and 50 paise, so 1250 paise. Bad text must give an error, not a panic."
          - "strings.Cut splits on the dot; strconv.Atoi turns each part into an int and returns an error when it cannot."
          - "Allow no dot or exactly two digits after it, return 0 and an error for anything else, otherwise rupees*100 plus paise."
  - id: 02-maps-and-structs
    title: What sells at the counter
    minutes: 15
    goal: Count orders in a map and pick the best seller from a slice of structs.
    tasks:
      - id: count_by_item
        title: "till.go: CountByItem(orders)"
        hints:
          - "Each Order has an Item and a Qty. Add up Qty per Item."
          - "A map[string]int is the counter; a missing key reads as 0, so you can add to it directly."
          - "Make the map with make, loop over orders and add o.Qty to the entry for o.Item."
      - id: busiest
        title: "till.go: Busiest(orders)"
        hints:
          - "Start from CountByItem: the best seller is the item with the biggest count."
          - "Map order is random in Go, so ties need a rule: the name that sorts first wins."
          - "Loop over the counts and keep the best item, replacing it when a count is bigger, or equal with a smaller name."
