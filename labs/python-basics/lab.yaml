id: python-basics
version: 2
title: Python Basics
subtitle: Write your first Python functions and see real tests pass.
description: Write your first Python functions and see real tests pass.
language: python
track: languages
tags: [python]
level: beginner
estimated_minutes: 15
story:
  company: Dabba Express
  character: { name: Priya, role: "Founder, Dabba Express" }
  pitch: "Dabba Express delivers 300 tiffins a day across Pune and needs a few small helpers in Python."
cover_scene: "Dabba Express in Pune: a tiny street corner with a delivery bicycle stacked high with shiny steel tiffin boxes, each tiffin glowing softly from inside with lines of light like code, a little laptop on a wooden crate beside it, warm street lamp light."
cover: cover.svg
cover_credit: { by: "Logos: python", source: "devicon (MIT)" }
image: labbox/python-basics:v1
resources:
  cpus: 0.5
  memory: 512m
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 30
  network: none
chapters:
  - id: 01-functions
    title: Your first functions
    file: chapters/01-functions.md
    minutes: 15
    tasks:
      - id: greet
        title: "greet.py: return a greeting"
        hints:
          - "Look at the last line of greet.py: \"pass\" means the function does nothing yet."
          - "An f-string puts a variable inside text: f\"...{name}...\"."
          - "Return an f-string with name between \"Hello, \" and \"!\". Check the comma and the space after it."
      - id: add
        title: "math_utils.py: add two numbers"
        hints:
          - "The function receives two inputs, a and b. What should come back?"
          - "Python adds numbers with the + operator."
          - "Replace pass with a single return statement that adds the two inputs."
      - id: is_even
        title: "math_utils.py: check if a number is even"
        hints:
          - "A number is even when dividing it by 2 leaves nothing over."
          - "n % 2 gives the remainder after dividing n by 2."
          - "Compare that remainder with 0 using == and return the result of the comparison."
