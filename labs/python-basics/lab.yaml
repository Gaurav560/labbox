id: python-basics
version: 2
title: Python from zero
subtitle: From your first function to files and command-line programs, one small step at a time.
description: Learn Python from the very first line to real programs that read files, handle bad input and run from the command line. Plain explanations, everyday examples and real tests.
language: python
track: languages
tags: [python, beginner]
level: beginner
estimated_minutes: 140
cover_scene: "A calm desk with a laptop showing a few lines of Python, a notebook with marks and prices, soft morning light."
cover: cover.svg
cover_credit: { by: "Logos: python", source: "devicon (MIT)" }
image: labbox/python-basics:v1
resources:
  cpus: 0.5
  memory: 512m
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 30
  network: none
chapters:
  - id: 01-functions
    title: Your first functions
    file: chapters/01-functions.md
    minutes: 15
    tasks:
      - id: greet
        title: "greet.py: return a greeting"
        hints:
          - "Look at the last line of greet.py: \"pass\" means the function does nothing yet."
          - "An f-string puts a variable inside text: f\"...{name}...\"."
          - "Return an f-string with name between \"Hello, \" and \"!\". Check the comma and the space after it."
      - id: add
        title: "math_utils.py: add two numbers"
        hints:
          - "The function receives two inputs, a and b. What should come back?"
          - "Python adds numbers with the + operator."
          - "Replace pass with a single return statement that adds the two inputs."
      - id: is_even
        title: "math_utils.py: check if a number is even"
        hints:
          - "A number is even when dividing it by 2 leaves nothing over."
          - "n % 2 gives the remainder after dividing n by 2."
          - "Compare that remainder with 0 using == and return the result of the comparison."
  - id: 02-numbers-and-text
    title: Numbers and text
    file: chapters/02-numbers-and-text.md
    minutes: 15
    tasks:
      - id: average
        title: "numbers_text.py: the average of a list of marks"
        hints:
          - "sum() adds up a list and len() counts its items. What should happen when the list is empty?"
          - "Dividing by zero raises an error, so check for an empty list first and give back zero as a float."
          - "round(value, 2) keeps two digits after the point. Apply it to the sum divided by the count."
      - id: format_price
        title: "numbers_text.py: show an amount as a price"
        hints:
          - "An f-string can format a number: inside the braces, a colon starts the format."
          - "The format ,.2f adds thousands separators and keeps exactly two decimals."
          - "Put the rupee sign before the braces, inside the same f-string."
  - id: 03-decisions
    title: Making decisions
    file: chapters/03-decisions.md
    minutes: 15
    tasks:
      - id: grade
        title: "decisions.py: a grade from marks"
        hints:
          - "Check the invalid marks first: below 0 or above 100."
          - "Then test from the highest grade down: 80, then 60, then 40. The first true condition wins."
          - "Use if, then elif for each grade, and else for F."
      - id: leap_year
        title: "decisions.py: is it a leap year?"
        hints:
          - "A year divisible by 4 is usually a leap year. Two exceptions follow."
          - "Years divisible by 100 are not leap years, unless they are also divisible by 400."
          - "Combine the three tests with and, or and not. 1900 is False, 2000 is True."
  - id: 04-loops
    title: Loops
    file: chapters/04-loops.md
    minutes: 15
    tasks:
      - id: count_above
        title: "loops.py: count the numbers above a limit"
        hints:
          - "Start a counter at 0 before the loop."
          - "Go through the numbers with a for loop and add 1 when a number is greater than the limit."
          - "Greater than means a number equal to the limit does not count."
      - id: first_negative
        title: "loops.py: the first negative number"
        hints:
          - "Return as soon as you find a negative number: the function stops right there."
          - "If the loop finishes without finding one, there is nothing to return yet."
          - "After the loop, give back None (Python's way of saying nothing) so the caller knows there was none."
  - id: 05-strings
    title: Strings
    file: chapters/05-strings.md
    minutes: 15
    tasks:
      - id: clean_name
        title: "text_tools.py: tidy up a name"
        hints:
          - "split() with no argument splits on any run of spaces and drops the empty pieces."
          - "Join the pieces back with a single space between them."
          - "title() makes the first letter of each word a capital and the rest small."
      - id: count_words
        title: "text_tools.py: count the words in a sentence"
        hints:
          - "Words are separated by spaces, sometimes several in a row."
          - "split() without an argument already ignores extra spaces at the ends and in between."
          - "Count the pieces with len()."
  - id: 06-lists
    title: Lists
    file: chapters/06-lists.md
    minutes: 15
    tasks:
      - id: top_n
        title: "lists.py: the n biggest numbers"
        hints:
          - "sorted() gives back a new sorted list and leaves the original alone; list.sort() changes the original."
          - "sorted(numbers, reverse=True) puts the biggest first."
          - "A slice [:n] keeps the first n items, and asking for more than the list has is fine."
      - id: remove_duplicates
        title: "lists.py: remove duplicates, keep the order"
        hints:
          - "Build a new list and only add an item if it is not in the new list yet."
          - "The in operator tells you whether an item is already in a list."
          - "A set would lose the order, so loop over the items in their original order."
  - id: 07-dictionaries
    title: Dictionaries
    file: chapters/07-dictionaries.md
    minutes: 15
    tasks:
      - id: count_letters
        title: "dict_tools.py: count each letter"
        hints:
          - "Make the text lower case first, then look at one character at a time."
          - "Skip characters that are not letters: str.isalpha() tells you."
          - "counts.get(ch, 0) gives the count so far, or 0 the first time: add 1 to it."
      - id: total_by_category
        title: "dict_tools.py: total spent per category"
        hints:
          - "Each expense is a small dictionary: read its category and amount with square brackets."
          - "Start with an empty dictionary and add each amount to its category's running total."
          - "get with a default of 0 handles a category you have not seen before."
  - id: 08-tuples-and-sets
    title: Tuples and sets
    file: chapters/08-tuples-and-sets.md
    minutes: 15
    tasks:
      - id: common_items
        title: "sets_tuples.py: the items two lists share"
        hints:
          - "Turn both lists into sets: duplicates disappear."
          - "The & operator (or .intersection) keeps what is in both sets."
          - "Sets have no order, so give back sorted(...) of the result."
      - id: min_max
        title: "sets_tuples.py: smallest and largest together"
        hints:
          - "A function can give back two values at once as a tuple: (a, b)."
          - "min() and max() find the smallest and largest of a list."
          - "Handle the empty list first: there is no smallest or largest, so both are None."
  - id: 09-functions-in-depth
    title: Functions in depth
    file: chapters/09-functions-in-depth.md
    minutes: 20
    tasks:
      - id: add_item
        title: "functions.py: fix the basket that never empties"
        hints:
          - "A default value like [] is created once, when Python reads the def line, and then shared by every call."
          - "Use None as the default instead, because None is never changed."
          - "Inside the function, if basket is still None, make a fresh empty list before appending."
      - id: total
        title: "functions.py: any number of prices, with a discount"
        hints:
          - "*prices collects every positional argument into a tuple, so sum() works on it."
          - "A parameter after *prices can only be given by name, like discount=10."
          - "Take the discount percent off the sum, then round to 2 decimals and make sure it is a float."
