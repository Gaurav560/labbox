id: postgres-indexing-incident
version: 2
title: "Postgres: the slow checkout"
subtitle: Find and fix a slow query on a real Postgres with a million orders.
description: Find and fix a slow query on a real Postgres with a million orders.
language: sql
track: databases
tags: [postgres, sql, indexes]
level: intermediate
estimated_minutes: 20
story:
  company: Dosa Counter
  character: { name: Meera, role: "CTO, Dosa Counter" }
  pitch: "Dosa Counter's checkout falls over every lunch rush. You are the new backend engineer."
cover_scene: "Dosa Counter at lunch rush: a tiny busy restaurant checkout counter with a long queue of tiny people, a huge glowing database cylinder behind the counter with a red rotating alarm light on top, a pager on the counter flashing red."
cover: cover.svg
cover_credit: { by: "Logos: postgresql", source: "devicon (MIT)" }
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Basic SQL. This is a short incident lab on a real Postgres with a million orders, so you should already be able
    to write a SELECT with a WHERE clause.
  needs:
  - know: SELECT, WHERE and ORDER BY
    why: You read the slow query, change it, and run it again to measure the difference.
    lab: sql-from-zero
    where: chapters 1 to 3
  - know: What an index is, roughly
    why: The fix is an index; the lab explains how Postgres uses it, but the word should not be new.
    lab: sql-from-zero
    where: chapter 12, Indexes and EXPLAIN
image: labbox/postgres-indexing-incident:v1
resources: s
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
  env: { PGHOST: db, PGUSER: postgres, PGPASSWORD: labpass, PGDATABASE: shop }
services:
  - name: db
    image: postgres:16
    env: { POSTGRES_PASSWORD: labpass, POSTGRES_DB: shop }
    resources: { cpus: 1, memory: 768m, pids_limit: 256 }
    # Sized for a small container: no parallel index builds, modest buffers (defaults get OOM-killed).
    command: [postgres, -c, shared_buffers=64MB, -c, maintenance_work_mem=64MB, -c, work_mem=8MB,
              -c, max_parallel_maintenance_workers=0, -c, max_parallel_workers_per_gather=1]
    data: /var/lib/postgresql/data
    ready: [pg_isready, -h, 127.0.0.1, -U, postgres]
check:
  mode: live
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 60
  network: none
chapters:
  - id: 01-slow-checkout
    title: Checkout is crawling
    file: chapters/01-slow-checkout.md
    minutes: 20
    setup: ["bash", "/lab/setup/01.sh"]
    tasks:
      - id: add_index
        title: "Make a customer's order lookup fast"
        xp: 50
        hints:
          - "Run EXPLAIN ANALYZE on the query in checkout.sql. Which kind of scan does Postgres use?"
          - "Postgres can only jump straight to the right rows when there is an index on the column you filter by."
          - "CREATE INDEX on the orders table for the customer_id column, then run EXPLAIN ANALYZE again."
