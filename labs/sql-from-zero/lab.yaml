# Generated from sql-from-zero.yaml. Edit freely; the spec is only the starting point.
id: sql-from-zero
version: 2
title: SQL from zero
subtitle: Ask a real Postgres questions about a chai chain's orders, one query at a time.
description: Ask a real Postgres questions about a chai chain's orders, one query at a time.
language: sql
track: databases
tags:
- sql
- postgres
level: beginner
estimated_minutes: 30
story:
  company: Tapri Counter
  character:
    name: Meera
    role: CTO, Tapri Counter
  pitch: Meera wants answers from the order database, and the analyst just quit.
cover_scene: 'Tapri Counter''s data room: a tiny library where glowing filing drawers of chai orders slide open,
  little lantern-lit tables of rows and columns floating above a reading desk.'
cover: cover.svg
cover_credit: { by: "Logos: postgresql", source: "devicon (MIT)" }
image: labbox/sql-from-zero:v1
resources: s
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
  env:
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: labpass
    PGDATABASE: tapri
services:
- name: db
  image: postgres:16
  env:
    POSTGRES_PASSWORD: labpass
    POSTGRES_DB: tapri
  resources:
    cpus: 1
    memory: 768m
    pids_limit: 256
  command:
  - postgres
  - -c
  - shared_buffers=64MB
  - -c
  - maintenance_work_mem=64MB
  - -c
  - work_mem=8MB
  - -c
  - max_parallel_maintenance_workers=0
  - -c
  - max_parallel_workers_per_gather=1
  data: /var/lib/postgresql/data
  ready:
  - pg_isready
  - -h
  - 127.0.0.1
  - -U
  - postgres
check:
  mode: live
  command:
  - bash
  - /check/tests/run_checks.sh
  timeout_seconds: 60
  network: none
  mount_workspace: ro
chapters:
- id: 01-select-and-where
  title: Asking for rows
  file: chapters/01-select-and-where.md
  minutes: 15
  tasks:
  - id: q_paid_chai
    title: 'q1.sql: paid masala chai orders at outlet 3'
    xp: 20
    hints:
    - You need two columns, id and qty, from the orders table.
    - 'WHERE can combine conditions with AND: the item, the status and the outlet_id.'
    - Filter item = 'masala chai' AND status = 'paid' AND outlet_id = 3, and sort by id.
  - id: q_count_refunds
    title: 'q2.sql: how many orders were refunded'
    xp: 20
    hints:
    - The answer is one number, not a list of rows.
    - COUNT(*) counts the rows that are left after WHERE.
    - Count the rows whose status is 'refunded', and name the column refunds with AS.
  setup:
  - bash
  - /lab/setup/data.sh
- id: 02-group-by
  title: Totals per outlet
  file: chapters/02-group-by.md
  minutes: 15
  tasks:
  - id: q_revenue_by_outlet
    title: 'q3.sql: paid revenue per outlet'
    xp: 20
    hints:
    - Outlet names live in the outlets table; amounts live in orders. Connect them with outlet_id.
    - JOIN the tables, keep only paid orders, then GROUP BY the outlet name.
    - SELECT the name and SUM(amount_paise) AS revenue_paise, grouped by name, biggest first.
  - id: q_top_item
    title: 'q4.sql: the best-selling item'
    xp: 20
    hints:
    - Best-selling means the most cups or plates, so add up qty, not the number of rows.
    - Group the rows by item, add up qty per group, and sort by that total from high to low.
    - Keep paid orders only, and use LIMIT 1 to return just the top row (item and qty).
  setup:
  - bash
  - /lab/setup/data.sh
