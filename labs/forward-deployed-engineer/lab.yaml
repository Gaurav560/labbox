id: forward-deployed-engineer
version: 2
title: Forward Deployed Engineer
subtitle: Eight weeks embedded at a motor insurer, from the first meeting to a system in production, building Claimdesk, an
  AI claims assistant, the way forward deployed engineers do.
description: 'Learn the forward deployed engineer''s job by doing it: measure the customer''s problem in their own numbers,
  discover what really eats the time, scope a pilot you can finish, read the customer''s messy exports, database and old systems,
  agree a data contract, call a model through a gateway, extract fields from claim emails, answer from the policy wording
  with citations, let the model use the customer''s systems through tools and an MCP server, demo on day five, build a golden
  set and evals the customer can read, analyse failures, protect personal data, survive timeouts and costs, run in shadow
  mode with human review, monitor it in production, hand it over with a CI gate, and adapt it for the next customer, by building
  Claimdesk at Deccan Shield Insurance in Pune.'
language: python
track: ai
tags:
- python
- ai
- fde
- llm
- evals
level: intermediate
estimated_minutes: 1020
cover_scene: An engineer at a desk in an insurer's claims office in Pune, claim files and a laptop with a dashboard.
before_you_start:
  summary: Python, and a little about how a language model is called. This course is about the job of a forward deployed engineer,
    so it assumes you can already write Python and read a small FastAPI app; everything about the role, the customer, evals
    and production is taught from the beginning.
  needs:
  - know: Python functions, lists, dictionaries, classes and reading a CSV file
    why: Every chapter is Python, and the customer's data arrives as CSV files.
    lab: python-basics
    where: chapters 1 to 16
  - know: What an HTTP request and a JSON body are, and a small FastAPI endpoint
    why: The customer's old system is called over HTTP (chapter 6), and the demo is a FastAPI app (chapter 13).
    lab: fastapi-first-api
    where: the whole lab
  - know: How a language model is called, what a token is, and what a tool call is (helpful from chapter 8)
    why: Part 3 builds with models; it recaps the basics but moves at an engineer's pace.
    lab: langchain
    where: chapters 2, 5 to 7 and 10 to 13
cover: cover.svg
cover_credit:
  by: 'Logos: python,fastapi'
  source: devicon (MIT)
image: labbox/forward-deployed-engineer:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
llm:
  enabled: true
check:
  command:
  - bash
  - /check/tests/run_checks.sh
  timeout_seconds: 240
  network: none
chapters:
- id: the-role
  title: What a forward deployed engineer does
  file: chapters/01-the-role.md
  minutes: 45
  folder: 01-the-role
  part: The role
  tasks:
  - id: baseline_days
    title: how long a claim takes today
    xp: 15
    hints:
    - days_to_decide returns None for every claim, so there is nothing to average yet.
    - An empty decided_at means the claim is still open. For the others, parse both strings with datetime.strptime(..., FMT).
    - Subtract the two datetimes, then divide total_seconds() by 86400; average the values that are not None and round to
      1 place.
    examples:
    - call: days_to_decide(received 3 Aug 10:00, decided 5 Aug 10:00)
      gives: '2.0'
    - call: days_to_decide(decided_at empty)
      gives: None
      note: still open, left out of the average
    - call: baseline_days(load_claims())
      gives: '12.5'
  - id: adjuster_hours
    title: what the problem costs each week
    xp: 15
    hints:
    - adjuster_hours returns 0.0.
    - Claims per week is len(claims) divided by the weeks argument.
    - Multiply by minutes_per_claim, divide by 60, and round to 1 decimal place.
    examples:
    - call: adjuster_hours(load_claims())
      gives: '10.8'
      note: 240 claims, 13 weeks, 35 minutes each
    - call: adjuster_hours(26 claims, minutes_per_claim=60, weeks=2)
      gives: '13.0'
- id: discovery
  title: 'Discovery: finding the real problem'
  file: chapters/02-discovery.md
  minutes: 45
  folder: 02-discovery
  tasks:
  - id: classify_email
    title: sort the inbox by what each email is about
    xp: 15
    hints:
    - classify returns "other" for every email.
    - Join the subject and the body, lower-case the text once, then test the kinds in the order the TODO lists them.
    - Return at the first match, so a photo email that also says "attached" stays with photos.
    examples:
    - call: 'classify(subject "Re: PHOTO needed")'
      gives: '"photos"'
    - call: classify(subject "Where is my claim?")
      gives: '"status"'
    - call: classify(subject "Hello", body "Thank you")
      gives: '"other"'
  - id: costliest_kind
    title: find what eats the adjusters' time
    xp: 20
    hints:
    - costliest returns an empty kind.
    - minutes_by_kind already adds up the minutes; pick the kind with the largest total.
    - Its share is its minutes divided by the sum of all minutes, times 100, rounded to 1 place.
    examples:
    - call: costliest(load_inbox())
      gives: ("photos", 44.6)
    - call: costliest(two quick status emails, one long photo email)
      gives: ("photos", 71.4)
      note: rank by minutes, not by count
- id: scoping
  title: Scoping a pilot you can finish
  file: chapters/03-scoping.md
  minutes: 45
  folder: 03-scoping
  tasks:
  - id: pilot_slice
    title: choose the pilot's claims
    xp: 15
    hints:
    - pilot_slice returns an empty list.
    - Three conditions must all hold, and amount_rs is a string in the CSV.
    - Compare int(c["amount_rs"]) with 50000 using <=, and check vehicle and channel by equality.
    examples:
    - call: pilot_slice(a two-wheeler email claim for Rs 50,000)
      gives: kept
      note: includes 50,000 ("or less")
    - call: len(pilot_slice(load_claims()))
      gives: '57'
  - id: measurable_goal
    title: a goal you can win or lose
    xp: 20
    hints:
    - missing_parts returns an empty list, even for "make claims faster".
    - Go through PARTS in order; a part is missing when it is absent or empty.
    - For baseline and target, also check isinstance(value, (int, float)); a value of 0 is a real number.
    examples:
    - call: 'missing_parts({"metric": "make claims faster"})'
      gives: '["baseline", "target", "unit", "by"]'
    - call: missing_parts(GOAL)
      gives: '[]'
- id: messy-data
  title: Reading the customer's messy data
  file: chapters/04-messy-data.md
  minutes: 45
  folder: 04-messy-data
  part: The customer's data
  tasks:
  - id: parse_amount
    title: read rupees written four ways
    xp: 15
    hints:
    - parse_amount returns None for every amount, even "36500".
    - Take away "Rs", "₹" and every comma with replace, then strip the spaces; nothing left means None.
    - Read the rest with float() inside try and give back its int; when float() raises ValueError, the answer is None.
    examples:
    - call: parse_amount("₹ 3,37,500")
      gives: '337500'
    - call: parse_amount("34500.00")
      gives: '34500'
    - call: parse_amount("")
      gives: None
      note: blank is not Rs 0
  - id: clean_export
    title: clean the real export
    xp: 20
    hints:
    - clean_export returns two empty lists, so nothing is clean and nothing is rejected.
    - A set of seen claim ids tells you a duplicate; add each id before parsing its date and amount.
    - Reject (cid, "bad date") when parse_date gives None, then (cid, "no amount") for the amount; otherwise build the clean
      dict.
    examples:
    - call: clean_export(load_raw())
      gives: 238 clean, 7 rejected
    - call: the same claim id twice
      gives: ("DS-26-10201", "duplicate")
      note: the first copy is kept
- id: customer-database
  title: The customer's database
  file: chapters/05-customer-database.md
  minutes: 45
  folder: 05-customer-database
  tasks:
  - id: policy_for_claim
    title: the policy behind a claim
    xp: 15
    hints:
    - policy_for_claim returns None, even for a claim that exists.
    - JOIN claims c to policies p ON p.policy_no = c.policy_no, with WHERE c.claim_id = ? and the id in a tuple.
    - fetchone() gives the row or None; return dict(row) when there is one.
    examples:
    - call: policy_for_claim(con, "DS-26-10038")["holder"]
      gives: '"M. Joshi"'
    - call: policy_for_claim(con, "DS-26-99999")
      gives: None
    - call: policy_for_claim(con, "DS-26-99999' OR '1'='1")
      gives: None
      note: a parameter is data, never SQL
  - id: lapsed_claims
    title: claims on lapsed policies
    xp: 20
    hints:
    - lapsed_claims returns an empty list.
    - 'Compare substr(c.received_at, 1, 10) with p.end_date: the date part only.'
    - Select c.claim_id, p.end_date and that substr, keep the later ones, ORDER BY c.claim_id, and return tuples.
    examples:
    - call: len(lapsed_claims(con))
      gives: '6'
    - call: lapsed_claims(con)[0]
      gives: ('DS-26-10088', '2026-09-08', '2026-09-20')
- id: legacy-system
  title: Talking to a legacy system
  file: chapters/06-legacy-system.md
  minutes: 45
  folder: 06-legacy-system
  tasks:
  - id: fetch_policy
    title: read a policy from the old system
    xp: 15
    hints:
    - parse_policy returns an empty dict.
    - ET.fromstring(xml_text) gives the <policy> element; loop over its children and use child.tag and child.text.
    - The key is TAGS.get(child.tag, child.tag); for the keys in NUMBERS store int(child.text).
    examples:
    - call: fetch_policy("DS-POL-40000")["policy_no"]
      gives: '"DS-POL-40000"'
      note: from <number>
    - call: fetch_policy("DS-POL-40000")["sum_insured"]
      gives: '90000'
      note: an int, not text
  - id: retry_busy
    title: retry when the system is busy
    xp: 20
    hints:
    - fetch_with_retry tries once, so a busy moment fails the claim.
    - Loop with for n in range(attempts) and catch httpx.HTTPStatusError; e.response.status_code says which error.
    - For a 503 that is not the last try, sleep for wait * 2 ** n seconds and continue; anything else is raised.
    examples:
    - call: busy, busy, then the policy
      gives: the policy, after waits of 0.2 and 0.4 s
    - call: a 500 or a 404
      gives: raised at once, no retry
- id: data-contract
  title: A data contract with the customer
  file: chapters/07-data-contract.md
  minutes: 45
  folder: 07-data-contract
  tasks:
  - id: claim_model
    title: the claim contract
    xp: 20
    hints:
    - Claim declares only claim_id, so a "bike" or an amount of 0 is accepted.
    - Declare the six fields with type hints; patterns and limits go in Field(...), the three vehicles in a Literal.
    - In the field_validator for vehicle_reg, upper-case and remove spaces and dashes, check REG.match, and return the clean
      value.
    examples:
    - call: Claim(..., vehicle_reg="mh 12 cd 5678").vehicle_reg
      gives: '"MH12CD5678"'
    - call: Claim(..., vehicle="bike")
      gives: ValidationError
    - call: Claim(..., amount_rs="0")
      gives: ValidationError
  - id: contract_report
    title: the report by row and field
    xp: 15
    hints:
    - contract_report returns two empty lists.
    - Number the rows with enumerate(rows, start=1) and try Claim(**row) for each.
    - In except ValidationError as e, add (row_no, str(err["loc"][0]), err["msg"]) for each err in e.errors().
    examples:
    - call: contract_report(load_incoming())
      gives: 5 valid, errors on rows 3, 4, 5, 6, 8, 9, 10
    - call: errors[0]
      gives: (3, 'vehicle', "Input should be 'two-wheeler', 'car' or 'commercial'")
- id: first-call
  title: The first model call, through a gateway
  file: chapters/08-first-call.md
  minutes: 45
  folder: 08-first-call
  part: Building with models
  tasks:
  - id: ask_model
    title: the first call through the gateway
    xp: 15
    hints:
    - ask() returns an empty answer and no usage, so the report crashes on the token counts.
    - 'Use openai.chat.completions.create: MODEL as the model, a temperature of 0, a system and a user message.'
    - The answer is completion.choices[0].message.content; the token counts are completion.usage.
    examples:
    - call: ask("What is a deductible?")
      gives: ("A deductible is ...", usage)
    - call: the request
      gives: model "ai-chat", temperature 0, two messages
  - id: call_cost
    title: what each call costs
    xp: 15
    hints:
    - cost_rs and monthly_rs both return 0.0.
    - Input tokens use USD_PER_MILLION_IN and output tokens USD_PER_MILLION_OUT; divide by 1,000,000, then times RS_PER_USD.
    - Do not round in cost_rs; round only the monthly total to 2 places.
    examples:
    - call: cost_rs(1000 in, 500 out)
      gives: '0.0396'
    - call: monthly_rs(1000 in, 500 out, 80)
      gives: '95.04'
      note: 80 a day for 30 days
- id: extraction
  title: Structured extraction from claim emails
  file: chapters/09-extraction.md
  minutes: 50
  folder: 09-extraction
  tasks:
  - id: extract_claim
    title: read the fields from an email
    xp: 20
    hints:
    - extract_claim returns None for every email.
    - Send RESPONSE_FORMAT as the response format, SYSTEM as the system message and the email as the user message.
    - Pass the answer's message.content to ClaimFields.model_validate_json and return what it gives.
    examples:
    - call: extract_claim(E-01)
      gives: ClaimFields(policy_no='DS-POL-40000', amount_rs=12500, ...)
    - call: the request
      gives: a strict json_schema response_format
  - id: safe_extract
    title: never stop the batch
    xp: 15
    hints:
    - safe_extract lets every error escape, so one bad email stops the batch.
    - Call extract_claim inside try; catch ValidationError first, then Exception.
    - Return (None, the reason) from each except; type(e).__name__ names the failed call.
    examples:
    - call: safe_extract(a refusal)
      gives: (None, 'the answer did not match the claim fields')
    - call: safe_extract(gateway unreachable)
      gives: '(None, ''the model call failed: APIConnectionError'')'
- id: policy-lookup
  title: Answering from the policy wording
  file: chapters/10-policy-lookup.md
  minutes: 50
  folder: 10-policy-lookup
  tasks:
  - id: find_clauses
    title: find the clauses a question is about
    xp: 15
    hints:
    - find_clauses returns an empty list, even for the windscreen question.
    - Score each clause by len(words(question) & words(title + ' ' + text)) and drop the zeros.
    - Sort by score, highest first (sorted keeps ties in order), and keep k ids.
    examples:
    - call: find_clauses('Is a cracked windscreen paid without the deductible?')
      gives: '[''C4'', ''C3'', ''C9'']'
    - call: find_clauses('Do we pay for a puncture?')
      gives: '[]'
      note: no shared word
  - id: cited_answer
    title: an answer that cites its clauses
    xp: 20
    hints:
    - cited_answer never calls the model.
    - 'Send the question and one line per found clause, written [C4] Title: text.'
    - Find the cited ids with re.findall, drop repeats, and set ok only when all of them were sent.
    examples:
    - call: answer '... [C4]'
      gives: cited ['C4'], ok True
    - call: answer '... [C12]', C12 not sent
      gives: ok False
    - call: answer with no citation
      gives: ok False
- id: tools
  title: Letting the model use the customer's systems
  file: chapters/11-tools.md
  minutes: 50
  folder: 11-tools
  tasks:
  - id: policy_tool
    title: the get_policy tool
    xp: 15
    hints:
    - TOOLS is empty and run_tool answers 'not written yet'.
    - 'One tool: type function, name get_policy, a description, and parameters with a required string policy_no.'
    - In run_tool, json.loads the arguments and return json.dumps of the policy, or of an error dict when there is none.
    examples:
    - call: 'run_tool("get_policy", ''{"policy_no": "DS-POL-40185"}'')'
      gives: the policy as JSON
    - call: 'run_tool("get_policy", ''{"policy_no": "DS-POL-99999"}'')'
      gives: '{"error": "no policy DS-POL-99999"}'
  - id: tool_loop
    title: the agent loop
    xp: 20
    hints:
    - run_agent returns an empty answer without calling the model.
    - Loop at most max_turns times; a message without tool_calls is the answer.
    - Append the model's message, then a role tool message with tool_call_id and run_tool's result for each call.
    examples:
    - call: run_agent('Is DS-POL-40185 in force?')
      gives: the answer, [('get_policy', ...)]
    - call: a model that only asks for tools
      gives: '''Stopped after 4 model calls without an answer.'''
- id: mcp-server
  title: Offering Claimdesk's tools over MCP
  file: chapters/12-mcp-server.md
  minutes: 45
  folder: 12-mcp-server
  tasks:
  - id: mcp_tools
    title: two tools over MCP
    xp: 20
    hints:
    - The server offers no tools yet, so clients get 'Unknown tool'.
    - Write get_policy and in_force with type hints and docstrings, and register each with the server's tool decorator.
    - 'in_force compares start_date <= on <= end_date: YYYY-MM-DD text compares correctly.'
    examples:
    - call: list_tools()
      gives: get_policy, in_force
    - call: in_force("DS-POL-40185", "2026-10-04")
      gives: 'true'
    - call: in_force("DS-POL-40925", "2026-10-26")
      gives: 'false'
  - id: tool_errors
    title: clear errors for unknown policies
    xp: 15
    hints:
    - An unknown policy does not give the client a clear error yet.
    - When _policy returns None, raise an exception the client can read.
    - Raise ToolError with the message No policy and the number; a ValueError would be hidden.
    examples:
    - call: get_policy("DS-POL-99999")
      gives: is_error True, '... No policy DS-POL-99999'
- id: day-five-demo
  title: The day-five demo
  file: chapters/13-day-five-demo.md
  minutes: 50
  folder: 13-day-five-demo
  tasks:
  - id: triage_endpoint
    title: the triage endpoint
    xp: 25
    hints:
    - triage always answers refer, 'not written yet'.
    - Read the fields with safe_extract, look up the policy, and append one reason per failed check, in the TODO's order.
    - The draft is pay when the reasons list is empty, otherwise refer; include fields.model_dump().
    examples:
    - call: POST /triage E-01
      gives: '{"draft": "pay", "reasons": []}'
    - call: POST /triage E-24
      gives: 'refer: registration does not match the policy, above the pilot limit'
  - id: input_guard
    title: guard the door
    xp: 10
    hints:
    - An empty email or 'help' still reaches the endpoint.
    - Give TriageIn.email limits with pydantic's Field.
    - At least 20 characters and at most 8000; FastAPI then answers 422 before triage runs.
    examples:
    - call: 'POST /triage {"email": "help"}'
      gives: '422'
      note: no model call
    - call: an email of 8,000 characters
      gives: '200'
- id: golden-set
  title: A golden set to measure against
  file: chapters/14-golden-set.md
  minutes: 45
  folder: 14-golden-set
  part: Proving it works
  tasks:
  - id: field_match
    title: when a field is right
    xp: 15
    hints:
    - The starter compares with ==, and in Python 1 == True.
    - Handle the None cases first, then a bool truth with is, then text, then numbers.
    - 'For numbers, refuse bools: isinstance(got, bool) is True for True and False.'
    examples:
    - call: field_match('policy_no', 'ds-pol-40592', 'DS-POL-40592')
      gives: 'False'
      note: the SQL lookup is exact
    - call: field_match('photos_attached', 1, True)
      gives: 'False'
  - id: stratified
    title: two of each kind
    xp: 10
    hints:
    - 'The starter returns the first per_kind cases overall: all accidents.'
    - Keep a dict from incident_type to how many of that kind you kept so far.
    - Keep a case only while its kind's count is below per_kind, and go through the set in order.
    examples:
    - call: stratified(load_golden(), 2)
      gives: '12 cases: 2 of each of the 6 kinds'
- id: evals
  title: Evals and a regression gate
  file: chapters/15-evals.md
  minutes: 45
  folder: 15-evals
  tasks:
  - id: eval_report
    title: the eval report
    xp: 15
    hints:
    - eval_report returns an empty dict, so evals.py cannot print the table.
    - For every case, compare each of FIELDS with field_match; an email with no fields is wrong on all of them.
    - Divide by the number of cases, multiply by 100 and round to 1 place; all_fields counts emails where every field is right.
    examples:
    - call: eval_report(golden, run_v1)['all_fields']
      gives: '73.3'
    - call: eval_report(golden, run_v2)['incident_date']
      gives: '80.0'
  - id: regression_gate
    title: the regression gate
    xp: 15
    hints:
    - The starter always passes.
    - Go through FIELDS and then all_fields, in that order, and note every field whose percent fell.
    - A field fell when the new value is below the old value minus tolerance; ok is True only when nothing fell.
    examples:
    - call: regression_gate(v1, v2)
      gives: (False, [('incident_date', 83.3, 80.0)])
- id: failure-analysis
  title: 'Failure analysis: fix causes, not cases'
  file: chapters/16-failure-analysis.md
  minutes: 50
  folder: 16-failure-analysis
  tasks:
  - id: classify_failure
    title: name the kind
    xp: 15
    hints:
    - Every failure is called wrong, so a typing difference looks like a made-up date.
    - 'Ask four questions in order: nothing read, nothing to read, same once squashed, otherwise wrong.'
    - 'squash is already written: compare squash(got) with squash(truth) for the format case.'
    examples:
    - call: classify_failure('policy_no', 'null', None)
      gives: '''invented'''
    - call: classify_failure('incident_date', '2023-10-06', '2026-10-06')
      gives: '''wrong'''
  - id: fix_fields
    title: fix the kinds that code can fix
    xp: 20
    hints:
    - fix_fields returns the fields unchanged.
    - 'Three rules on a copy: the word null becomes None, a policy number is rebuilt from its five digits, an old year becomes
      this year.'
    - For the date, replace the year with today's; if that lands after today, use the year before.
    examples:
    - call: 'fix_fields({... ''incident_date'': ''2023-12-20''})'
      gives: '''2025-12-20'''
      note: today is 2026-10-31
    - call: eval_report on run v1 after the fixes
      gives: all_fields 93.3
- id: privacy
  title: Privacy and prompt injection
  file: chapters/17-privacy.md
  minutes: 50
  folder: 17-privacy
  part: Ready for real claims
  tasks:
  - id: redact_pii
    title: keep personal data out
    xp: 20
    hints:
    - PHONE matches nothing yet, and redact returns the text unchanged.
    - 'A mobile number: an optional +91 with an optional space or dash, a first digit 6 to 9, then nine more digits with an
      optional separator after the fifth.'
    - Guard both edges with (?<!\d) and (?!\d), and replace ID12 before EMAIL and PHONE.
    examples:
    - call: redact('Call me on +91 98220 45117')
      gives: '''Call me on [PHONE]'''
    - call: redact('Policy DS-POL-41120, Rs 1,00,000')
      gives: unchanged
  - id: instruction_guard
    title: send orders to a person
    xp: 15
    hints:
    - E-30 has no flags yet, so its pay draft stands.
    - Search each SUSPICIOUS pattern ignoring case, and keep the words the email used.
    - 'With flags, build a new dict: refer, the old reasons plus one, and the flags.'
    examples:
    - call: instruction_flags(E-30)
      gives: '[''ignore your previous instructions'', ''approve this claim'']'
    - call: 'guard_draft({''draft'': ''pay'', ''reasons'': []}, E-30)[''draft'']'
      gives: '''refer'''
- id: reliability
  title: 'Reliability: pacing, caching, falling back'
  file: chapters/18-reliability.md
  minutes: 45
  folder: 18-reliability
  tasks:
  - id: pacer
    title: the pacer
    xp: 15
    hints:
    - wait never sleeps, so a batch fires as fast as it can.
    - Sleep only when there was a previous call and less than gap seconds have passed since it.
    - After sleeping, read the clock again before remembering the time.
    examples:
    - call: 'Pacer(20): a call 1 s after the last'
      gives: sleeps 2.0 s
    - call: 'Pacer(20): a call 5 s after the last'
      gives: no sleep
  - id: cache
    title: the cache
    xp: 15
    hints:
    - Every call reaches the model, even for an email read a moment ago.
    - Look the key up first; on a hit there is no call and called is False.
    - 'Store only successful reads: a failure is returned but not remembered.'
    examples:
    - call: the same email twice
      gives: 1 model call
    - call: a RateLimitError
      gives: (None, problem, True), not stored
- id: human-review
  title: Shadow mode and the go-live check
  file: chapters/19-human-review.md
  minutes: 45
  folder: 19-human-review
  tasks:
  - id: shadow_report
    title: the shadow report
    xp: 15
    hints:
    - The report sees no agreement and no disagreement.
    - Claimdesk pay with adjuster refer is unsafe; Claimdesk refer with adjuster pay is extra work.
    - 'Agreement is what is left: the rows minus both lists, as a percent rounded to 1 place.'
    examples:
    - call: shadow_report(week 1)
      gives: unsafe E-02, E-25, E-30; 83.3%
  - id: go_live_check
    title: the go-live check
    xp: 15
    hints:
    - The check says yes to everything.
    - 'Three rules in order: enough cases, no unsafe drafts, enough agreement.'
    - Collect every reason that applies, not only the first, and ok is True when there are none.
    examples:
    - call: go_live_check(week 1)
      gives: '(False, [''unsafe drafts: E-02, E-25, E-30'', ''agreement 83.3% is below 90.0%''])'
    - call: go_live_check(week 1 replayed)
      gives: (True, [])
- id: monitoring
  title: 'Monitoring: numbers and drift'
  file: chapters/20-monitoring.md
  minutes: 45
  folder: 20-monitoring
  tasks:
  - id: daily_metrics
    title: daily numbers
    xp: 20
    hints:
    - daily_metrics returns nothing, so the table is empty.
    - Group the rows by day with a defaultdict(list), and go through the days in sorted order.
    - Use percentile for p50 and p95, and count errors, refers and missing amounts as percents of the day.
    examples:
    - call: daily_metrics(log)[8]['p95_ms']
      gives: '10000'
      note: 15 December
  - id: drift_alerts
    title: drift alerts
    xp: 15
    hints:
    - No alerts, even on the day the provider timed out.
    - The baseline of each WATCH metric is its mean over the first baseline_days days, rounded to 1 place.
    - Check only the later days, metric by metric in WATCH order, against factor times the baseline.
    examples:
    - call: drift_alerts(days)[0]
      gives: ('2026-12-15', 'p95_ms', 1770.3, 10000)
- id: handover
  title: 'Handing over: settings, a smoke test, a runbook'
  file: chapters/21-handover.md
  minutes: 45
  folder: 21-handover
  part: Leaving well
  tasks:
  - id: settings_from_env
    title: settings from the environment
    xp: 15
    hints:
    - An empty key and a limit of 50k both start without complaint.
    - 'Collect every problem in a list first: each missing required name, then a limit that is not a positive whole number.'
    - Raise ConfigError once with the problems joined by '; ', otherwise build Settings with int() for the limit.
    examples:
    - call: settings_from_env({})
      gives: 'ConfigError: OPENAI_BASE_URL is not set; OPENAI_API_KEY is not set'
    - call: print(settings)
      gives: every setting except the key
  - id: smoke_test
    title: the smoke test
    xp: 15
    hints:
    - The smoke test runs nothing, so it always passes.
    - Call run for every case inside try/except, and keep going after a crash.
    - 'At most one failure per case: crashed, then no reasons list, then a wrong draft.'
    examples:
    - call: PILOT_LIMIT_RS=10000 python smoke.py
      gives: '[''E-01: expected pay, got refer''], exit code 1'
- id: second-customer
  title: 'A second customer: from project to product'
  file: chapters/22-second-customer.md
  minutes: 45
  folder: 22-second-customer
  tasks:
  - id: from_konkan
    title: Konkan's adapter
    xp: 15
    hints:
    - The adapter passes the raw columns through.
    - 'Normalise each column to the form the core compares: capitals, no separators in registrations, ISO dates.'
    - Empty columns become None; the estimate loses its commas and becomes whole rupees; only Y means photos.
    examples:
    - call: from_konkan(KC-1002)['vehicle_reg']
      gives: '''MH04CD5678'''
    - call: from_konkan(a row with Estimate '4,999.60')['amount_rs']
      gives: '5000'
  - id: customer_rules
    title: one set of rules for every customer
    xp: 20
    hints:
    - rules returns no reasons, so every claim is paid.
