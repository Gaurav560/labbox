[package]
name = "ch23-cli"
version.workspace = true
edition.workspace = true

# The program is called windwatch:  cargo run -- data/farm.csv --turbine T07
[[bin]]
name = "windwatch"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.105"
clap = { version = "=4.6.9", features = ["derive"] }
csv = "=1.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
