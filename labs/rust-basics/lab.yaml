# Rust from zero. Every chapter is its own crate in one Cargo workspace (Cargo.toml at the top of the workspace).
id: rust-basics
version: 2
title: Rust from zero
subtitle: From your first Rust program to ownership, traits, threads and a fast web service, one curious step at a time.
description: 'Learn Rust from the first line: Cargo, types and functions, ownership and borrowing, structs, enums and
  pattern matching, collections, real error handling, generics, traits, lifetimes, closures and iterators, tests, a
  command-line tool, threads, async and a web service, by building Windwatch, the turbine monitor of a wind farm.'
language: rust
track: languages
tags:
- rust
- beginner
level: beginner
estimated_minutes: 755
cover_scene: "Wind turbines on a flat coast at dusk, a laptop showing a terminal on a crate in the foreground."
cover: cover.svg
cover_credit: { by: "Logo: Rust", source: "Simple Icons (CC0)" }
image: labbox/rust-basics:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: none
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
- id: why-rust
  title: Why Rust
  file: chapters/01-why-rust.md
  minutes: 45
  folder: 01-why-rust
  part: First steps
  tasks:
  - id: hello_windwatch
    title: Windwatch says hello
    xp: 10
    hints:
    - The program still prints the greeting every new Cargo project starts with.
    - println! prints one line; two lines need two calls.
    - Replace the greeting with two println! calls, one for each line, exactly as written in the TODO.
    examples:
    - call: cargo run --bin hello_windwatch
      gives: Windwatch 0.1, then the farm's line
  - id: fix_first_errors
    title: three mistakes, fixed
    xp: 15
    hints:
    - cargo run stops at the first error and says which line.
    - Each statement ends with a semicolon, macros are called with an exclamation mark, and Rust never mixes integers and floats on its own.
    - Add the semicolon, add the exclamation mark to println, and turn the count into an f64 before multiplying.
    examples:
    - call: cargo run --bin fix_first_errors
      gives: 'Turbines: 40, then Capacity: 100 MW'
- id: variables
  title: Variables and constants
  file: chapters/02-variables.md
  minutes: 40
  folder: 02-variables
  tasks:
  - id: capacity_mw
    title: the farm's capacity
    xp: 15
    hints:
    - capacity_mw still says todo!().
    - RATED_POWER_KW is a constant you can use anywhere in the file.
    - Multiply the turbines by the constant and divide by a thousand.
    examples:
    - call: capacity_mw(40)
      gives: '100'
  - id: wind_speed
    title: a wind speed from text
    xp: 15
    hints:
    - wind_speed trims the text and then gives up.
    - A new let with the same name shadows the old one, and may even change its type.
    - Remove the unit and trim again, then parse into an f64 with a new let, and return it.
    examples:
    - call: wind_speed("  3.2m/s ")
      gives: '3.2'
- id: types
  title: Types
  file: chapters/03-types.md
  minutes: 45
  folder: 03-types
  tasks:
  - id: energy_kwh
    title: energy from power and time
    xp: 15
    hints:
    - energy_kwh still says todo!().
    - Rust does not mix integer and float arithmetic; as converts one number type into another.
    - Convert both inputs to f64, multiply them, and divide by sixty.
    examples:
    - call: energy_kwh(2100, 10)
      gives: '350.0'
  - id: describe
    title: a reading as text
    xp: 15
    hints:
    - describe still says todo!().
    - A let with a pattern in brackets takes a tuple apart into separate names.
    - Take the tuple apart, then build the text with format!, padding the turbine number and rounding the wind to one decimal.
    examples:
    - call: describe((7, 12.43, 2100))
      gives: 'T07: 12.4 m/s, 2100 kW'
- id: functions
  title: Functions
  file: chapters/04-functions.md
  minutes: 45
  folder: 04-functions
  tasks:
  - id: tip_speed
    title: how fast a blade tip moves
    xp: 15
    hints:
    - tip_speed still says todo!().
    - A function returns the value of its last expression, the one without a semicolon.
    - One turn moves the tip around a circle of the blade's radius; multiply by turns per minute and divide by sixty.
    examples:
    - call: tip_speed(12.0, 50.0)
      gives: about 62.8
  - id: capacity_factor
    title: the capacity factor
    xp: 15
    hints:
    - capacity_factor still says todo!().
    - max_energy_mwh already computes the most a turbine could make.
    - Divide the energy made by the maximum from max_energy_mwh, and turn it into a percentage.
    examples:
    - call: capacity_factor(612.0, 2500.0, 720.0)
      gives: '34.0'
- id: control-flow
  title: Control flow
  file: chapters/05-control-flow.md
  minutes: 50
  folder: 05-control-flow
  tasks:
  - id: status
    title: what the turbine does
    xp: 15
    hints:
    - status still says todo!().
    - if and else if can be the last expression of a function, and each branch gives a value.
    - Check the calm limit first, then the storm limit, and return the matching text from each branch.
    examples:
    - call: status(25.0)
      gives: storm stop
  - id: hours_generating
    title: hours of power in a day
    xp: 15
    hints:
    - hours_generating still says todo!().
    - A for loop visits each of the array's values; a counter must be declared with mut to change.
    - Count the hours whose status is generating and return the count.
    examples:
    - call: a day of steady 10 m/s wind
      gives: '24'
- id: ownership
  title: Ownership
  file: chapters/06-ownership.md
  minutes: 50
  folder: 06-ownership
  part: Ownership
  tasks:
  - id: fix_moved_value
    title: a backup that is really a copy
    xp: 15
    hints:
    - The crate does not compile; the compiler says a value was used after it moved.
    - Assigning a Vec to a new name moves it; clone makes a second, separate copy.
    - Make the backup with clone, so both names own their own vector.
    examples:
    - call: with_backup(vec![2100.0, 2250.0])
      gives: two separate vectors
  - id: add_reading
    title: take, change, give back
    xp: 15
    hints:
    - add_reading still says todo!().
    - The function owns the log now (it is mut), so it may push onto it, and must return it.
    - Push the reading, then give the log back as the last expression.
    examples:
    - call: add_reading(vec![2100.0], 2400.0)
      gives: '[2100.0, 2400.0]'
- id: borrowing
  title: Borrowing
  file: chapters/07-borrowing.md
  minutes: 50
  folder: 07-borrowing
  tasks:
  - id: average_power
    title: an average, on loan
    xp: 15
    hints:
    - average_power still says todo!().
    - A for loop over a borrowed vector gives a reference to each reading; += works with it.
    - Keep a mutable total, add every reading, and divide by the length as an f64.
    examples:
    - call: average_power(&vec![2100.0, 2250.0, 1950.0])
      gives: '2100.0'
  - id: cap_readings
    title: cap the glitches, in place
    xp: 20
    hints:
    - cap_readings still says todo!().
    - iter_mut gives a mutable reference to each reading; the star reaches the number behind it.
    - Loop with iter_mut, and where a reading is above the maximum, set it to the maximum through the star.
    examples:
    - call: cap_readings(&mut log, 2500.0) with 9999.0 in the log
      gives: 2500.0 in its place
- id: slices-and-strings
  title: Slices and strings
  file: chapters/08-slices-and-strings.md
  minutes: 50
  folder: 08-slices-and-strings
  tasks:
  - id: turbine_id
    title: the turbine id, without copying
    xp: 20
    hints:
    - turbine_id still says todo!().
    - find gives Some position of the first comma, or None; a range slice borrows part of the line.
    - Match on the position and return the slice before the comma, or the whole line.
    examples:
    - call: turbine_id("T07,2026-11-24 10:10,12.4,2100")
      gives: T07
  - id: last_hour
    title: the last hour of readings
    xp: 15
    hints:
    - last_hour still says todo!().
    - saturating_sub stops at zero instead of going below it; a range with no end runs to the last item.
    - Start six before the end (or at zero), and return the slice from there to the end.
    examples:
    - call: last_hour of ten readings
      gives: the last six
- id: structs
  title: Structs and methods
  file: chapters/09-structs.md
  minutes: 50
  folder: 09-structs
  part: Shaping data
  tasks:
  - id: from_line
    title: a Reading from a log line
    xp: 15
    hints:
    - from_line still says todo!().
    - A struct value names every field; text from the line must become an owned String to live in the struct.
    - Build a Reading with the four parts, turning the two texts into Strings and parsing the two numbers.
    examples:
    - call: Reading::from_line("T07,2026-11-24 10:10,12.4,2100")
      gives: a Reading for T07 at 12.4 m/s and 2100 kW
  - id: underperforming
    title: is this turbine underperforming?
    xp: 20
    hints:
    - underperforming still says todo!().
    - A method reads its own fields through self and can call its other methods.
    - Compare the power with eighty percent of the expected power, and only when something is expected at all.
    examples:
    - call: a reading of 140 kW at 7.5 m/s
      gives: 'true'
- id: enums
  title: Enums and Option
  file: chapters/10-enums.md
  minutes: 50
  folder: 10-enums
  tasks:
  - id: classify
    title: classify a turbine
    xp: 20
    hints:
    - classify still says todo!().
    - match on the fault Option; each variant of Status is built with its own data.
    - A fault code wins; otherwise the wind decides between calm, generating with its power, and a storm stop.
    examples:
    - call: classify(14.0, 0.0, Some(512))
      gives: Fault(512)
  - id: peak_power
    title: the peak, if there is one
    xp: 15
    hints:
    - peak_power still says todo!().
    - 'Option says "maybe nothing": None for an empty log, Some for a real peak.'
    - Return None when the log is empty; otherwise keep the largest reading in a loop and wrap it in Some.
    examples:
    - call: peak_power(&[])
      gives: None
- id: match
  title: Pattern matching
  file: chapters/11-match.md
  minutes: 50
  folder: 11-match
  tasks:
  - id: describe_status
    title: a status in words
    xp: 20
    hints:
    - Generating and fault statuses still reach the todo!() arm.
    - Arms are tried in order; a guard adds a condition, and a range with @ names the matched code.
    - Add the full-power arm with its guard first, then generating, then the urgent fault range, then any other fault.
    examples:
    - call: describe(&Status::Fault(512))
      gives: 'fault 512: send the crew now'
  - id: parse_line
    title: broken lines become None
    xp: 20
    hints:
    - parse_line still says todo!() once the line has four fields.
    - let else binds the value when the pattern fits, and must leave when it does not.
    - Parse wind and power with let else returning None on failure, then return Some of a new Reading.
    examples:
    - call: parse_line("T07,2026-11-24 10:50,13.4,22O0")
      gives: None
- id: modules
  title: Modules and crates
  file: chapters/12-modules.md
  minutes: 40
  folder: 12-modules
  tasks:
  - id: make_public
    title: open the summary
    xp: 15
    hints:
    - The crate does not compile; the compiler says a function is private.
    - Everything in a module is private unless marked pub.
    - Mark farm_summary in report.rs as pub.
    examples:
    - call: cargo run
      gives: 3 turbines, 4 readings (1 skipped), 0.72 MWh
  - id: re_export
    title: a short path
    xp: 15
    hints:
    - farm_summary is only reachable through the report module's path.
    - pub use makes another public path to a name.
    - Re-export farm_summary from the report module in lib.rs.
    examples:
    - call: ch12_modules::farm_summary(...)
      gives: the same summary
- id: vec-and-string
  title: Vectors and strings
  file: chapters/13-vec-and-string.md
  minutes: 45
  folder: 13-vec-and-string
  part: Collections and errors
  tasks:
  - id: moving_average
    title: a moving average
    xp: 20
    hints:
    - moving_average still says todo!().
    - windows gives every run of readings of a given length, as a slice, one after another.
    - For each window, add its readings, push the total divided by the window size, and return the vector.
    examples:
    - call: moving_average(&[10.0, 20.0, 30.0, 40.0], 2)
      gives: '[15.0, 25.0, 35.0]'
  - id: as_sentence
    title: ids as a sentence
    xp: 20
    hints:
    - Three or more ids still reach todo!().
    - enumerate gives each item with its position; push_str adds text to a String.
    - Push the ids of rest with a comma before every one but the first, then " and " and the last id.
    examples:
    - call: as_sentence(&["T07", "T12", "T31"])
      gives: T07, T12 and T31
- id: hashmap
  title: Maps and sets
  file: chapters/14-hashmap.md
  minutes: 45
  folder: 14-hashmap
  tasks:
  - id: energy_by_turbine
    title: energy per turbine
    xp: 20
    hints:
    - Every turbine's total stays at zero.
    - entry finds a key's place, or_insert creates it the first time, and gives a mutable reference to the value.
    - Add each reading's ten minutes of energy to its turbine's entry, starting from zero.
    examples:
    - call: energy_by_turbine of two T07 readings, 2100 and 2180 kW
      gives: 'T07: 713.3 kWh'
  - id: silent_turbines
    title: the silent turbines
    xp: 15
    hints:
    - silent_turbines still says todo!().
    - A HashSet answers whether it contains a value in one step.
    - Keep the farm's turbines the set does not contain, sorted.
    examples:
    - call: silent_turbines(&["T01", "T02", "T03"], &["T03"])
      gives: '["T01", "T02"]'
- id: errors
  title: Result and the ? operator
  file: chapters/15-errors.md
  minutes: 50
  folder: 15-errors
  tasks:
  - id: number
    title: a number, or why not
    xp: 15
    hints:
    - number still says todo!().
    - parse returns Ok with the number or Err; a function returning Result gives back one or the other.
    - Match on the parse result and return Ok of the value, or Err of a message naming the field and its text.
    examples:
    - call: number("windy", "wind speed")
      gives: 'Err("wind speed is not a number: \"windy\"")'
  - id: parse_reading
    title: a line, or what is wrong with it
    xp: 20
    hints:
    - parse_reading still says todo!() after the field count check.
    - The question mark returns the error from the function at once, or gives the value when it is Ok.
    - Get both numbers with number and the question mark, then return Ok of a new Reading.
    examples:
    - call: parse_reading("T07,10:50,13.4,22O0")
      gives: 'Err("power is not a number: \"22O0\"")'
- id: error-types
  title: Your own error types
  file: chapters/16-error-types.md
  minutes: 50
  folder: 16-error-types
  tasks:
  - id: error_enum
    title: a variant for glitches
    xp: 20
    hints:
    - ReadingError has no variant for a power reading above the turbine's rating.
    - Each variant gets its message from an error attribute above it, filled in from its fields.
    - Add the variant with its message, and return it from parse_reading when the power is above 2500.
    examples:
    - call: parse_reading("T12,10:30,8.1,9999")
      gives: 'Err(TooMuchPower { kw: 9999.0 })'
  - id: load_with_context
    title: load a file, with context
    xp: 25
    hints:
    - load still says todo!().
    - with_context adds a message about where an error happened, and keeps the cause underneath.
    - Read the file with context naming it, parse every line with context naming the file and line, and return the readings.
    examples:
    - call: cargo run -- data/t12.log
      gives: 'Error: data/t12.log, line 3 ... power 9999 kW is more than ...'
