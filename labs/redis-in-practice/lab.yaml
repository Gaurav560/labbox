id: redis-in-practice
version: 2
title: Redis in practice
subtitle: From your first SET to streams, replication and production incidents, on a real Redis.
description: From your first SET to streams, replication and production incidents, on a real Redis.
language: python
track: databases
tags: [redis, python, caching]
level: beginner
estimated_minutes: 290
story:
  company: Brew Point
  character: { name: Kabir, role: "Backend lead, Brew Point" }
  pitch: "Brew Point's menu API takes 1.5 seconds a call, and someone is spamming the OTP button. Redis can fix both."
cover_scene: "Brew Point's back office: a glowing red Redis cube on a counter, coffee cups flying past it on a conveyor."
cover: cover.svg
cover_credit: { by: "Logos: redis,python", source: "devicon (MIT)" }
image: labbox/redis-in-practice:v1
resources: s
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
  env: { REDIS_HOST: redis }
services:
  - name: redis
    image: redis:7.4
    # 64 MB budget for data; the container gets room above it for incidents and background saves.
    resources: { cpus: 1, memory: 256m, pids_limit: 64 }
    command: [redis-server, --appendonly, "yes", --maxmemory, 64mb, --repl-diskless-sync-delay, "0"]
    data: /data
    ready: [redis-cli, ping]
  # Chapter 12: a second server, which the learner turns into a replica.
  - name: replica
    image: redis:7.4
    resources: { cpus: 0.5, memory: 256m, pids_limit: 64 }
    command: [redis-server, --appendonly, "no", --save, "", --dir, /tmp]  # /tmp: writable for the first sync
    ready: [redis-cli, ping]
check:
  mode: live
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 60
  network: none
chapters:
  - id: 01-what-redis-is
    title: What Redis is
    file: chapters/01-what-redis-is.md
    minutes: 20
    setup: ["bash", "/lab/setup/01.sh"]
    tasks:
      - id: first_keys
        title: "Store the shop's name and city"
        xp: 10
        hints:
          - "Each fact is one key with a plain text value. SET stores a value under a key."
          - "Two SET commands, one for shop:name and one for shop:city. A value with a space needs quotes."
          - "Check with GET shop:name and GET shop:city: they should read Brew Point and Pune."
        examples:
          - call: "GET shop:name"
            gives: "\"Brew Point\""
          - call: "GET shop:city"
            gives: "\"Pune\""
      - id: cups_counter
        title: "Count cups, take beans off the stock"
        xp: 20
        hints:
          - "A counter that starts from nothing needs no SET: the first INCR creates it."
          - "INCR adds one. Its cousins INCRBY and DECRBY add or subtract any whole number."
          - "Three INCR on cups:sold, then subtract 250 from beans:grams with the command that decrements by an amount."
        examples:
          - call: "GET cups:sold"
            gives: "\"3\""
          - call: "GET beans:grams"
            gives: "250 less than before"
      - id: clean_up
        title: "Delete the leftover tmp:import keys"
        xp: 20
        hints:
          - "First list them: the scan option of redis-cli shown in the step walks the keys matching a pattern."
          - "DEL accepts several key names at once and tells you how many it removed."
          - "Delete all five tmp:import keys, then scan again: nothing should be left, and beans:grams still there."
        examples:
          - call: "redis-cli --scan --pattern 'tmp:import:*'"
            gives: "(nothing)"
          - call: "the other keys"
            gives: "still there"
  - id: 02-expiring-keys
    title: Keys that expire
    file: chapters/02-expiring-keys.md
    minutes: 15
    setup: ["bash", "/lab/setup/02.sh"]
    tasks:
      - id: otp_expiry
        title: "A login code that expires in 5 minutes"
        xp: 20
        hints:
          - "SET can give a key a timer in the same command, so it disappears on its own."
          - "The EX option takes seconds: 5 minutes is 300."
          - "TTL otp:9876543210 shows the seconds left. -1 means it never expires, -2 means it is gone."
        examples:
          - call: "GET otp:9876543210"
            gives: "\"4821\""
          - call: "TTL otp:9876543210"
            gives: "300 or a little less"
            note: "counting down"
      - id: session_ttl
        title: "Give the session a 30 minute lifetime"
        xp: 20
        hints:
          - "The session already exists, and its value must not change. Which command adds a timer to an existing key?"
          - "EXPIRE takes a key and a number of seconds. 30 minutes is 1800 seconds."
          - "Do not SET the session again: that would replace its value. Check the result with TTL."
        examples:
          - call: "TTL session:7f3a"
            gives: "1800 or a little less"
          - call: "GET session:7f3a"
            gives: "the same value as before"
      - id: keep_forever
        title: "Make the promo permanent"
        xp: 20
        hints:
          - "TTL promo:diwali shows its timer is counting down. You want the opposite of EXPIRE."
          - "One command removes a key's timer and keeps its value."
          - "After it, TTL promo:diwali should answer -1, and GET still shows the offer."
        examples:
          - call: "TTL promo:diwali"
            gives: "-1"
            note: "no timer: it stays"
          - call: "GET promo:diwali"
            gives: "the same value as before"
  - id: 03-hashes-and-lists
    title: Hashes and lists
    file: chapters/03-hashes-and-lists.md
    minutes: 20
    tasks:
      - id: menu_hash
        title: "A hash for the menu"
        xp: 20
        hints:
          - "A hash is one key that holds many field and value pairs. The key is menu, the fields are the item names."
          - "HSET takes the key, then field value, field value, ... in one command. Names with a space need quotes."
          - "Check your work with HGETALL menu: three fields, prices 30, 40 and 25."
        examples:
          - call: "HGET menu \"vada pav\""
            gives: "\"25\""
          - call: "HLEN menu"
            gives: "3"
      - id: customer_profile
        title: "Asha's profile, one more visit, a gold tier"
        xp: 20
        hints:
          - "Start with HSET customer:42 and two field and value pairs: name and visits."
          - "Adding to one numeric field in one step is the hash version of INCRBY."
          - "HINCRBY the visits field by 1, then HSET one more field, tier, to gold. HGETALL shows all three."
        examples:
          - call: "HGET customer:42 visits"
            gives: "\"8\""
          - call: "HGET customer:42 tier"
            gives: "\"gold\""
      - id: order_queue
        title: "Run the order queue"
        xp: 20
        hints:
          - "Orders go in on the left with LPUSH, one at a time or all at once in arrival order."
          - "The oldest order is the one furthest from where you push, so it comes off the right."
          - "LPUSH o1, o2 and o3, then RPOP once. LRANGE orders:pending 0 -1 should show o3 then o2."
        examples:
          - call: "LRANGE orders:pending 0 -1"
            gives: "1) \"o3\"  2) \"o2\""
            note: "o1 was made first"
  - id: 04-sets-and-sorted-sets
    title: Sets and sorted sets
    file: chapters/04-sets-and-sorted-sets.md
    minutes: 20
    setup: ["bash", "/lab/setup/04.sh"]
    tasks:
      - id: unique_visitors
        title: "Count each visitor once"
        xp: 20
        hints:
          - "A set never holds the same member twice, so you can add every visit as it happened."
          - "SADD takes the key and any number of members. Duplicates are simply ignored."
          - "Add all five visits to visitors:today; SCARD should then answer 3."
        examples:
          - call: "SCARD visitors:today"
            gives: "3"
          - call: "SISMEMBER visitors:today meera"
            gives: "1"
      - id: common_customers
        title: "Customers of both outlets, in customers:both"
        xp: 20
        hints:
          - "You want the people who are in the first set and also in the second: an intersection."
          - "SINTER shows the intersection; its STORE version saves it under a new key."
          - "The destination key comes first, then the two outlet sets. SMEMBERS customers:both shows the result."
        examples:
          - call: "SMEMBERS customers:both"
            gives: "only people in both outlets' sets"
      - id: top_sellers
        title: "A sorted set of today's sales"
        xp: 20
        hints:
          - "A sorted set keeps members ordered by a number called the score. ZADD adds members with their scores."
          - "ZADD takes the key, then score member, score member. ZINCRBY adds to one member's score."
          - "ZRANGE sales:today 0 -1 REV WITHSCORES lists them, best seller first: 120, 80, then 50."
        examples:
          - call: "ZSCORE sales:today \"cold coffee\""
            gives: "\"50\""
          - call: "ZREVRANGE sales:today 0 0"
            gives: "\"filter coffee\""
  - id: 05-redis-from-python
    title: Redis from Python
    file: chapters/05-redis-from-python.md
    minutes: 20
    tasks:
      - id: profile_api
        title: "GET /customers/{cid}: a profile from a hash"
        xp: 30
        hints:
          - "One command reads every field of a hash. In Python it returns a dict."
          - "A missing hash comes back as an empty dict: answer 404 when there is nothing."
          - "Build the answer from the dict, and turn the visits field into an int before returning it."
        examples:
          - call: "curl -s localhost:8000/customers/42"
            gives: "{\"id\": 42, \"name\": \"Asha\", \"visits\": 8, \"tier\": \"gold\"}"
          - call: "curl -s -o /dev/null -w '%{http_code}' localhost:8000/customers/7"
            gives: "404"
      - id: bulk_import
        title: "POST /import: 2000 rows in a handful of round trips"
        xp: 40
        hints:
          - "The loop sends one command per row and waits for each answer. That waiting is the cost."
          - "A pipeline queues commands on the client and sends them together. r.pipeline gives you one."
          - "Queue every HSET on the pipeline inside the loop, then run them all with one call after the loop."
        examples:
          - call: "curl -s -X POST localhost:8000/import"
            gives: "the same 2000 rows"
            note: "in a few round trips"
  - id: 06-caching-for-real
    title: Caching for real
    file: chapters/06-caching-for-real.md
    minutes: 25
    tasks:
      - id: price_cache
        title: "GET /price/{item}: cache-aside for 60 seconds"
        xp: 40
        hints:
          - "Cache-aside: look in Redis first, and only on a miss call the slow lookup and keep the answer."
          - "r.get returns None on a miss. r.set takes an ex= argument: the number of seconds to keep the value."
          - "Use one key per item, like price:samosa. Redis gives strings back, so turn the price into an int."
        examples:
          - call: "curl -s localhost:8000/price/samosa"
            gives: "{\"item\": \"samosa\", \"price\": 20}"
            note: "slow once, then instant"
          - call: "GET billing:calls"
            gives: "one more per minute at most"
      - id: price_invalidate
        title: "PUT /price/{item}: the next read sees the new price"
        xp: 30
        hints:
          - "After the price changes, the cached copy is wrong. What should happen to it?"
          - "Removing the cached value is enough: the next read misses and asks billing again."
          - "Delete the price key for that item right after updating PRICES."
        examples:
          - call: "PUT price 22, then GET /price/samosa"
            gives: "{\"item\": \"samosa\", \"price\": 22}"
      - id: stampede_lock
        title: "30 requests on an empty cache, one call to billing"
        xp: 50
        hints:
          - "Only one request may call billing. The others must notice someone is already on it."
          - "SET with nx=True succeeds for exactly one caller. Give that key a short expiry so a crash cannot block everyone."
          - "The winner fills the cache and deletes its lock; the others sleep 50 ms at a time and read the cache again."
        examples:
          - call: "30 requests for an empty cache at once"
            gives: "1 call to billing"
            note: "all 30 get the price"
  - id: 07-atomic-operations
    title: Atomic operations
    file: chapters/07-atomic-operations.md
    minutes: 20
    tasks:
      - id: otp_limit
        title: "POST /otp/{phone}: at most 3 OTPs a minute"
        xp: 40
        hints:
          - "Count requests per phone number in Redis, and let the count disappear after a minute."
          - "r.incr(key) adds one and returns the new count, even for a key that does not exist yet."
          - "Give the key a 60 second expiry when the count is 1, and raise HTTPException with status 429 above 3."
        examples:
          - call: "4 x POST /otp/9876543210 within a minute"
            gives: "200, 200, 200, 429"
          - call: "the 5th call a minute later"
            gives: "200"
            note: "the count reset"
      - id: redeem_points
        title: "POST /redeem/{cid}: never double-spend"
        xp: 50
        hints:
          - "The read, the check and the write must happen as one step, with nothing in between."
          - "A Lua script runs atomically inside Redis. register_script turns its source into a function you can call."
          - "In the script: read the balance, return -1 when it is too low, otherwise DECRBY and return the result. Answer 409 on -1."
        examples:
          - call: "20 x POST /redeem/77?points=100 at once, 500 points"
            gives: "5 x 200, 15 x 409"
          - call: "GET loyalty:77"
            gives: "\"0\""
            note: "never below zero"
  - id: 08-distributed-locks
    title: Distributed locks
    file: chapters/08-distributed-locks.md
    minutes: 25
    tasks:
      - id: book_once
        title: "POST /book/{table}: exactly one winner"
        xp: 50
        hints:
          - "Take a lock for the table before checking whether it is free, and give up (409) if you cannot get it."
          - "SET with nx=True and px= takes the lock; its value should be a random token, for example from uuid4."
          - "Hold the lock around the check and the booking, and release it in a finally block, even when you answer 409."
        examples:
          - call: "30 x POST /book/5 at the same moment"
            gives: "1 x 200, 29 x 409"
      - id: safe_unlock
        title: "Release a lock only if it is yours"
        xp: 40
        hints:
          - "Before deleting, the value must be compared with the token. Doing that in two commands is a race."
          - "A short Lua script can GET the key and DEL it only when the value equals the token, in one step."
          - "Pass the lock key in KEYS and the token in ARGV, and return whether something was deleted."
        examples:
          - call: "release lock:x with the wrong token"
            gives: "the lock stays"
          - call: "release lock:x with its own token"
            gives: "the lock is gone"
  - id: 09-streams
    title: Streams and consumer groups
    file: chapters/09-streams.md
    minutes: 25
    setup: ["bash", "/lab/setup/09.sh"]
    tasks:
      - id: orders_stream
        title: "Three orders on orders:stream"
        xp: 20
        hints:
          - "XADD appends one entry to a stream. Let Redis pick the ID with *."
          - "After the ID come field value pairs: the order field and the item field. Quote item names with a space."
          - "Three XADD commands in order o1, o2, o3; XRANGE orders:stream - + shows them oldest first."
        examples:
          - call: "XLEN orders:stream"
            gives: "3"
          - call: "XRANGE orders:stream - +"
            gives: "o1, o2, o3, in order"
      - id: kitchen_group
        title: "A kitchen group: read three, acknowledge one"
        xp: 40
        hints:
          - "XGROUP CREATE makes a group on a stream. Starting at 0 means from the oldest entry."
          - "XREADGROUP with GROUP kitchen barista1 and the special ID > hands out entries nobody has received yet."
          - "Acknowledge only o1's ID with XACK. XPENDING orders:stream kitchen should then show 2."
        examples:
          - call: "XPENDING orders:stream kitchen"
            gives: "2 pending, for barista1"
            note: "o2 and o3"
      - id: reclaim_stuck
        title: "worker-2 takes over the stuck payments"
        xp: 40
        hints:
          - "XPENDING shows who holds each payment and for how long. Someone alive must take them over."
          - "XAUTOCLAIM with a minimum idle time in milliseconds moves old pending entries to a new consumer."
          - "Claim as worker-2 with 60000 and start ID 0, then XACK both returned IDs in the billing group."
        examples:
          - call: "XPENDING payments:stream billing"
            gives: "0 pending"
            note: "worker-2 claimed and acknowledged them"
  - id: 10-memory-and-eviction
    title: Memory and eviction
    file: chapters/10-memory-and-eviction.md
    minutes: 20
    setup: ["bash", "/lab/setup/10.sh"]
    tasks:
      - id: find_big_key
        title: "Find and remove what filled Redis"
        xp: 60
        hints:
          - "One key is much bigger than everything else. The bigkeys option of redis-cli finds the biggest of each type."
          - "MEMORY USAGE on a key shows its real size. Look for a key that should never have grown."
          - "Remove only that one key (UNLINK frees a big key without blocking). The cache entries must stay."
        examples:
          - call: "redis-cli --bigkeys"
            gives: "no runaway key left"
          - call: "the cache, carts and sessions"
            gives: "all still there"
      - id: eviction_policy
        title: "Evict cache entries, never real data"
        xp: 40
        hints:
          - "The policy decides what Redis may throw away when it is full. Real data here has no TTL."
          - "Policies starting with allkeys may evict anything; the ones starting with volatile only touch keys with a TTL."
          - "CONFIG SET maxmemory-policy to the volatile version of least recently used."
        examples:
          - call: "CONFIG GET maxmemory-policy"
            gives: "a volatile-* policy"
            note: "only keys with a TTL can go"
  - id: 11-persistence
    title: Persistence
    file: chapters/11-persistence.md
    minutes: 15
    setup: ["bash", "/lab/setup/11.sh"]
    tasks:
      - id: aof_on
        title: "Turn on the append-only file, flushed every second"
        xp: 30
        hints:
          - "Two settings: one turns the log on, the other says how often it is flushed to disk."
          - "CONFIG SET appendonly takes yes or no; appendfsync takes always, everysec or no."
          - "Set appendonly to yes and appendfsync to everysec, then check with CONFIG GET append*."
        examples:
          - call: "CONFIG GET appendonly"
            gives: "\"yes\""
          - call: "CONFIG GET appendfsync"
            gives: "\"everysec\""
      - id: fresh_snapshot
        title: "Take a snapshot now"
        xp: 30
        hints:
          - "A snapshot can be taken in the background while Redis keeps serving."
          - "BGSAVE starts one. If the append-only file is still being rewritten, BGSAVE SCHEDULE waits for it."
          - "Check INFO persistence: rdb_last_bgsave_status should be ok and the last save time recent."
        examples:
          - call: "INFO persistence"
            gives: "rdb_last_bgsave_status:ok"
            note: "and a recent rdb_last_save_time"
  - id: 12-scaling
    title: Replication and clusters
    file: chapters/12-scaling.md
    minutes: 20
    setup: ["bash", "/lab/setup/12.sh"]
    tasks:
      - id: replica_sync
        title: "Make the second server a live replica"
        xp: 40
        hints:
          - "The command runs on the server that should become the replica, so talk to it with -h replica."
          - "REPLICAOF takes the primary's host and port: here redis and 6379."
          - "INFO replication on the replica should show role slave and master_link_status up."
        examples:
          - call: "redis-cli -h replica INFO replication"
            gives: "master_link_status:up"
          - call: "SET on redis, GET on replica"
            gives: "the same value"
      - id: hash_tags
        title: "Customer 42's cart and wishlist in one cluster slot"
        xp: 40
        hints:
          - "In a cluster, a key's slot comes from a hash of its name. Different names usually mean different slots."
          - "Only the part between curly braces is hashed, when the key name has one."
          - "Put the same part in braces in both names, for example a braced customer 42 followed by :cart and :wishlist."
        examples:
          - call: "the slots of customer 42's cart and wishlist keys"
            gives: "the same slot"
  - id: 13-production-capstone
    title: "Capstone: production is slow"
    file: chapters/13-production-capstone.md
    minutes: 25
    setup: ["bash", "/lab/setup/13.sh"]
    tasks:
      - id: scan_not_keys
        title: "GET /sessions/active with SCAN, not KEYS"
        xp: 50
        hints:
          - "KEYS returns everything in one blocking call. SCAN returns a little at a time with a cursor."
          - "The Python client has scan_iter, which runs the SCAN cursor loop for you; match and count are arguments."
          - "Count what scan_iter yields for the session pattern, with a count of about 1000 per step."
        examples:
          - call: "curl -s localhost:8000/sessions/active"
            gives: "the exact count"
            note: "counted with SCAN"
      - id: unlink_culprit
        title: "Remove the slow key without blocking"
        xp: 50
        hints:
          - "SLOWLOG GET shows the slow commands and the key they touched."
          - "DEL frees memory on the main thread while everyone waits. There is a command that frees it in the background."
          - "Use UNLINK on that one key, and leave the sessions alone."
        examples:
          - call: "the huge key from the slow log"
            gives: "gone, freed in the background"
          - call: "the sessions"
            gives: "all still there"
