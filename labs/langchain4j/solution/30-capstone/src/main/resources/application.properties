# Setu, the help desk of Sahyadri Rail, as a web API.
spring.application.name=setu
server.port=8080

# LangChain4j's Spring Boot starter builds the OpenAiChatModel from these properties.
# OPENAI_BASE_URL and OPENAI_API_KEY are set in your lab machine (the LabBox gateway).
langchain4j.open-ai.chat-model.base-url=${OPENAI_BASE_URL}
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=ai-chat
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.embedding-model.base-url=${OPENAI_BASE_URL}
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=ai-embed
