id: langchain4j
version: 2
title: "LangChain4j"
subtitle: Build Setu, the help desk of a hill railway, with LangChain4j and Java, from how language models work to agents.
description: "Learn AI engineering in Java with LangChain4j: how language models really work (neurons, tokens,
  embeddings, attention, built yourself in plain Java), calling a model over HTTP, with the official OpenAI SDK and
  with LangChain4j, model parameters, hallucinations and token costs, AI Services, prompt templates, structured output,
  streaming, chat memory, a Spring Boot AI API, tools, MCP clients and servers, embedding stores, RAG, local models,
  guardrails, observability and testing, and agents and agentic workflows, by building Setu, the passenger help desk
  of Sahyadri Rail, with LangChain4j 1.24."
language: java
track: ai
tags: [java, ai, langchain4j]
level: intermediate
estimated_minutes: 1055
cover_scene: "A friendly help desk assistant made of light at a small hill railway station in the Western Ghats, a train climbing a green ghat behind it in the monsoon."
cover: cover.svg
cover_credit: { by: "Logo: LangChain4j", source: "LangChain4j project (Apache 2.0)" }
image: labbox/langchain4j:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
llm:
  enabled: true
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
- id: ai-basics
  title: AI, machine learning, deep learning and generative AI
  file: chapters/01-ai-basics.md
  minutes: 45
  folder: 01-ai-basics
  part: How language models work
  tasks:
  - id: rule_reply
    title: answer with hand-written rules
    xp: 20
    hints:
    - Rules.reply still returns UNKNOWN for every question. Look for each rule's keyword in the question.
    - Lower-case the question once at the start, with toLowerCase(Locale.ROOT), so "REFUND" matches "refund".
    - 'Check the rules in order with String.contains: refund, then luggage or bag, then pet or dog; otherwise UNKNOWN.'
    examples:
    - call: Rules.reply("REFUND please")
      gives: the REFUND answer
      note: capitals do not matter
    - call: Rules.reply("Can I bring two bags?")
      gives: the LUGGAGE answer
  - id: learn_threshold
    title: learn a threshold from examples
    xp: 20
    hints:
    - bestThreshold returns 0 for every data set. It should try each delay in minutesLate as the threshold.
    - mistakes(candidate, minutesLate, complained) already counts how wrong one candidate is. Keep the candidate with the fewest.
    - When two candidates make the same number of mistakes, keep the smaller candidate.
    examples:
    - call: bestThreshold(last week's ten trains)
      gives: '12'
      note: 1 of 10 examples wrong
- id: neurons
  title: 'Neural networks: a neuron in Java'
  file: chapters/02-neurons.md
  minutes: 45
  folder: 02-neurons
  tasks:
  - id: neuron_fire
    title: make the neuron fire
    xp: 20
    hints:
    - fire always returns 0. It should add up every input times its weight, plus the bias.
    - Start a running total at the bias, then loop over the inputs adding inputs[i] * weights[i].
    - Return 1 only when the total is strictly greater than 0; a total of exactly 0 does not fire.
    examples:
    - call: fire([1, 0], [0.5, 0.5], -0.4)
      gives: '1'
      note: 0.5 - 0.4 = 0.1
    - call: fire([1, 1], [0.5, -0.5], 0)
      gives: '0'
      note: exactly zero does not fire
  - id: train_neuron
    title: train it with the perceptron rule
    xp: 20
    hints:
    - train returns zero weights without learning. Each epoch should go through every example and correct the weights.
    - 'For one example: error = the answer minus what fire(...) guesses with the current weights.'
    - Add rate * error * that example's input to each weight, and rate * error to the bias, then move to the next example.
    examples:
    - call: train(the 8 late-train days, 20 epochs, rate 0.1)
      gives: weights [0.1, 0.2, 0.3], bias -0.2
      note: every day predicted right
- id: language-models
  title: From NLP to language models
  file: chapters/03-language-models.md
  minutes: 45
  folder: 03-language-models
  tasks:
  - id: count_words
    title: count words in a bag of words
    xp: 20
    hints:
    - count returns an empty map. It should hold every word of the text with how often it appears.
    - Words.split(text) gives the words, lower-cased and without punctuation. Count each one.
    - Map.merge(word, 1, Integer::sum) adds one to a word's count; a TreeMap keeps the words A to Z.
    examples:
    - call: count("The Ghat Express, the GHAT express!")
      gives: '{express=2, ghat=2, the=2}'
  - id: next_word
    title: predict the next word with a bigram model
    xp: 20
    hints:
    - next returns null for every word. Look up the word's followers in follows first.
    - follows.get(word) is null for a word never seen with a follower; return null then.
    - Go through the followers (a TreeMap, so A to Z) and keep the one with the highest count; on a tie, keep the first.
    examples:
    - call: next("the") after training on the announcements
      gives: '"ghat"'
    - call: next("platform")
      gives: '"one"'
- id: tokens
  title: Tokens and the context window
  file: chapters/04-tokens.md
  minutes: 45
  folder: 04-tokens
  tasks:
  - id: count_tokens
    title: count tokens like gpt-4o-mini
    xp: 20
    hints:
    - Tokens.count returns 0. The ESTIMATOR above it already knows gpt-4o-mini's tokenizer.
    - OpenAiTokenCountEstimator has a method that counts the tokens in one text.
    - Return what ESTIMATOR.estimateTokenCountInText gives for the text.
    examples:
    - call: count("Lonavala")
      gives: '3'
      note: '[L][onav][ala]'
    - call: count("पुणे ते लोणावळा गाडी किती वाजता आहे?")
      gives: '18'
  - id: fit_window
    title: keep the newest messages that fit
    xp: 20
    hints:
    - fit returns every message. It should keep only the newest ones whose tokens fit in the budget.
    - Loop from the last message to the first, adding Tokens.count of each to a running total.
    - Stop at the first message that would go over the budget; insert kept messages at the front so they stay oldest first.
    examples:
    - call: fit(the five-message chat, 40)
      gives: the last two messages
- id: embeddings
  title: Embeddings, vectors and dimensions
  file: chapters/05-embeddings.md
  minutes: 45
  folder: 05-embeddings
  tasks:
  - id: cosine
    title: compute cosine similarity
    xp: 20
    hints:
    - cosine returns 0 for every pair. It needs a dot product and two vector lengths.
    - In one loop, add up a[i] * b[i], a[i] * a[i] and b[i] * b[i].
    - Divide the dot product by the square root of each sum of squares multiplied together.
    examples:
    - call: cosine([3, 4], [4, 3])
      gives: '0.96'
    - call: cosine([1, 2], [10, 20])
      gives: '1.0'
      note: same direction
  - id: closest_question
    title: answer by meaning
    xp: 20
    hints:
    - answer always says it does not know. It should compare the question with every FAQ question by meaning.
    - embed(question) gives the question's vector; embed each key of ENTRIES too, and score the pair with Vectors.cosine.
    - Keep the entry with the highest score and return its value, the answer.
    examples:
    - call: answer("How heavy can my suitcase be?")
      gives: the 40 kg luggage answer
      note: no shared keyword
- id: transformers
  title: Transformers, attention, and how an LLM answers
  file: chapters/06-transformers.md
  minutes: 50
  folder: 06-transformers
  tasks:
  - id: softmax_temperature
    title: softmax with temperature
    xp: 20
    hints:
    - softmax returns zeros. It should turn the scores into probabilities that add up to 1.
    - First divide every score by the temperature and find the largest result.
    - Use Math.exp of each scaled score minus that largest, then divide every value by the sum of them all.
    examples:
    - call: softmax([2, 1, 0], 1.0)
      gives: '[0.665, 0.245, 0.090]'
    - call: softmax([1000, 999], 1.0)
      gives: '[0.731, 0.269]'
      note: no overflow
  - id: attention_weights
    title: compute attention weights
    xp: 20
    hints:
    - weights returns zeros. Each key needs a score against the query first.
    - A key's score is dot(query, key) divided by Math.sqrt of the query's length.
    - Turn the array of scores into weights with your softmax, at temperature 1.0.
    examples:
    - call: weights(the query of "it", keys of train, station, it)
      gives: '[0.46, 0.18, 0.36]'
- id: raw-http
  title: A model over plain HTTP
  file: chapters/07-raw-http.md
  minutes: 45
  folder: 07-raw-http
  part: Calling a model from Java
  tasks:
  - id: send_request
    title: send a chat completion request
    xp: 20
    hints:
    - send returns an empty string and never calls the server. It needs an HttpRequest to baseUrl + "/chat/completions".
    - 'Use HttpRequest.newBuilder(URI.create(...)) with two .header(...) calls and .POST(BodyPublishers.ofString(...)).'
    - The Authorization header's value is the word Bearer, a space, then apiKey. Send with CLIENT and return the body.
    examples:
    - call: send(gateway, key, "Which trains do you run?")
      gives: the response JSON
  - id: read_answer
    title: read the answer from the JSON
    xp: 20
    hints:
    - answer returns an empty string. The text is deep inside the response JSON.
    - JSON.readTree(responseJson) gives a tree; path(...) walks it without throwing.
    - 'Walk choices, then index 0, then message, then content, and return it with asString().'
    examples:
    - call: answer(the response JSON)
      gives: the assistant's text, quotes and line breaks intact
- id: openai-sdk
  title: The official OpenAI Java SDK
  file: chapters/08-openai-sdk.md
  minutes: 40
  folder: 08-openai-sdk
  tasks:
  - id: sdk_client
    title: build an OpenAI client
    xp: 20
    hints:
    - client returns null. The SDK builds clients with OpenAIOkHttpClient.builder().
    - The builder takes the base URL and the API key, each with a method of the same name.
    - Chain the two settings on the builder and finish with build().
    examples:
    - call: client(gateway, key)
      gives: an OpenAIClient for the gateway
  - id: sdk_ask
    title: ask with typed parameters
    xp: 20
    hints:
    - ask returns an empty string. Build ChatCompletionCreateParams with its builder first.
    - 'The params builder takes the model alias, then addSystemMessage and addUserMessage, then build().'
    - 'Send with client.chat().completions().create(params); the text is in choices().get(0).message().content(), an Optional.'
    examples:
    - call: ask(client, "Which trains do you run?")
      gives: Setu's answer as a String
- id: first-app
  title: Your first LangChain4j app
  file: chapters/09-first-app.md
  minutes: 45
  folder: 09-first-app
  tasks:
  - id: chat_model
    title: build an OpenAiChatModel
    xp: 20
    hints:
    - chatModel returns null. LangChain4j models are built with a builder.
    - OpenAiChatModel.builder() takes the base URL, the API key and a model name.
    - The model name is the gateway's alias for this course, ai-chat. Return the built model as a ChatModel.
    examples:
    - call: chatModel(gateway, key).chat("Hello")
      gives: a real answer from gpt-4o-mini
  - id: system_message
    title: send a system message and a user message
    xp: 20
    hints:
    - ask sends only the question, so the model does not know it is Setu.
    - model.chat(...) accepts several messages; SystemMessage.from(...) and UserMessage.from(...) make them.
    - The result is a ChatResponse; the answer text is in its aiMessage().
    examples:
    - call: ask(model, "Who are you?")
      gives: Hello! I am Setu, ...
- id: parameters
  title: Model parameters and requests
  file: chapters/10-parameters.md
  minutes: 40
  folder: 10-parameters
  tasks:
  - id: steady_model
    title: a model with temperature 0
    xp: 20
    hints:
    - steadyModel builds a model without a temperature, so the default (1.0) applies.
    - The OpenAiChatModel builder has a method for the sampling temperature.
    - Add the temperature call before build(), with the value zero as a double.
    examples:
    - call: steadyModel(...).chat(a slogan question) three times
      gives: the same slogan three times
  - id: short_answer
    title: limit one answer's length
    xp: 20
    hints:
    - ask sends the messages without any limit on the answer.
    - ChatRequest.builder() takes the messages and per-request parameters, then build().
    - The parameter is maxOutputTokens; pass the request to model.chat(...) and return its ChatResponse.
    examples:
    - call: ask(model, "Describe the journey to Ratnagiri.", 20)
      gives: an answer cut after 20 tokens
      note: finish reason LENGTH
- id: hallucinations
  title: Open and closed models, and hallucinations
  file: chapters/11-hallucinations.md
  minutes: 45
  folder: 11-hallucinations
  tasks:
  - id: honest_prompt
    title: allow "I don't know"
    xp: 20
    hints:
    - honestSystem returns SYSTEM unchanged, so the model is never told what to do when it does not know.
    - Add one more sentence to SYSTEM; it must contain the exact words I don't know.
    - Say when to use it (the answer is not in the facts), where to send the passenger, and never to invent times or fares.
    examples:
    - call: honestSystem()
      gives: Setu's instructions plus a rule for not knowing
  - id: grounded_answer
    title: answer from the facts
    xp: 20
    hints:
    - ask sends only SYSTEM, so the model never sees the timetable.
    - 'The system message should hold honestSystem(), then a blank line, then Facts: and the timetable from facts().'
    - Join them into one string for SystemMessage.from(...), send it with the question, and return the answer's text.
    examples:
    - call: ask(model, "Does the Konkan Breeze run on Tuesdays?")
      gives: No, it does not run on Tuesdays.
- id: usage
  title: Response metadata and token usage
  file: chapters/12-usage.md
  minutes: 40
  folder: 12-usage
  tasks:
  - id: token_usage
    title: read the token usage
    xp: 20
    hints:
    - usage returns zeros. The counts come with every ChatResponse.
    - response.metadata() holds a TokenUsage, with a count for input and one for output.
    - Return a new Usage made from the input token count and the output token count.
    examples:
    - call: usage(response to "Hi!")
      gives: Usage[inputTokens=37, outputTokens=9]
  - id: answer_cost
    title: turn tokens into dollars
    xp: 20
    hints:
    - dollars returns 0. Input and output tokens have different prices.
    - Each price is per million tokens, so multiply by the price and divide by 1,000,000.
    - Add the input part and the output part; the price constants are doubles, so keep them first in the formula.
    examples:
    - call: dollars(new Usage(180, 60))
      gives: '0.000063'
- id: ai-services
  title: AI Services
  file: chapters/13-ai-services.md
  minutes: 40
  folder: 13-ai-services
  part: AI Services
  tasks:
  - id: ai_service
    title: let LangChain4j implement Setu
    xp: 20
    hints:
    - assistant returns null. LangChain4j can implement the Assistant interface for you.
    - The AiServices class has a static method that takes an interface and a ChatModel.
    - Pass Assistant.class and the model to that method and return what it creates.
    examples:
    - call: assistant(model).chat("Hello!")
      gives: Hello! I'm Setu, ...
  - id: system_annotation
    title: attach the instructions with an annotation
    xp: 20
    hints:
    - The model gets no system message, so it answers as a generic assistant.
    - An annotation on the chat method can load the system message from a file on the classpath.
    - Use the SystemMessage annotation from dev.langchain4j.service, with fromResource set to the file's name.
    examples:
    - call: the request for chat("Hello")
      gives: a system message with the text of setu-system.txt
- id: templates
  title: Prompt templates
  file: chapters/14-templates.md
  minutes: 40
  folder: 14-templates
  tasks:
  - id: prompt_template
    title: fill a prompt template
    xp: 20
    hints:
    - delayPrompt returns an empty string. DELAY already holds the template.
    - A PromptTemplate's apply method takes a map from each blank's name to its value.
    - The keys are train, destination and minutes; the result is a Prompt, whose text() is the string.
    examples:
    - call: delayPrompt("Konkan Breeze", "Ratnagiri", 25)
      gives: '... the Konkan Breeze to Ratnagiri is running 25 minutes late ...'
  - id: template_service
    title: a template on an AI Service method
    xp: 20
    hints:
    - LangChain4j refuses ask(...) because it does not know where station and question go.
    - The UserMessage annotation holds the template; the V annotation names the blank a parameter fills.
    - Put the template from the TODO on the method, and V("station"), V("question") (with @) on the two parameters.
    examples:
    - call: ask("Lonavala", "Where is the cloakroom?")
      gives: 'user message: A passenger at Lonavala station asks: Where is the cloakroom?'
- id: structured
  title: Structured output
  file: chapters/15-structured.md
  minutes: 45
  folder: 15-structured
  tasks:
  - id: extract_trip
    title: return a TripRequest record
    xp: 20
    hints:
    - trip still returns a String, so the booking system would have to parse text.
    - When an AI Service method returns a record, LangChain4j sends its JSON schema and parses the answer.
    - Change only the return type of trip, from String to TripRequest; keep the annotation.
    examples:
    - call: trip("3 tickets from Pune to Karjat this Saturday")
      gives: TripRequest[from=Pune, to=Karjat, date=..., passengers=3]
  - id: classify_topic
    title: classify with an enum
    xp: 20
    hints:
    - Reader has no method for topics yet.
    - A method returning the Topic enum makes the model choose one of its six values.
    - Add a method named topic taking the message as a String, with the UserMessage text from the TODO.
    examples:
    - call: topic("I cancelled yesterday, where is my money?")
      gives: REFUND
- id: streaming
  title: Streaming answers
  file: chapters/16-streaming.md
  minutes: 45
  folder: 16-streaming
  tasks:
  - id: stream_tokens
    title: stream with a handler
    xp: 20
    hints:
    - stream returns a future nobody ever completes, and never calls the model.
    - model.chat(question, handler) takes a StreamingChatResponseHandler with three callbacks.
    - Pass each partial response to onToken, complete the future in onCompleteResponse, and completeExceptionally in onError.
    examples:
    - call: stream(model, "Why do trains slow down on a ghat?", print)
      gives: 56 pieces, the first after about a second
  - id: token_stream
    title: a streaming AI Service
    xp: 20
    hints:
    - ask returns a future nobody completes.
    - setu.chat(question) returns a TokenStream; attach callbacks to it in a chain.
    - Use onPartialResponse, onCompleteResponse (with the answer's text) and onError, then call start().
    examples:
    - call: ask(setu, "Hello! Which trains do you run?", print)
      gives: the answer, word by word, then its full text
- id: memory
  title: Chat memory
  file: chapters/17-memory.md
  minutes: 45
  folder: 17-memory
  tasks:
  - id: window_memory
    title: give Setu a memory
    xp: 20
    hints:
    - assistant uses AiServices.create, which has no memory, so every question starts from nothing.
    - AiServices.builder(Assistant.class) takes the model and a chatMemory.
    - Give it a MessageWindowChatMemory that keeps the last 10 messages, then build().
    examples:
    - call: chat("My name is Meera."), then chat("What is my name?")
      gives: Your name is Meera.
  - id: memory_per_passenger
    title: one memory per passenger
    xp: 20
    hints:
    - A method with @MemoryId needs memories chosen by id, so the desk cannot answer yet.
    - The builder's chatMemoryProvider takes a function from a memory id to a ChatMemory.
    - For each id, build a MessageWindowChatMemory with that id and 10 messages.
    examples:
    - call: chat("ravi", "What did I lose?") after Ravi lost an umbrella
      gives: your umbrella
    - call: chat("asha", "What did I lose?")
      gives: a question back, not Ravi's umbrella
- id: rest-api
  title: An AI REST API with Spring Boot
  file: chapters/18-rest-api.md
  minutes: 45
  folder: 18-rest-api
  tasks:
  - id: ai_service_bean
    title: make Setu a Spring bean
    xp: 20
    hints:
    - The app does not start, because nothing implements SetuAssistant for the controller.
    - The LangChain4j Spring Boot starter implements interfaces that carry one annotation.
    - Put the AiService annotation from dev.langchain4j.service.spring on the SetuAssistant interface.
    examples:
    - call: the app starting
      gives: a SetuAssistant bean, wired with the model and the memory provider
  - id: chat_endpoint
    title: expose POST /chat
    xp: 20
    hints:
    - POST /chat answers 404, because no method handles it.
    - A method with PostMapping("/chat") and a RequestBody ChatRequest parameter receives the JSON.
    - Ask setu.chat with the request's passenger and message, and return a ChatReply with the passenger and the answer.
    examples:
    - call: 'POST /chat {"passenger": "meera", "message": "What did I just ask you about?"}'
      gives: '{"passenger": "meera", "answer": "You asked if the Konkan Breeze ..."}'
- id: tools
  title: Tools (function calling)
  file: chapters/19-tools.md
  minutes: 45
  folder: 19-tools
  part: Tools, MCP and knowledge
  tasks:
  - id: date_tool
    title: a date tool in Java
    xp: 20
    hints:
    - nextDate returns an empty string, and the model cannot see it because it has no annotation.
    - DayOfWeek.valueOf turns "SATURDAY" into a day; trim and upper-case the text first. TemporalAdjusters has next(day).
    - Annotate the method with the Tool description and the parameter with the P description from the TODO.
    examples:
    - call: nextDate("saturday") on Monday 2026-11-23
      gives: '"2026-11-28"'
    - call: nextDate("Monday") on Monday 2026-11-23
      gives: '"2026-11-30"'
      note: the next one, not today
  - id: tools_in_service
    title: give Setu its tools
    xp: 20
    hints:
    - assistant uses AiServices.create, which gives the model no tools.
    - AiServices.builder(Assistant.class) has a method that takes objects with @Tool methods.
    - Pass the RailTools object to that method, with the chat model, then build().
    examples:
    - call: chat("3 tickets to Karjat this Saturday?")
      gives: 28 November, Rs 420
      note: the model called nextDate and fare
- id: mcp-client
  title: 'MCP: using a filesystem MCP server'
  file: chapters/20-mcp-client.md
  minutes: 45
  folder: 20-mcp-client
  tasks:
  - id: mcp_client
    title: connect to the filesystem server
    xp: 20
    hints:
    - filesystem returns null. An MCP client needs a transport first.
    - StdioMcpTransport.builder() takes the command that starts the server, as a list of the program and its arguments.
    - The command is mcp-server-filesystem followed by the folder; give the transport to DefaultMcpClient.builder() with the key notices.
    examples:
    - call: filesystem(notices).listTools()
      gives: 14 tools, list_directory and read_text_file among them
  - id: mcp_tool_provider
    title: offer only two of the tools
    xp: 20
    hints:
    - assistant gives the model none of the server's tools.
    - Build it like assistantWithAllTools, with a McpToolProvider for the client.
    - The McpToolProvider builder can keep only some tools by name; keep list_directory and read_text_file.
    examples:
    - call: chat("Is any work planned that affects the Konkan Breeze?")
      gives: Yes, 40 minutes late on 29 and 30 November
- id: mcp-server
  title: Building your own MCP server in Java
  file: chapters/21-mcp-server.md
  minutes: 40
  folder: 21-mcp-server
  tasks:
  - id: mcp_server
    title: serve RailTools over MCP
    xp: 20
    hints:
    - main does nothing, so the process ends before a client can talk to it.
    - An McpServer takes the list of tool objects and an McpImplementation with a name and a version.
    - Wrap it in a StdioMcpServerTransport on System.in and System.out, then join the current thread so the process stays alive.
    examples:
    - call: an MCP client listing the server's tools
      gives: fare and nextDate
  - id: own_server_client
    title: connect to your own server
    xp: 20
    hints:
    - connect returns null. It needs a transport that starts your server.
    - The command is java, -cp, the classpath, then the server class com.setu.RailMcpServer.
    - Give that StdioMcpTransport to DefaultMcpClient.builder() with the key sahyadri-rail, then build().
    examples:
    - call: connect(classpath) then fare(Ratnagiri) over MCP
      gives: '420'
- id: embedding-stores
  title: Embedding models and stores
  file: chapters/22-embedding-stores.md
  minutes: 45
  folder: 22-embedding-stores
  tasks:
  - id: store_cards
    title: store the cards with metadata
    xp: 20
    hints:
    - load returns an empty store.
    - For each card, make a TextSegment from its text with title and type as Metadata, and embed it with the model.
    - Add each embedding with its segment to an InMemoryEmbeddingStore, and return the store.
    examples:
    - call: load(model, Cards.ALL)
      gives: a store with 6 entries
  - id: search_store
    title: search with a threshold
    xp: 20
    hints:
    - search returns an empty list.
    - EmbeddingSearchRequest.builder() takes the question's embedding, the number of results and a minimum score.
    - Use a minimum score of 0.7, call store.search(...), and collect each match's title metadata in order.
    examples:
    - call: search(store, model, "Can I take my bicycle?", 2)
      gives: '[Luggage]'
    - call: search(store, model, "What is the capital of France?", 2)
      gives: '[]'
- id: rag
  title: Retrieval-augmented generation (RAG)
  file: chapters/23-rag.md
  minutes: 50
  folder: 23-rag
  tasks:
  - id: ingest_rules
    title: index the rule documents
    xp: 20
    hints:
    - ingest returns an empty store.
    - FileSystemDocumentLoader.loadDocuments reads every file in a folder with a parser; TextDocumentParser reads plain text.
    - An EmbeddingStoreIngestor with a recursive splitter of 300 characters and overlap 30, the model and a store ingests them.
    examples:
    - call: ingest(model, docs)
      gives: a store with about 10 pieces, each knowing its file_name
  - id: rag_answer
    title: answer from the rules
    xp: 20
    hints:
    - assistant has no content retriever, so the model never sees the rules.
    - AiServices.builder(Assistant.class) takes a content retriever as well as the chat model.
    - Pass retriever(store, embeddingModel), which is already written, then build().
    examples:
    - call: chat("Can I bring my guitar?")
      gives: Yes, up to 1.5 metres, free
- id: local-models
  title: Local models with Ollama, and model routing
  file: chapters/24-local-models.md
  minutes: 40
  folder: 24-local-models
  tasks:
  - id: ollama_model
    title: a model on your own machine
    xp: 20
    hints:
    - ollama returns null.
    - OllamaChatModel.builder() takes the server's base URL and the model name, like the other models.
    - Set the temperature to zero as well, then build().
    examples:
    - call: ollama("http://localhost:11434", "qwen2.5:0.5b").chat("What is a hill railway?")
      gives: an answer from the local model
  - id: routing_model
    title: route between two models
    xp: 20
    hints:
    - routing always returns the large model.
    - RoutingChatModel.builder() takes routes (name, description, model), a router and a default route.
    - The router returns ChatModelRoutingResult.route("complex") when lastLength(...) is over 120, else "simple"; the default route is complex.
    examples:
    - call: routing(small, large).chat("Hi!")
      gives: answered by the small model
