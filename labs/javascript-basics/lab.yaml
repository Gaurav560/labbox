id: javascript-basics
version: 2
title: JavaScript from zero
subtitle: From your very first line of JavaScript to objects, classes, promises and real programs, one curious step at a time.
description: 'Learn JavaScript from the very first line: values and types, decisions, loops, strings, arrays,
  objects, sets, array methods, errors, classes, async and await, and reading files. Plain explanations,
  everyday examples and real tests.'
language: javascript
track: languages
tags: [javascript, beginner]
level: beginner
estimated_minutes: 795
cover: cover.svg
cover_credit: { by: "Logos: javascript", source: "devicon (MIT)" }
image: labbox/javascript-basics:v1
resources:
  cpus: 0.5
  memory: 512m
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
check:
  command: [bash, /check/tests/run_checks.sh]
  timeout_seconds: 30
  network: none
chapters:
- id: hello-js
  title: Your first JavaScript program
  file: chapters/01-hello-js.md
  minutes: 45
  folder: 01-hello-js
  part: Starting out
  tasks:
  - id: hello_mixtape
    title: 'mixtape.js: Mixtape says hello'
    hints:
    - Look at first.js. Each console.log prints one line.
    - Text goes inside quotes, and each line ends with a semicolon.
    - Two lines, two console.log calls, the words exactly as shown, capitals and full stops included.
    examples:
    - call: node mixtape.js
      gives: 'Hello! I am Mixtape. / I will play your songs.'
      note: two lines
  - id: fix_first_errors
    title: 'fixme.js: fix it until it runs'
    hints:
    - Run node fixme.js and read the first error. Which line, and what is missing?
    - Every ( needs a matching ).
    - After that fix, run it again. A ReferenceError means a name is spelled wrong.
    examples:
    - call: node fixme.js
      gives: 'Mixtape is starting... / Ready to play your songs. / Songs in the playlist: 12'
      note: three lines
- id: 01-first-program
  title: Functions
  file: chapters/02-functions.md
  minutes: 40
  folder: 02-functions
  tasks:
  - id: greet
    title: 'hello.js: greet(name)'
    hints:
    - Right now greet returns an empty string. What should it give back instead?
    - A template literal uses backticks and puts a value inside with ${...}.
    - Put the name between "Hello, " and "!" inside one template literal, and return it.
    examples:
    - call: greet("Asha")
      gives: '"Hello, Asha!"'
    - call: greet("Kabir")
      gives: '"Hello, Kabir!"'
  - id: total_minutes
    title: 'hello.js: totalMinutes(hours, minutes)'
    hints:
    - How many minutes are in one hour?
    - Turn the hours into minutes first, then add the extra minutes.
    - Multiply hours by 60, add minutes, and return the result.
    examples:
    - call: totalMinutes(2, 15)
      gives: '135'
    - call: totalMinutes(0, 45)
      gives: '45'
- id: 02-values-and-types
  title: Values and types
  file: chapters/03-values-and-types.md
  minutes: 40
  folder: 03-values-and-types
  tasks:
  - id: percent
    title: 'numbers.js: percent(scored, total)'
    hints:
    - What should happen when total is 0? Answer that before you divide.
    - scored / total gives a fraction; times 100 gives a percentage.
    - To keep one decimal, multiply by 10, round with Math.round, then divide by 10.
    examples:
    - call: percent(45, 50)
      gives: '90'
    - call: percent(1, 3)
      gives: '33.3'
      note: one decimal
    - call: percent(7, 0)
      gives: '0'
  - id: format_rupees
    title: 'numbers.js: formatRupees(paise)'
    hints:
    - There are 100 paise in a rupee.
    - toFixed(2) turns a number into text with exactly two decimals.
    - Divide by 100, use toFixed(2), and put the ₹ sign in front with a template literal.
    examples:
    - call: formatRupees(1250)
      gives: '"₹12.50"'
    - call: formatRupees(5)
      gives: '"₹0.05"'
- id: 03-decisions
  title: Making decisions
  file: chapters/04-decisions.md
  minutes: 40
  folder: 04-decisions
  tasks:
  - id: grade
    title: 'decisions.js: grade(marks)'
    hints:
    - Answer the impossible marks (below 0, above 100) before anything else.
    - Then check from the top down, 80 first, so each mark meets exactly one rule.
    - Use >= so that 80, 60 and 40 themselves get the higher grade.
    examples:
    - call: grade(80)
      gives: '"A"'
    - call: grade(79)
      gives: '"B"'
    - call: grade(101)
      gives: '"Invalid"'
  - id: leap_year
    title: 'decisions.js: isLeapYear(year)'
    hints:
    - year % 4 === 0 is true when the year divides by 4 exactly.
    - Years divisible by 100 are the exception, unless they divide by 400.
    - Combine the three rules with && and || in one return line.
    examples:
    - call: isLeapYear(2024)
      gives: 'true'
    - call: isLeapYear(1900)
      gives: 'false'
    - call: isLeapYear(2000)
      gives: 'true'
- id: 04-loops
  title: Loops
  file: chapters/05-loops.md
  minutes: 40
  folder: 05-loops
  tasks:
  - id: sum_to
    title: 'loops.js: sumTo(n)'
    hints:
    - Start a total at 0 before the loop.
    - Count i from 1 up to n, including n itself.
    - Add i to the total inside the loop, and return the total after it.
    examples:
    - call: sumTo(5)
      gives: '15'
      note: 1 + 2 + 3 + 4 + 5
    - call: sumTo(100)
      gives: '5050'
  - id: count_vowels
    title: 'loops.js: countVowels(text)'
    hints:
    - A for...of loop visits each character of a string.
    - Lower-case the text first, so "A" and "a" are the same.
    - '"aeiou".includes(ch) tells you whether ch is a vowel.'
    examples:
    - call: countVowels("Hello World")
      gives: '3'
    - call: countVowels("rhythm")
      gives: '0'
- id: finding-bugs
  title: Finding bugs
  file: chapters/06-finding-bugs.md
  minutes: 45
  folder: 06-finding-bugs
  tasks:
  - id: fix_total_length
    title: 'playlist.js: the total that forgets a song'
    hints:
    - 620 should come out, 420 does. 620 - 420 = 200. Which song is missing?
    - Add console.log("i =", i) inside the loop and run node playlist.js. Which positions does the loop visit?
    - Positions in an array start at 0. Look at where the loop variable starts.
    examples:
    - call: totalLength([200, 180, 240])
      gives: '620'
    - call: totalLength([])
      gives: '0'
  - id: fix_can_add
    title: 'playlist.js: at the limit means no more songs'
    hints:
    - Try canAdd(10, 10) in the REPL. A playlist with 10 songs and a limit of 10 has no room left.
    - Print room before the return. What is room exactly at the limit?
    - Adding needs some room left, more than none. Compare the symbols > and >= on the last line.
    examples:
    - call: canAdd(9, 10)
      gives: 'true'
    - call: canAdd(10, 10)
      gives: 'false'
      note: at the limit
- id: 05-strings
  title: Strings
  file: chapters/07-strings.md
  minutes: 40
  folder: 07-strings
  part: Working with data
  tasks:
  - id: count_words
    title: 'words.js: countWords(text)'
    hints:
    - Several spaces in a row should still count as one gap.
    - trim() removes the spaces at the ends; split(/\s+/) splits on runs of spaces.
    - 'Text that is only spaces has no words: check for that before counting the pieces.'
    examples:
    - call: countWords("JavaScript is fun")
      gives: '3'
    - call: countWords("  lots   of   spaces  ")
      gives: '3'
  - id: clean_name
    title: 'words.js: cleanName(raw)'
    hints:
    - Split the name into words first, ignoring extra spaces.
    - For each word, the first letter goes upper case and the rest lower case.
    - Glue the words back together with join(" ").
    examples:
    - call: cleanName("  riya   SHARMA ")
      gives: '"Riya Sharma"'
    - call: cleanName("ARJUN")
      gives: '"Arjun"'
- id: 06-arrays
  title: Arrays
  file: chapters/08-arrays.md
  minutes: 40
  folder: 08-arrays
  tasks:
  - id: top_n
    title: 'arrays.js: topN(numbers, n)'
    hints:
    - sort changes the array it is called on. Whose array is that?
    - Make a copy with the spread syntax first, then sort the copy, biggest first.
    - slice(0, n) keeps the first n items, and is fine when n is bigger than the array.
    examples:
    - call: topN([72, 45, 90, 66], 2)
      gives: '[90, 72]'
      note: the array passed in stays as it was
    - call: topN([5, 1], 5)
      gives: '[5, 1]'
  - id: unique
    title: 'arrays.js: unique(items)'
    hints:
    - Build a new array and add each item only the first time you meet it.
    - includes tells you whether an array already holds a value.
    - Loop over items, and push an item when the new array does not include it yet.
    examples:
    - call: unique(["jelly", "cookie", "jelly", "mint"])
      gives: '["jelly", "cookie", "mint"]'
    - call: unique([])
      gives: '[]'
- id: 07-objects
  title: Objects
  file: chapters/09-objects.md
  minutes: 40
  folder: 09-objects
  tasks:
  - id: cart_total
    title: 'cart.js: cartTotal(cart)'
    hints:
    - Each line of the cart is an object with a price and a qty.
    - Keep a running total, and add each line's price times its qty.
    - Read the fields with a dot, like line.price, inside a for...of loop.
    examples:
    - call: 'cartTotal([{ price: 20, qty: 2 }, { price: 15, qty: 1 }])'
      gives: '55'
    - call: cartTotal([])
      gives: '0'
  - id: with_discount
    title: 'cart.js: withDiscount(item, percent)'
    hints:
    - The item you were given belongs to the caller. Should it change?
    - '{ ...item } copies every field into a new object.'
    - After the copy, give the new object a price lowered by percent, rounded to paise.
    examples:
    - call: 'withDiscount({ name: "jelly", price: 20 }, 10)'
      gives: '{ name: "jelly", price: 18 }'
      note: the item passed in stays as it was
- id: 08-objects-and-sets
  title: Counting with objects, sets and maps
  file: chapters/10-counting.md
  minutes: 40
  folder: 10-counting
  tasks:
  - id: word_counts
    title: 'counting.js: wordCounts(words)'
    hints:
    - Start with an empty object, and lower-case each word before you use it as a key.
    - counts[key] is undefined the first time; ?? 0 turns that into 0.
    - For each word, store the count so far plus one under its key.
    examples:
    - call: wordCounts(["jelly", "Cookie", "JELLY", "jelly"])
      gives: '{ jelly: 3, cookie: 1 }'
    - call: wordCounts([])
      gives: '{}'
  - id: common_items
    title: 'counting.js: commonItems(a, b)'
    hints:
    - A Set answers "is this in there?" with has, and keeps each value once.
    - Make a Set from b, then keep the items of a that it has.
    - Remove the repeats from a with a Set too, then sort the result.
    examples:
    - call: commonItems(["toast", "cookie", "mint"], ["mint", "toast", "jelly"])
      gives: '["mint", "toast"]'
- id: 09-array-methods
  title: Array methods and arrow functions
  file: chapters/11-array-methods.md
  minutes: 45
  folder: 11-array-methods
  tasks:
  - id: passing
    title: 'marks.js: passing(marks)'
    hints:
    - filter keeps the items for which your function answers true.
    - An arrow function looks like m => (a test on m).
    - The test is "40 or more", and 40 itself passes.
    examples:
    - call: passing([72, 30, 90, 40, 39])
      gives: '[72, 90, 40]'
  - id: sort_by_length
    title: 'marks.js: sortByLength(words)'
    hints:
    - sort changes the array it is called on, so sort a copy.
    - A compare function returns a negative number when a should come first.
    - Compare the lengths first; when they are equal, compare the words alphabetically with localeCompare.
    examples:
    - call: sortByLength(["banana", "fig", "apple", "kiwi", "date"])
      gives: '["fig", "date", "kiwi", "apple", "banana"]'
      note: ties alphabetical
- id: modules-and-json
  title: Modules and JSON
  file: chapters/12-modules-and-json.md
  minutes: 45
  folder: 12-modules-and-json
  tasks:
  - id: save_playlist
    title: 'playlist.js: savePlaylist(name, songs)'
    hints:
    - First build a plain object with three properties, then turn it into text.
    - count is how many songs there are, and an array knows its own length.
    - JSON.stringify turns any plain object into JSON text. Give back that text.
    examples:
    - call: 'savePlaylist("Rainy day", [{ title: "Monsoon Drive", seconds: 245 }])'
      gives: '{"name":"Rainy day","count":1,"songs":[...]}'
  - id: load_playlist
    title: 'playlist.js: loadPlaylist(text)'
    hints:
    - The text has to become an object again before you can read its songs.
    - An old file may have no songs at all. ?? gives a fallback for undefined.
    - Turn each song into its title with map.
    examples:
    - call: 'loadPlaylist(''{"name":"Quiet","songs":[]}'')'
      gives: '[]'
    - call: 'loadPlaylist(''{"name":"Old"}'')'
      gives: '[]'
      note: no songs at all
- id: 10-errors
  title: Errors
  file: chapters/13-errors.md
  minutes: 45
  folder: 13-errors
  part: Real programs
  tasks:
  - id: parse_age
    title: 'ages.js: parseAge(text)'
    hints:
    - Trim the text first, then decide whether it is only digits.
    - A regular expression like /^\d+$/ matches text made of digits only.
    - Throw a TypeError when it is not a whole number and a RangeError above 150, and name the value in the message.
    examples:
    - call: parseAge(" 42 ")
      gives: '42'
    - call: parseAge("abc")
      gives: TypeError
      note: 'message: not a whole number: "abc"'
  - id: safe_sum
    title: 'ages.js: safeSum(values)'
    hints:
    - Number("x") gives NaN, and Number.isNaN tells you when that happened.
    - Number("") gives 0, so an empty value needs its own check.
    - Add the good values to a total and push the others into a bad array; return both in one object.
    examples:
    - call: safeSum(["10", "x", "2.5", ""])
      gives: '{ total: 12.5, bad: ["x", ""] }'
    - call: safeSum([])
      gives: '{ total: 0, bad: [] }'
- id: 11-classes
  title: Classes
  file: chapters/14-classes.md
  minutes: 45
  folder: 14-classes
  tasks:
  - id: bank_account
    title: 'bank.js: deposit and withdraw'
    hints:
    - Check the amount first, and throw before changing anything.
    - '"Positive" means more than 0; withdraw also needs enough money in the account.'
    - Throw a RangeError for a bad amount; otherwise add to or take from this.#balance.
    examples:
    - call: deposit(500), then withdraw(200)
      gives: balance is 300
    - call: withdraw(1000)
      gives: RangeError
      note: balance unchanged
  - id: total_area
    title: 'bank.js: Circle area() and totalArea(shapes)'
    hints:
    - Circle needs a method with the same name as Rect's.
    - Math.PI times the radius squared; ** 2 squares a number.
    - totalArea calls area() on each shape and adds them up, then rounds to 2 decimals.
    examples:
    - call: totalArea([new Rect(3, 4), new Circle(1)])
      gives: '15.14'
    - call: totalArea([])
      gives: '0'
- id: 12-async
  title: Promises and async/await
  file: chapters/15-async.md
  minutes: 45
  folder: 15-async
  tasks:
  - id: fetch_all
    title: 'prices.js: fetchAll(items, fetchPrice)'
    hints:
    - Awaiting inside the loop waits for each price before asking for the next one.
    - Call fetchPrice for every item first, without await, to get an array of promises.
    - Promise.all waits for all of them and keeps their order.
    examples:
    - call: fetchAll(["cookie", "bun"], fetchPrice)
      gives: '[30, 15]'
      note: same order as the items
    - call: four fetches of about 100 ms
      gives: about 100 ms in all
      note: all at once
  - id: retry
    title: 'prices.js: retry(task, times)'
    hints:
    - Loop up to times times, and await the task inside try.
    - When it works, return its result straight away.
    - In catch, remember the error; after the loop, throw the last one you saw.
    examples:
    - call: retry(failsTwiceThenOk, 5)
      gives: '"ok"'
      note: on the third try
    - call: retry(alwaysFails, 2)
      gives: throws the last error
- id: files-and-cli
  title: Files and a command-line program
  file: chapters/16-files-and-cli.md
  minutes: 50
  folder: 16-files-and-cli
  tasks:
  - id: read_playlist
    title: 'library.js: readPlaylist(path)'
    hints:
    - Read the whole file as text, then cut it into lines. The first line is the header, not a song.
    - Destructure each row into title and seconds. A blank line or a row with no title has an empty title.
    - Keep a row only when seconds is digits and nothing else, and store seconds as a number.
    examples:
    - call: readPlaylist("playlist.csv")[0]
      gives: '{ title: "Monsoon Drive", seconds: 245 }'
    - call: readPlaylist("missing.csv")
      gives: throws (ENOENT)
  - id: playlist_cli
    title: 'cli.js: the playlist tool'
    hints:
    - The file name the user typed is process.argv[2]. When it is missing, print a usage line with console.error.
    - Wrap readPlaylist in try and catch. A missing file throws an error whose code is ENOENT.
    - process.exit(1) for a missing file and process.exit(2) for no file name. Minutes and seconds come from the total with Math.floor and the remainder.
    examples:
    - call: node cli.js playlist.csv
      gives: '4 songs, 17:36 in all / Longest: Slow Sunday'
    - call: node cli.js missing.csv
      gives: 'File not found: missing.csv'
      note: stderr, exit code 1
- id: testing
  title: Testing with node:test
  file: chapters/17-testing.md
  minutes: 50
  folder: 17-testing
  tasks:
  - id: fix_skip
    title: 'skip.js: make the red test green'
    hints:
    - node --test shows which test failed, its message, and what it got.
    - With 3 songs the positions are 0, 1 and 2. After 2, Skip must give 0.
    - The remainder operator % wraps a number around. What is 3 % 3?
    examples:
    - call: nextIndex(0, 3)
      gives: '1'
    - call: nextIndex(2, 3)
      gives: '0'
      note: wraps around
  - id: test_duration
    title: 'duration.test.js: tests that catch a broken duration'
    hints:
    - 'Read the rules in duration.js: two-digit seconds, hours from one hour up, negative numbers refused.'
    - Test the edges, where bugs live. A song under ten seconds past the minute, exactly one hour, and just under an hour.
    - A negative number must throw. assert.throws checks that.
    examples:
    - call: node --test
      gives: your tests pass on the real formatDuration
      note: and fail on three broken copies of it
- id: 13-capstone
  title: 'Capstone: a monthly report'
  file: chapters/18-capstone.md
  minutes: 60
  folder: 18-capstone
  part: Capstone
  tasks:
  - id: read_totals
    title: 'report.js: readTotals(path)'
    hints:
    - fs.readFileSync(path, "utf8") gives the whole file as text; split it into lines.
    - Skip line 0 (the header) and blank lines, then split each line on commas.
    - Skip rows with no category or an amount that is not a number; round each total to 2 decimals.
    examples:
    - call: readTotals("expenses.csv").rent
      gives: '18000'
    - call: readTotals("expenses.csv").shopping
      gives: '4095'
  - id: monthly_report
    title: 'report.js: monthlyReport(path)'
    hints:
    - Read the rows once, keeping each row's line number (its index plus 1).
    - Sort them into good rows and bad rows; blank lines are neither.
    - Work out total, count, average (0 when there are no rows), perCategory and badLines from those two groups.
    examples:
    - call: monthlyReport(the five lines in Guess first)
      gives: total 18120, count 2
      note: badLines [3, 4]
    - call: monthlyReport("expenses.csv").count
      gives: '41'
