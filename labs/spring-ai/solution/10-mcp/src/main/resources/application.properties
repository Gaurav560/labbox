# Atlas, the visitor guide of the Deccan Science Museum.
spring.application.name=atlas
server.port=8080

# The model is reached through the LabBox gateway: OPENAI_BASE_URL and OPENAI_API_KEY are set in your lab machine.
spring.ai.openai.base-url=${OPENAI_BASE_URL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=ai-chat
spring.ai.openai.embedding.options.model=ai-embed

# Atlas as an MCP server, at http://localhost:8080/mcp
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=atlas-museum
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Facts about the Deccan Science Museum in Pune: dates, opening hours and planetarium shows.
