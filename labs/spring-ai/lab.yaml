id: spring-ai
version: 2
title: "Spring AI"
subtitle: Build Atlas, a museum guide powered by a language model, with Spring Boot 4 and Spring AI 2.
description: "Learn to build AI features in Java: what language models are and what they cost, prompts and system
  prompts, options and tokens, streaming, structured output, memory, tools, MCP, embeddings, vector stores, retrieval
  (RAG), pictures, evaluation, guardrails, cost and metrics, and agent workflows, by building Atlas, the visitor
  guide of a science museum in Pune, with Spring Boot 4 and Spring AI 2.1."
language: java
track: ai
tags: [java, spring-boot, ai]
level: intermediate
estimated_minutes: 995
cover_scene: "A friendly museum guide robot made of light standing in a science museum hall, with a planetarium dome and a swinging pendulum behind it."
cover: cover.svg
cover_credit: { by: "Logos: spring-ai", source: "Spring AI reference documentation" }
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Spring Boot basics and Java. This course builds an AI museum guide with Spring AI, and explains every AI idea
    from the beginning, but it assumes you can build a small Spring Boot REST API.
  needs:
  - know: Java, meaning classes, interfaces, lists and records
    why: Every chapter is Java code.
    lab: java-basics
    where: chapters 1 to 15
  - know: A Spring Boot REST controller, dependency injection and application properties
    why: Atlas is a Spring Boot application; Spring AI plugs into it the Spring way.
    lab: spring-boot-first-api
    where: chapters 0 to 11, up to Reading the request
  - know: What a language model is
    why: Not required. Chapter 1 explains it from the beginning, with no mathematics.
image: labbox/spring-ai:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
llm:
  enabled: true
preview:
  - { name: "Atlas", port: 8080, path: "/ask?q=Hello" }
  - { name: "Lobby screen", port: 8080, path: "/" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
- id: why-ai
  title: Why AI in your app, and your first call
  file: chapters/01-why-ai.md
  minutes: 50
  folder: 01-why-ai
  part: First steps
  tasks:
  - id: first_call
    title: connect /ask to the model
    xp: 20
    hints:
    - 'The ChatClient is already built in the constructor: start a request with chat.prompt().'
    - 'The visitor''s question is the user message: .user(q). Then send it and wait with .call().'
    - End the chain with content(), which gives the answer's text, and return that.
    examples:
    - call: curl -s localhost:8080/ask?q=Hello
      gives: the model's answer
  - id: model_alias
    title: use the course's model
    xp: 10
    hints:
    - 'The app''s log shows the gateway''s answer: it lists the model names labs may use.'
    - The chat model is set by spring.ai.openai.chat.options.model in application.properties.
    - Set it to the alias for chat models in this course, then restart the app.
    examples:
    - call: grep model application.properties
      gives: the chat model is ai-chat
- id: prompts
  title: Prompts that behave
  file: chapters/02-prompts.md
  minutes: 50
  folder: 02-prompts
  tasks:
  - id: system_prompt
    title: Atlas's system prompt
    xp: 20
    hints:
    - Rules for every conversation belong in a system message, set once on the ChatClient builder.
    - builder.defaultSystem("...") before .build(). A Java text block (three double quotes) keeps it readable.
    - Say who the model is (Atlas), where (the Deccan Science Museum), what is allowed, and what to do otherwise.
    examples:
    - call: /ask?q=Hello, who are you?
      gives: Hello! I am Atlas, ...
  - id: prompt_template
    title: explain any exhibit, for any age
    xp: 20
    hints:
    - A template has placeholders in braces, like {exhibit} and {age}.
    - In .user(u -> ...), u.text(template) sets the words and u.param(name, value) fills one placeholder.
    - Two params, exhibit and age; then call it and take its content, as in /ask.
    examples:
    - call: /explain?exhibit=Foucault pendulum&age=7
      gives: a short explanation for a child
- id: options
  title: Options, tokens and cost
  file: chapters/03-options.md
  minutes: 45
  folder: 03-options
  tasks:
  - id: chat_options
    title: steady and short answers
    xp: 20
    hints:
    - Options travel with the prompt, before .call().
    - OpenAiChatOptions.builder() has temperature(...) and maxTokens(...); pass the builder to .options(...).
    - 'Temperature 0.2 and at most 300 tokens. No .build() at the end: Spring AI 2.0 takes the builder.'
    examples:
    - call: 3 x /ask?q=fun fact about Saturn
      gives: nearly the same answer
  - id: token_usage
    title: what an answer cost
    xp: 20
    hints:
    - chatResponse() at the end of the chain, instead of content(), gives you the whole response.
    - The text is response.getResult().getOutput().getText(); the counts are in response.getMetadata().getUsage().
    - 'Usage has getPromptTokens(), getCompletionTokens() and getTotalTokens(): put them in a CostedAnswer.'
    examples:
    - call: /ask/costed?q=What is a black hole?
      gives: answer, 96, 53, 149
- id: streaming
  title: Streaming answers
  file: chapters/04-streaming.md
  minutes: 45
  folder: 04-streaming
  tasks:
  - id: stream_answer
    title: stream the answer
    xp: 20
    hints:
    - 'Replace .call() with .stream(): the answer then arrives as a Flux, piece by piece.'
    - 'After stream(), content() gives a Flux<String>. Return it: Spring sends each piece as an event.'
    - The method already produces text/event-stream; just return the Flux from the chat chain.
    examples:
    - call: curl -sN /stream?q=Why is the sky blue?
      gives: 'data:The ... data: sky ...'
  - id: stream_events
    title: token events, then done
    xp: 20
    hints:
    - Start from the same Flux<String> of pieces.
    - .map(piece -> ServerSentEvent.builder(piece).event("token").build()) names each piece.
    - concatWith(Flux.just(...)) adds one last event, built with .event("done").
    examples:
    - call: curl -sN /stream/events?q=...
      gives: event:token ... event:done
- id: structured
  title: Structured output into Java
  file: chapters/05-structured.md
  minutes: 50
  folder: 05-structured
  tasks:
  - id: tour_plan
    title: a tour plan as a record
    xp: 20
    hints:
    - entity(SomeRecord.class) at the end of the chain, instead of content(), returns a record.
    - Use a template for the minutes, then .call().entity(TourPlan.class).
    - Spring AI adds TourPlan's JSON schema to the prompt for you, and reads the JSON answer into the record.
    examples:
    - call: /tour?minutes=60
      gives: '{title, stops: [...]}'
  - id: exhibit_list
    title: three suggestions as a list
    xp: 20
    hints:
    - 'Models answer more reliably with an object than with a bare list: Suggestions wraps the list.'
    - Ask for three exhibits for the interest, and read the answer into the Suggestions record with entity(...).
    - 'Then return its list: the record''s accessor is exhibits().'
    examples:
    - call: /suggest?interest=dinosaurs
      gives: '[three names]'
- id: memory
  title: Conversations that remember
  file: chapters/06-memory.md
  minutes: 50
  folder: 06-memory
  part: Conversations and tools
  tasks:
  - id: session_memory
    title: one session per visitor
    xp: 20
    hints:
    - Memory is an advisor on the ChatClient, built on the session service the constructor receives.
    - defaultAdvisors(SessionAdvisors.builder(sessions).build()) in the builder; then every call needs a session id.
    - In chat(), name the session for this call with SessionAdvisors.session(...), passing the visitor id, before call().
    examples:
    - call: /chat?visitor=ria ... then What is my name?
      gives: Your name is Ria!
  - id: memory_window
    title: compact long sessions
    xp: 20
    hints:
    - Compaction needs a trigger (when) and a strategy (what to keep), set together on the SessionAdvisors builder.
    - new TurnCountTrigger(8) fires when the view holds more than 8 turns.
    - WindowCompactionStrategy.builder().lastTurns(4).build() keeps the last 4 turns; pass both to compaction(...).
    examples:
    - call: 10 questions in one session
      gives: the 10th carries only the last 4 turns
- id: tools
  title: 'Tools: let the model call Java'
  file: chapters/07-tools.md
  minutes: 55
  folder: 07-tools
  tasks:
  - id: opening_hours_tool
    title: the opening hours
    xp: 20
    hints:
    - A tool is a method with @Tool(description = ...); its parameters can have @ToolParam(description = ...).
    - LocalDate.parse(date) reads the date; compare getDayOfWeek() with DayOfWeek.MONDAY.
    - 'Then offer the tools to the model in AskController: the prompt chain has a tools(...) method; give it the MuseumTools
      field.'
    examples:
    - call: /ask?q=Is the museum open next Monday?
      gives: closed on Mondays
  - id: show_times_tool
    title: planetarium shows
    xp: 20
    hints:
    - A second @Tool method in MuseumTools, with a date parameter like openingHours.
    - 'The ShowSchedule service already knows the shows: its showsOn(...) takes a LocalDate.'
    - 'Return the List<Show>: Spring AI sends it to the model as JSON.'
    examples:
    - call: /ask?q=Free seats this Saturday?
      gives: the 14:00 show is fully booked
- id: tool-safety
  title: Tools you can trust
  file: chapters/08-tool-safety.md
  minutes: 50
  folder: 08-tool-safety
  tasks:
  - id: confirm_booking
    title: no booking without a yes
    xp: 20
    hints:
    - Spring AI 2.1 can pause before a tool runs, until a person decides.
    - 'The @Tool annotation has an attribute for that: requiresConfirmation.'
    - Set it to true on bookSeats; the controller already handles the pause and the decision.
    examples:
    - call: /book?... then /book/ID/confirm?yes=true
      gives: booked only after the yes
  - id: tool_context
    title: the right visitor
    xp: 20
    hints:
    - The controller already passes the visitor in the tool context, under the key visitor.
    - A tool method can take a ToolContext parameter; the model never sees it.
    - Replace the visitorName parameter with ToolContext context, and read context.getContext().get("visitor").
    examples:
    - call: model asks to book for Sam
      gives: the booking is Ria's
- id: advisors
  title: Writing your own advisor
  file: chapters/09-advisors.md
  minutes: 50
  folder: 09-advisors
  tasks:
  - id: usage_advisor
    title: a token meter
    xp: 20
    hints:
    - Everything before chain.nextCall(request) happens on the way in; everything after, on the way back.
    - 'Keep what chain.nextCall(request) returns: its chatResponse().getMetadata().getUsage() has the tokens.'
    - Increment calls, add getTotalTokens() to tokens, and return the response.
    examples:
    - call: /ask twice, then /meter
      gives: calls 2, tokens ...
  - id: language_advisor
    title: answer in the visitor's language
    xp: 20
    hints:
    - request.context().get(LANGUAGE) is the language the controller passed, or null.
    - 'Requests are immutable: request.mutate().prompt(...).build() makes a changed copy.'
    - prompt.augmentSystemMessage(system -> system.mutate().text(...).build()) adds your line to the end of the system text.
    examples:
    - call: /ask?q=...&lang=Marathi
      gives: an answer in Marathi
- id: mcp
  title: The Model Context Protocol
  file: chapters/10-mcp.md
  minutes: 50
  folder: 10-mcp
  tasks:
  - id: mcp_server
    title: switch on the MCP server
    xp: 20
    hints:
    - The starter is already in the pom; the server is switched on with properties.
    - 'spring.ai.mcp.server.protocol chooses the transport: STREAMABLE serves MCP over HTTP at /mcp.'
    - Also set spring.ai.mcp.server.name to atlas-museum (and a version and instructions if you like).
    examples:
    - call: curl -X POST localhost:8080/mcp (initialize)
      gives: 'serverInfo: atlas-museum'
  - id: mcp_tools
    title: offer the museum's tools
    xp: 20
    hints:
    - The MCP server offers every ToolCallbackProvider bean to clients.
    - MethodToolCallbackProvider.builder().toolObjects(...) turns the @Tool methods of an object into one.
    - A @Bean method in McpConfig that takes MuseumTools and returns that provider.
    examples:
    - call: tools/list
      gives: today, nextDay, openingHours, planetariumShows
- id: embeddings
  title: Embeddings and similarity
  file: chapters/11-embeddings.md
  minutes: 50
  folder: 11-embeddings
  part: Knowledge
  tasks:
  - id: cosine_similarity
    title: cosine similarity in Java
    xp: 20
    hints:
    - 'One loop over both arrays adds up three sums: a[i] * b[i], a[i] * a[i] and b[i] * b[i].'
    - The first sum is the dot product; the square roots of the other two are the lengths.
    - Return the dot product divided by the product of the two lengths.
    examples:
    - call: cosine([1, 2], [2, 4])
      gives: '1.0'
    - call: cosine([1, 0], [0, 1])
      gives: '0.0'
  - id: nearest_exhibit
    title: the nearest exhibit
    xp: 20
    hints:
    - Embed the question with embeddings.embed(q), and all the exhibits in one request with embed(list).
    - 'Give each exhibit''s name and description together, like name + ": " + description.'
    - Keep the name whose vector has the highest Similarity.cosine with the question's vector.
    examples:
    - call: /nearest?q=Which exhibit shows that the Earth spins?
      gives: Foucault pendulum
- id: vector-store
  title: Vector stores
  file: chapters/12-vector-store.md
  minutes: 45
  folder: 12-vector-store
  tasks:
  - id: add_documents
    title: load the cards
    xp: 10
    hints:
    - The documents are ready in the list; the vector store is the field store.
    - VectorStore has an add(...) method that embeds each document as it stores it.
    - Pass the whole list to the store's add method at the end of run(...).
    examples:
    - call: start-up log
      gives: Loaded 12 exhibit cards into the vector store.
  - id: search_cards
    title: search by meaning
    xp: 20
    hints:
    - store.similaritySearch(...) takes a SearchRequest, built with SearchRequest.builder().
    - The builder has query(...), topK(...) and similarityThreshold(...).
    - Use q, k and 0.5, then build(); the code below already turns the documents into hits.
    examples:
    - call: /search?q=Where is the pendulum?
      gives: foucault-pendulum.md, 0.64
- id: etl
  title: Loading documents
  file: chapters/13-etl.md
  minutes: 50
  folder: 13-etl
  tasks:
  - id: read_cards
    title: read the cards
    xp: 20
    hints:
    - A MarkdownDocumentReader reads one resource; its get() returns the documents.
    - MarkdownDocumentReaderConfig.builder().withAdditionalMetadata("file", ...) adds the file name to each document.
    - Loop over the cards, read each one with its own config, and collect all the documents in one list.
    examples:
    - call: read(cards)
      gives: 14 documents from 12 cards
  - id: split_and_load
    title: split and load
    xp: 20
    hints:
    - TokenTextSplitter.builder() with withChunkSize(100), then build().
    - A splitter's apply(documents) returns the chunks; they keep each document's metadata.
    - Add the chunks to the store, and return them so the report can count them.
    examples:
    - call: /etl
      gives: '{files: 12, documents: 14, chunks: 23}'
- id: rag
  title: Retrieval-augmented generation
  file: chapters/14-rag.md
  minutes: 55
  folder: 14-rag
  tasks:
  - id: rag_answer
    title: answer from the cards
    xp: 20
    hints:
    - 'RAG in Spring AI is an advisor: QuestionAnswerAdvisor, built on the vector store.'
    - 'The advisor''s builder takes the vector store, and has searchRequest(...): topK 3 and similarityThreshold 0.35.'
    - Add it with defaultAdvisors(...) on the ChatClient builder, before build().
    examples:
    - call: /ask?q=How much is a ticket for a child?
      gives: 60 rupees
  - id: cite_sources
    title: answers with sources
    xp: 20
    hints:
    - chatClientResponse() at the end of the chain returns the response and the advisor context.
    - The context key QuestionAnswerAdvisor.RETRIEVED_DOCUMENTS holds the documents that were retrieved.
    - Map each document to its file metadata, keep each file once, and return them with the answer text.
    examples:
    - call: /ask/sourced?q=What did India find on the Moon?
      gives: chandrayaan-3.md
- id: vision
  title: Pictures in, words out
  file: chapters/15-vision.md
  minutes: 45
  folder: 15-vision
  part: Beyond text, and production
  tasks:
  - id: image_question
    title: a question about a photo
    xp: 20
    hints:
    - 'The user spec can carry text and media together: .user(u -> u.text(...).media(...)).'
    - media(...) takes the MIME type and the picture; both are ready in type and picture.
    - Replace .user(q) with the version that sends q and the picture in one message.
    examples:
    - call: POST /look (pendulum.jpg, What is this exhibit?)
      gives: a Foucault pendulum
  - id: exhibit_from_photo
    title: which exhibit is it?
    xp: 20
    hints:
    - 'Build the question from the list: String.join(", ", EXHIBITS) gives every name.'
    - Send the question and the picture in one user message, as in the first task.
    - End the chain with entity(...) and the Sighting record, instead of asking for plain text.
    examples:
    - call: POST /identify (skull.jpg)
      gives: '{exhibit: Rajasaurus skull, ...}'
- id: evaluation
  title: Is Atlas right? Evaluation
  file: chapters/16-evaluation.md
  minutes: 50
  folder: 16-evaluation
  tasks:
  - id: retrieval_eval
    title: measure retrieval
    xp: 20
    hints:
    - Loop over Golden.QUESTIONS; each has question() and file().
    - 'Search the store with SearchRequest.builder(): the question, topK 3, similarityThreshold 0.35.'
    - A hit when any found document's "file" metadata equals the golden file; otherwise add the question to misses.
    examples:
    - call: /eval/retrieval
      gives: '{total: 15, hits: 10, misses: [5 questions]}'
  - id: judge_answer
    title: a judge for answers
    xp: 20
    hints:
    - 'Spring AI''s RelevancyEvaluator takes a ChatClient.Builder: give it a fresh ChatClient.builder(model).'
    - An EvaluationRequest holds the question, the retrieved documents and the answer, in that order.
    - evaluate(request).isPass() is the verdict; return it with the answer.
    examples:
    - call: /ask/judged?q=How much is a ticket for a child?
      gives: '{answer: ..., relevant: true}'
- id: guardrails
  title: Guardrails
  file: chapters/17-guardrails.md
  minutes: 45
  folder: 17-guardrails
  tasks:
  - id: question_limit
    title: a length limit
    xp: 20
    hints:
    - Compare question.length() with maxChars before anything else in adviseCall.
    - GuardrailRefusal.generation(text) makes a refusal; ChatResponse.builder().generations(List.of(...)) wraps it.
    - Return ChatClientResponse.builder().chatResponse(refusal).context(request.context()).build() instead of calling the
      chain.
    examples:
    - call: /ask?q=(a 336-character attack)
      gives: That question is too long for me. ...
  - id: private_words
    title: a privacy guard
    xp: 20
    hints:
    - Spring AI ships SafeGuardAdvisor, with a builder.
    - Its builder takes sensitiveWords(...), failureResponse(...) and order(...).
    - Add it as the first argument of defaultAdvisors(...), with PRIVATE_WORDS, PRIVACY_REPLY and order 0.
    examples:
    - call: /ask?q=my phone number is ...
      gives: Please keep personal details ... to yourself.
- id: production
  title: Cost, speed and metrics
  file: chapters/18-production.md
  minutes: 45
  folder: 18-production
  tasks:
  - id: answer_cost
    title: the cost of an answer
    xp: 20
    hints:
    - End the chain with .chatResponse() to get the whole response, metadata included.
    - response.getMetadata().getUsage() has getPromptTokens() and getCompletionTokens().
    - Cost is tokens in times INPUT_PER_MILLION, plus tokens out times OUTPUT_PER_MILLION, each divided by a million.
    examples:
    - call: /ask/metered?q=When are you open?
      gives: '{promptTokens: 95, completionTokens: 31, costUsd: 0.0000329}'
  - id: ai_metrics
    title: AI metrics
    xp: 10
    hints:
    - Spring Boot Actuator is already in the pom; its web endpoints are hidden until you expose them.
    - The property is management.endpoints.web.exposure.include.
    - Expose the two endpoints health and metrics, separated by a comma.
    examples:
    - call: /actuator/metrics/gen_ai.client.token.usage
      gives: 'measurements: tokens counted'
- id: agents
  title: Workflows and agents
  file: chapters/19-agents.md
  minutes: 55
  folder: 19-agents
  tasks:
  - id: route_question
    title: route to the right desk
    xp: 20
    hints:
    - 'First call: the ROUTER system prompt, the question, and entity(...) with the Routing record; read its desk().'
    - 'Second call: the chosen desk''s prompt from DESKS, the same question, and the answer''s text.'
    - 'Return both: new Routed(desk, answer).'
    examples:
    - call: /agent/route?q=Are you open on Sunday?
      gives: '{desk: VISIT, ...}'
  - id: improve_loop
    title: review and rewrite
    xp: 20
    hints:
    - In a loop, ask system(REVIEWER) to check the draft against RULES, as .entity(Review.class).
    - Stop when review.approved() is true or drafts has reached 3.
    - Otherwise ask system(WRITER) to rewrite, giving it the draft and review.feedback(), and count the draft.
    examples:
    - call: /agent/label?exhibit=the prism room
      gives: '{text: ..., drafts: 1 to 3}'
- id: live
  title: Atlas goes live
  file: chapters/20-live.md
  minutes: 60
  folder: 20-live
  tasks:
  - id: assemble_atlas
    title: assemble Atlas
    xp: 20
    hints:
    - defaultTools(tools) offers the museum's tools on every call.
    - 'SessionAdvisors.builder(sessions)...build() returns a list: give it its own defaultAdvisors(...) call.'
    - A second defaultAdvisors(...) takes the SafeGuardAdvisor, new QuestionLimitAdvisor(300) and the QuestionAnswerAdvisor.
    examples:
    - call: 'POST /chat {visitor: ria, text: How long is the pendulum''s wire?}'
      gives: 15 metres
  - id: live_chat
    title: answers with sources
    xp: 20
    hints:
    - Keep the session advisor on the call, and end the chain with .chatClientResponse().
    - The retrieved documents are in response.context() under QuestionAnswerAdvisor.RETRIEVED_DOCUMENTS.
    - Map each to its "file" metadata, distinct(), and return them with the answer text.
    examples:
    - call: 'POST /chat {visitor: ria, text: What did India find on the Moon?}'
      gives: 'sources: [chandrayaan-3.md]'
