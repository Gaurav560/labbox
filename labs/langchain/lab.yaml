id: langchain
version: 2
title: "LangChain"
subtitle: Build Navin, the help desk of a farmers' cooperative, with LangChain and Python, from how language models work to agents in production.
description: "Learn AI engineering in Python with LangChain 1.5: how language models work (rules and learning, tokens,
  embeddings, attention, in plain Python), calling a model over HTTP, with the OpenAI SDK and with LangChain, model
  parameters, streaming, hallucinations and token costs, agents built by hand and with create_agent, tools, structured
  output, images, memory, streaming agents, documents, vector stores, RAG, retrieval quality, MCP, middleware,
  guardrails, human in the loop, testing and evals, by building Navin, the help desk of the Pimpalgaon Farmers'
  Cooperative near Nashik."
language: python
track: ai
tags: [python, ai, langchain]
level: intermediate
estimated_minutes: 675
cover_scene: "A friendly help desk assistant at a farmers' cooperative near Nashik, onion fields and grape vineyards behind it."
cover: cover.svg
cover_credit: { by: "Logo: LangChain", source: "Simple Icons (CC0)" }
image: labbox/langchain:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: lab
llm:
  enabled: true
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
- id: ai-basics
  title: AI, machine learning, deep learning and generative AI
  file: chapters/01-ai-basics.md
  minutes: 40
  folder: 01-ai-basics
  part: How language models work
  tasks:
  - id: rule_reply
    title: a rule-based help desk
    xp: 15
    hints:
    - rule_reply always returns UNKNOWN.
    - Lower-case the message once, then test for words with the in operator.
    - Office words first (office, open), then price words (price, rate), and UNKNOWN when nothing matched.
    examples:
    - call: rule_reply("When is the OFFICE open?")
      gives: OFFICE
    - call: rule_reply("kanda bhav?")
      gives: UNKNOWN
      note: no rule mentions it
  - id: learn_threshold
    title: learn a rule from examples
    xp: 20
    hints:
    - learn_threshold returns 0 whatever the examples are.
    - Every rain value in the examples is a candidate; accuracy(candidate, examples) scores it.
    - Go through the candidates from the smallest and keep one only when its score is strictly better.
    examples:
    - call: learn_threshold(EXAMPLES)
      gives: '8'
      note: 8 and 11 tie at 11 of 12
- id: tokens
  title: Tokens and the context window
  file: chapters/02-tokens.md
  minutes: 40
  folder: 02-tokens
  tasks:
  - id: count_tokens
    title: count tokens
    xp: 15
    hints:
    - count_tokens returns 0.
    - ENCODING.encode(text) returns a list of token numbers.
    - The count is the length of that list.
    examples:
    - call: count_tokens("What is the onion rate today?")
      gives: '7'
  - id: fit_window
    title: fit a conversation into a budget
    xp: 20
    hints:
    - fit_window returns every message, whatever the budget.
    - Walk with reversed(messages), adding each message's count_tokens to a running total.
    - Stop at the first message that would go over the budget, then reverse what you kept.
    examples:
    - call: fit_window(chat, 25)
      gives: the last two messages
- id: embeddings
  title: Embeddings, vectors and similarity
  file: chapters/03-embeddings.md
  minutes: 40
  folder: 03-embeddings
  tasks:
  - id: cosine
    title: cosine similarity
    xp: 15
    hints:
    - cosine returns 0.0.
    - The dot product is the sum of x * y over zip(a, b); a length is math.sqrt of the sum of squares.
    - Divide the dot product by the product of the two lengths.
    examples:
    - call: cosine([3, 4], [6, 8])
      gives: '1.0'
    - call: cosine([1, 0], [0, 1])
      gives: '0.0'
  - id: closest_question
    title: the closest FAQ question
    xp: 20
    hints:
    - closest_question returns an empty string.
    - max can choose among the keys of faq with a key function.
    - The key function gives each question the cosine of the query with that question's vector.
    examples:
    - call: closest_question(vector of "I need money to buy seeds", faq)
      gives: How much crop loan can I get?
- id: transformers
  title: Transformers, attention and the next token
  file: chapters/04-transformers.md
  minutes: 45
  folder: 04-transformers
  tasks:
  - id: softmax_temperature
    title: softmax with a temperature
    xp: 20
    hints:
    - softmax returns the scores unchanged.
    - Subtract max(scores) from each score and divide by the temperature before math.exp.
    - Divide each exponential by the sum of all of them.
    examples:
    - call: softmax([2.0, 1.0, 0.0])
      gives: '[0.665, 0.245, 0.090]'
  - id: attention_weights
    title: attention weights
    xp: 20
    hints:
    - attention returns zeros.
    - Score each key with the dot product of query and key, divided by math.sqrt(len(query)).
    - The weights are softmax of those scores.
    examples:
    - call: attention([1, 0], [[1, 0], [0, 1]])
      gives: '[0.670, 0.330]'
- id: raw-http
  title: A model over plain HTTP
  file: chapters/05-raw-http.md
  minutes: 40
  folder: 05-raw-http
  part: Calling a model
  tasks:
  - id: send_request
    title: send the chat request
    xp: 20
    hints:
    - ask never sends anything yet.
    - httpx.post takes the url, a headers dict and a json dict; the key goes after the word Bearer.
    - The body has model ai-chat and messages with a system dict (SYSTEM) and a user dict (the question).
    examples:
    - call: ask("When is the co-op office open?")
      gives: one POST to /chat/completions
  - id: read_answer
    title: read the answer
    xp: 15
    hints:
    - ask returns an empty string.
    - response.json() is a dict; the answer is in its choices list.
    - The first choice, then its message, then its content.
    examples:
    - call: ask("When is the co-op office open?")
      gives: the model's answer as text
- id: openai-sdk
  title: The OpenAI Python SDK
  file: chapters/06-openai-sdk.md
  minutes: 35
  folder: 06-openai-sdk
  tasks:
  - id: sdk_client
    title: a client with retries
    xp: 15
    hints:
    - client returns None.
    - OpenAI(...) takes base_url, api_key, timeout and max_retries.
    - Read the two values with os.environ, and use 60 seconds and 2 retries.
    examples:
    - call: client().max_retries
      gives: '2'
  - id: sdk_ask
    title: ask and read the usage
    xp: 20
    hints:
    - ask returns an empty answer and no usage.
    - openai.chat.completions.create takes model and messages, the same shape as chapter 5.
    - The text is in the first choice's message; the usage is an attribute of the completion.
    examples:
    - call: ask(client(), "Do you store tomatoes?")
      gives: (the answer, usage)
      note: usage.prompt_tokens, usage.completion_tokens
- id: first-app
  title: Your first LangChain app
  file: chapters/07-first-app.md
  minutes: 40
  folder: 07-first-app
  tasks:
  - id: chat_model
    title: Navin's chat model
    xp: 15
    hints:
    - chat_model returns None.
    - init_chat_model takes "provider:model" and the parameters.
    - The provider is openai, the model ai-chat, and the temperature 0.
    examples:
    - call: chat_model()
      gives: a ChatOpenAI
  - id: system_message
    title: ask with a system message
    xp: 20
    hints:
    - ask returns an empty string.
    - model.invoke takes a list of message objects.
    - A SystemMessage with SYSTEM, a HumanMessage with the question, and return the reply's content.
    examples:
    - call: ask(model, "What can you do?")
      gives: Navin's answer as text
- id: parameters
  title: Model parameters and streaming
  file: chapters/08-parameters.md
  minutes: 40
  folder: 08-parameters
  tasks:
  - id: steady_model
    title: a steady, capped model
    xp: 15
    hints:
    - steady_model returns None.
    - init_chat_model accepts max_tokens as well as temperature.
    - Temperature 0 and at most 120 tokens.
    examples:
    - call: steady_model()
      gives: temperature 0, max_tokens 120
  - id: stream_tokens
    title: stream the answer
    xp: 20
    hints:
    - stream_answer returns an empty string and never calls the model.
    - model.stream takes the same messages as invoke and yields chunks.
    - Pass each chunk's content to on_piece, keep it in a list, and join the list at the end.
    examples:
    - call: stream_answer(model, "Why?", print)
      gives: the pieces as they arrive, then the whole text
- id: hallucinations
  title: Hallucinations, usage and cost
  file: chapters/09-hallucinations.md
  minutes: 45
  folder: 09-hallucinations
  tasks:
  - id: honest_prompt
    title: the honest prompt
    xp: 20
    hints:
    - honest_prompt returns SYSTEM only, with no facts and no permission to not know.
    - Add the instruction with the exact words I don't know, then a blank line.
    - Finish with Facts and a colon on its own line, then FACTS.
    examples:
    - call: ask("What is today's garlic rate?")
      gives: I don't know, call the co-op office
  - id: answer_cost
    title: the cost of an answer
    xp: 15
    hints:
    - answer_cost returns 0.0.
    - reply.usage_metadata is a dict with input_tokens and output_tokens.
    - Multiply each by its price per million, add them, and divide by 1,000,000.
    examples:
    - call: answer_cost(1,000 tokens in, 200 out)
      gives: $0.000270
- id: agent-loop
  title: An agent loop, by hand
  file: chapters/10-agent-loop.md
  minutes: 50
  folder: 10-agent-loop
  part: Agents
  tasks:
  - id: run_tool_call
    title: run one tool call
    xp: 20
    hints:
    - run_tool_call returns an empty ToolMessage.
    - tools_by_name maps the call's name to a tool; a tool runs with .invoke(call args).
    - Wrap str(result) in a ToolMessage with the call's id, and in an except branch put Error and the exception's text.
    examples:
    - call: run_tool_call(storage_cost(60, 10))
      gives: ToolMessage "1200"
    - call: run_tool_call(mandi_price("garlic"))
      gives: 'ToolMessage "Error: The co-op has no rate for garlic..."'
  - id: agent_loop
    title: the agent loop
    xp: 25
    hints:
    - agent_loop calls the model once and returns, even when it asks for tools.
    - Loop with range(max_steps); append each reply to messages; a reply with no tool_calls is the answer.
    - For each call in reply.tool_calls append run_tool_call(call, tools_by_name); after the loop, raise RuntimeError.
    examples:
    - call: agent_loop(model, messages, [mandi_price, storage_cost])
      gives: the final answer, after two tool results
- id: create-agent
  title: create_agent
  file: chapters/11-create-agent.md
  minutes: 40
  folder: 11-create-agent
  tasks:
  - id: first_agent
    title: Navin as an agent
    xp: 20
    hints:
    - navin_agent returns None.
    - create_agent takes the model name, a list of tools and a system_prompt.
    - The model is openai:ai-chat, the tools mandi_price and storage_cost, the prompt SYSTEM.
    examples:
    - call: navin_agent().invoke(...)
      gives: a state with all the run's messages
  - id: tools_used
    title: which tools did it use
    xp: 15
    hints:
    - tools_used returns an empty list.
    - Only AI messages have tool_calls; getattr with a default handles the others.
    - A list comprehension over the messages and over each message's calls, keeping each call's name.
    examples:
    - call: tools_used(result)
      gives: '[storage_cost]'
- id: tools
  title: Tools that are easy to use right
  file: chapters/12-tools.md
  minutes: 45
  folder: 12-tools
  tasks:
  - id: loan_tool
    title: the loan tool
    xp: 20
    hints:
    - crop_loan_limit is a plain function returning 0, so the model cannot see it.
    - The tool decorator turns a function into a tool; its docstring becomes the description.
    - Decorate it, add the docstring from the TODO, and multiply the acres by 50000 as an int.
    examples:
    - call: 'crop_loan_limit.invoke({"acres": 2.5})'
      gives: '125000'
  - id: member_tool
    title: a tool that knows who is asking
    xp: 25
    hints:
    - my_storage returns unknown for everyone.
    - runtime.context is the Member the app passed; MEMBERS maps an id to name, acres and crates.
    - Unpack the member's record and build the sentence with an f-string.
    examples:
    - call: my_storage, as M-104
      gives: Ravi Patil has 40 crates in cold storage.
- id: structured
  title: Structured output
  file: chapters/13-structured.md
  minutes: 45
  folder: 13-structured
  tasks:
  - id: extract_booking
    title: free text to a Booking
    xp: 20
    hints:
    - extract_booking returns None.
    - A chat model has a method that takes a Pydantic class and returns a model whose answers are that class.
    - Call it with Booking, then invoke the result with the message.
    examples:
    - call: extract_booking("60 crates of kanda for two weeks")
      gives: Booking(crop='onion', crates=60, days=14)
  - id: booking_agent
    title: an agent that answers with a Booking
    xp: 20
    hints:
    - booking_agent returns None.
    - create_agent has a response_format argument.
    - No tools, and Booking as the response format.
    examples:
    - call: booking_agent().invoke(...)["structured_response"]
      gives: Booking(crop='grapes', crates=40, days=3)
- id: images
  title: Images in the conversation
  file: chapters/14-images.md
  minutes: 45
  folder: 14-images
  tasks:
  - id: image_message
    title: a message with a photo
    xp: 20
    hints:
    - image_message returns a text-only message.
    - The content can be a list of blocks, each a dict with a type.
    - A text block with the question, and an image block with base64 text from b64encode(...).decode() and the mime_type.
    examples:
    - call: image_message("What is this?", photo bytes)
      gives: a HumanMessage with a text block and an image block
  - id: leaf_report
    title: the leaf report
    xp: 20
    hints:
    - leaf_report returns None.
    - with_structured_output(LeafReport) gives a model that answers with a LeafReport.
    - Invoke it with a list holding SystemMessage(RULES) and your image_message.
    examples:
    - call: leaf_report(question, leaf.jpg)
      gives: a LeafReport that sends the member to the agronomist
- id: memory
  title: Short-term memory
  file: chapters/15-memory.md
  minutes: 40
  folder: 15-memory
  tasks:
  - id: memory_agent
    title: an agent that remembers
    xp: 20
    hints:
    - memory_agent returns None.
    - Build chapter 11's agent again.
    - Add a checkpointer argument with an InMemorySaver.
    examples:
    - call: two invokes on the same thread
      gives: the second call sends both questions
  - id: thread_per_member
    title: one thread per member
    xp: 20
    hints:
    - ask returns an empty string and never calls the agent.
    - invoke takes the state and a config dict as its second argument.
    - The config is configurable with thread_id set to the member id; return the last message's content.
    examples:
    - call: ask(agent, "M-221", "How much for 15 days?")
      gives: How many crates do you want to store?
      note: Asha's thread is new
- id: streaming
  title: Streaming an agent
  file: chapters/16-streaming.md
  minutes: 45
  folder: 16-streaming
  tasks:
  - id: stream_steps
    title: report each step
    xp: 20
    hints:
    - steps returns an empty list and reports nothing.
    - stream_mode updates yields dicts of step name to an update with new messages.
    - Make one line per tool call or per message, append it, and call on_line with it right away.
    examples:
    - call: steps(agent, question, print)
      gives: 'model: asks for storage_cost, tools: ToolMessage, model: AIMessage'
  - id: stream_answer_text
    title: stream the answer's words
    xp: 20
    hints:
    - answer_text returns an empty string.
    - stream_mode messages yields pairs of a chunk and its metadata.
    - Keep chunks whose metadata langgraph_node is model and whose content has text; call on_piece and keep them.
    examples:
    - call: answer_text(agent, question, print)
      gives: the answer, word by word
