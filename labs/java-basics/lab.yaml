id: java-basics
version: 2
title: Java from zero
subtitle: From your very first line of Java to classes, collections, streams and real programs, one curious step at a time.
description: 'Learn Java from the very first line: types, decisions, loops, strings, arrays, classes and
  records, interfaces, collections, exceptions, lambdas and streams, files and a command-line program.
  Plain explanations, everyday examples and real tests.'
language: java
track: languages
tags:
- java
- beginner
level: beginner
estimated_minutes: 815
cover_scene: A calm desk with a laptop showing a few lines of Java and a small potted plant, soft morning light.
cover: cover.svg
cover_credit:
  by: 'Logos: duke-waving,java'
  source: devicon (MIT), Duke (BSD)
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Nothing. This course starts from your very first line of Java and explains every term the first time it appears.
    Knowing another language helps a little, but it is not needed.
  needs: []
image: labbox/java-basics:v1
resources:
  cpus: 0.5
  memory: 1g
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
check:
  command:
  - bash
  - /check/tests/run_checks.sh
  timeout_seconds: 200
  network: none
chapters:
- id: first-program
  title: Your first Java program
  file: chapters/01-first-program.md
  minutes: 45
  folder: 01-first-program
  part: Starting out
  tasks:
  - id: hello_shelf
    title: 'Hello.java: Shelf says hello'
    hints:
    - Lines that start with // are notes for people. Java skips them, so right now main does nothing.
    - System.out.println(...) shows what is between the brackets, then starts a new line. Each one goes inside main, and ends with a semicolon.
    - Write two println lines inside main, each sentence in double quotes, copied exactly from the TODO, full stops included.
    examples:
    - call: java Hello.java
      gives: Hello! I am Shelf.
      note: first line
    - call: java Hello.java
      gives: I will look after your books.
      note: second line
  - id: fix_first_errors
    title: 'FixMe.java: fix two small mistakes'
    hints:
    - Run java FixMe.java and read the first line of what Java says. The ^ under the code points at the spot.
    - Every statement in Java ends with a semicolon. One line is missing its semicolon.
    - After that fix, Java stops at a name it does not know. Java is case-sensitive; compare it with the line above.
    examples:
    - call: java FixMe.java
      gives: Shelf is starting...
      note: then two more lines
- id: 01-methods
  title: Your first methods
  file: chapters/02-methods.md
  minutes: 40
  folder: 02-methods
  tasks:
  - id: greet
    title: 'Greeter.greet: return a greeting'
    hints:
    - 'Look at the return statement in greet: it returns null right now.'
    - Join Strings with +, putting the name between two pieces of fixed text.
    - Return "Hello, " joined with name, joined with "!".
    examples:
    - call: greet("Asha")
      gives: '"Hello, Asha!"'
    - call: greet("Kabir")
      gives: '"Hello, Kabir!"'
  - id: longest_word
    title: 'Greeter.longestWord: length of the longest word'
    hints:
    - An empty sentence must give 0. What does your method return before it looks at any word?
    - Split the sentence on spaces, then look at the length of each word.
    - Keep a variable for the best length so far. In the loop, update it whenever a word is longer.
    examples:
    - call: longestWord("big kirana store")
      gives: '6'
    - call: longestWord("hi")
      gives: '2'
- id: 02-variables-and-types
  title: Variables and types
  file: chapters/03-variables-and-types.md
  minutes: 45
  folder: 03-variables-and-types
  tasks:
  - id: percent
    title: 'types/Numbers.java: percent(scored, total)'
    hints:
    - '45 / 50 is 0 in Java: dividing two ints throws the fraction away.'
    - Cast one side to double before dividing, for example (double) scored.
    - Check total == 0 first; Math.round(x * 10) / 10.0 rounds to one decimal.
    examples:
    - call: "percent(45, 50)"
      gives: "90.0"
    - call: "percent(1, 3)"
      gives: "33.3"
      note: "one decimal"
    - call: "percent(7, 0)"
      gives: "0.0"
  - id: format_rupees
    title: 'types/Numbers.java: formatRupees(paise)'
    hints:
    - '1250 paise is 12 rupees and 50 paise: use / and % with 100.'
    - String.format builds text; %02d pads a number to two digits with a zero.
    - Put the rupee sign, the rupees, a dot and the two-digit paise in one String.format.
    examples:
    - call: "formatRupees(1250)"
      gives: "\"₹12.50\""
    - call: "formatRupees(5)"
      gives: "\"₹0.05\""
- id: 03-decisions
  title: Making decisions
  file: chapters/04-decisions.md
  minutes: 40
  folder: 04-decisions
  tasks:
  - id: grade
    title: 'decisions/Decisions.java: grade(marks)'
    hints:
    - 'Check the invalid marks first: below 0 or above 100.'
    - 'Then test from the highest grade down: 80, then 60, then 40.'
    - if and else if, or one if per grade that returns straight away, both read well.
    examples:
    - call: "grade(80)"
      gives: "\"A\""
    - call: "grade(79)"
      gives: "\"B\""
    - call: "grade(101)"
      gives: "\"Invalid\""
  - id: leap_year
    title: 'decisions/Decisions.java: isLeapYear(year)'
    hints:
    - Divisible by 4 is usually a leap year, with two exceptions.
    - Divisible by 100 is not, unless it is also divisible by 400.
    - Combine the tests with &&, || and !; 1900 is false, 2000 is true.
    examples:
    - call: "isLeapYear(2024)"
      gives: "true"
    - call: "isLeapYear(1900)"
      gives: "false"
    - call: "isLeapYear(2000)"
      gives: "true"
- id: 04-loops
  title: Loops
  file: chapters/05-loops.md
  minutes: 45
  folder: 05-loops
  tasks:
  - id: sum_to
    title: 'loops/Loops.java: sumTo(n)'
    hints:
    - 'A classic for loop has three parts: start at 1, keep going while i is at most n, add one each round.'
    - Add each i to a running total that starts at 0.
    - When n is 0 or negative the loop never runs, so the total stays 0.
    examples:
    - call: "sumTo(5)"
      gives: "15"
      note: "1 + 2 + 3 + 4 + 5"
    - call: "sumTo(100)"
      gives: "5050"
  - id: count_vowels
    title: 'loops/Loops.java: countVowels(text)'
    hints:
    - text.toCharArray() gives you each character, ready for a for-each loop.
    - Character.toLowerCase(c) lets you treat A and a the same.
    - '"aeiou".indexOf(c) is -1 when c is not a vowel.'
    examples:
    - call: "countVowels(\"Hello World\")"
      gives: "3"
    - call: "countVowels(\"rhythm\")"
      gives: "0"
- id: finding-bugs
  title: Finding bugs
  file: chapters/06-finding-bugs.md
  minutes: 45
  folder: 06-finding-bugs
  tasks:
  - id: fix_total_fines
    title: 'Fines.java: the total that forgets a fine'
    hints:
    - 60 should come out, 50 does. 60 - 50 = 10. Which fine is missing?
    - Add System.out.println(i + " " + fines[i]); inside the loop and run java Fines.java. Which positions does the loop visit?
    - Positions in an array start at 0. Look at where the loop variable starts.
    examples:
    - call: totalFines(new int[] {10, 20, 30})
      gives: '60'
    - call: totalFines(new int[] {})
      gives: '0'
  - id: fix_can_borrow
    title: 'Fines.java: at the limit means no more books'
    hints:
    - Try canBorrow(5, 5). A member with 5 books and a limit of 5 has no room left.
    - Print room before the return. What is room exactly at the limit?
    - Borrowing needs some room left, more than none. Compare the symbols > and >= on the last line.
    examples:
    - call: canBorrow(4, 5)
      gives: 'true'
    - call: canBorrow(5, 5)
      gives: 'false'
      note: at the limit
- id: 05-strings
  title: Strings
  file: chapters/07-strings.md
  minutes: 40
  folder: 07-strings
  part: Working with data
  tasks:
  - id: count_words
    title: 'Words.java: countWords(text)'
    hints:
    - strip() removes the spaces at both ends first.
    - split("\\s+") splits on one or more spaces, tabs or new lines.
    - 'An empty (or all-space) text has no words at all: check it before splitting.'
    examples:
    - call: "countWords(\"Java is fun\")"
      gives: "3"
    - call: "countWords(\"  lots   of   spaces  \")"
      gives: "3"
  - id: clean_name
    title: 'Words.java: cleanName(raw)'
    hints:
    - Split the stripped name on runs of spaces, as in the warm-up.
    - 'For each word: substring(0, 1) upper case, plus substring(1) lower case.'
    - String.join(" ", parts) puts the words back with single spaces.
    examples:
    - call: "cleanName(\"  riya   SHARMA \")"
      gives: "\"Riya Sharma\""
    - call: "cleanName(\"ARJUN\")"
      gives: "\"Arjun\""
- id: 06-arrays
  title: Arrays
  file: chapters/08-arrays.md
  minutes: 40
  folder: 08-arrays
  tasks:
  - id: array_max
    title: 'ArrayTools.java: max(numbers)'
    hints:
    - Start with the first number as the best so far.
    - Loop over the rest and keep the bigger one each time.
    - 'An empty array has no maximum: throw an IllegalArgumentException with a clear message.'
    examples:
    - call: "max({3, 9, 2})"
      gives: "9"
    - call: "max({-5, -2, -9})"
      gives: "-2"
  - id: reversed
    title: 'ArrayTools.java: reversed(numbers)'
    hints:
    - Make a new array of the same length with new int[numbers.length].
    - Item i of the result is item length - 1 - i of the input.
    - 'Never write into the array you were given: the caller still needs it.'
    examples:
    - call: "reversed({1, 2, 3, 4})"
      gives: "{4, 3, 2, 1}"
      note: "the original stays {1, 2, 3, 4}"
- id: 07-classes-and-objects
  title: Classes and objects
  file: chapters/09-classes-and-objects.md
  minutes: 45
  folder: 09-classes-and-objects
  tasks:
  - id: bank_account
    title: 'BankAccount.java: deposit and withdraw'
    hints:
    - Keep the balance in a private field, so only the methods can change it.
    - 'A zero or negative amount is a mistake by the caller: throw IllegalArgumentException.'
    - A withdrawal bigger than the balance is also refused, and the balance stays as it was.
    examples:
    - call: "deposit(500), then withdraw(200)"
      gives: "getBalance() is 300"
    - call: "withdraw(1000)"
      gives: "IllegalArgumentException"
      note: "balance unchanged"
  - id: point_distance
    title: 'Point.java: distanceTo(other)'
    hints:
    - The distance is the square root of dx * dx + dy * dy.
    - 'A record''s fields are read with methods: x() and y(), or other.x().'
    - Math.sqrt gives the root; Math.round(d * 100) / 100.0 rounds to 2 decimals.
    examples:
    - call: "new Point(0, 0).distanceTo(new Point(3, 4))"
      gives: "5.0"
    - call: "new Point(0, 0).distanceTo(new Point(1, 1))"
      gives: "1.41"
- id: 08-interfaces
  title: Interfaces and inheritance
  file: chapters/10-interfaces.md
  minutes: 45
  folder: 10-interfaces
  tasks:
  - id: areas
    title: 'Rect.java and Circle.java: area()'
    hints:
    - A rectangle's area is width times height.
    - A circle's area is Math.PI times the radius squared.
    - Both classes implement Shape, so each must have a public double area().
    examples:
    - call: "new Rect(3, 4).area()"
      gives: "12.0"
    - call: "new Circle(2).area()"
      gives: "12.566..."
      note: "π times 2 squared"
  - id: total_area
    title: 'Shapes.java: totalArea(shapes)'
    hints:
    - Any object that implements Shape has area(), whatever its class.
    - Loop over the list and add up s.area().
    - Round the total to 2 decimals with Math.round(total * 100) / 100.0.
    examples:
    - call: "totalArea(List.of(new Rect(3, 4), new Circle(1)))"
      gives: "15.14"
    - call: "totalArea(List.of())"
      gives: "0.0"
- id: 09-collections
  title: Lists, maps and sets
  file: chapters/11-collections.md
  minutes: 40
  folder: 11-collections
  tasks:
  - id: top_n
    title: 'ListTools.java: topN(numbers, n)'
    hints:
    - Sorting the list you were given changes the caller's list.
    - new ArrayList<>(numbers) makes a separate copy you can sort.
    - Sort the copy biggest first (Comparator.reverseOrder()), then keep at most n with subList.
    examples:
    - call: topN([72, 45, 90, 66], 2)
      gives: '[90, 72]'
      note: the list passed in stays as it was
    - call: topN([5, 1], 5)
      gives: '[5, 1]'
  - id: word_counts
    title: 'WordCounter.java: count(words)'
    hints:
    - A HashMap<String, Integer> holds one count per word.
    - getOrDefault(word, 0) gives the count so far, or 0 the first time.
    - Lower-case each word before counting, so Jelly and jelly count together.
    examples:
    - call: count([jelly, Cookie, JELLY, jelly])
      gives: '{cookie=1, jelly=3}'
    - call: count([])
      gives: '{}'
- id: generics-records-enums
  title: Generics, records and enums
  file: chapters/12-generics-records-enums.md
  minutes: 45
  folder: 12-generics-records-enums
  tasks:
  - id: loan_record
    title: 'Loan.java: a loan that refuses nonsense'
    hints:
    - The compact constructor runs every time a Loan is made. Tidy the title there first.
    - After stripping, isEmpty() tells you the title was blank.
    - 'Days are allowed from 1 to 60: refuse anything below 1 or above 60 with an IllegalArgumentException.'
    examples:
    - call: new Loan("  Dune ", 14).title()
      gives: '"Dune"'
    - call: new Loan("Dune", 0)
      gives: IllegalArgumentException
  - id: genre_enum
    title: 'Genre.java: fromText(text)'
    hints:
    - Genre.valueOf("FANTASY") turns exact text into a genre, and throws for anything else.
    - 'Make the text match first: strip it and put it in capitals.'
    - 'For two words: split on runs of spaces, then join the pieces with "_".'
    examples:
    - call: fromText("Fantasy")
      gives: FANTASY
    - call: fromText("  science   fiction ")
      gives: SCIENCE_FICTION
    - call: fromText("Fantsy")
      gives: IllegalArgumentException
- id: 10-exceptions
  title: Exceptions
  file: chapters/13-exceptions.md
  minutes: 45
  folder: 13-exceptions
  part: Real programs
  tasks:
  - id: parse_age
    title: 'Ages.java: parseAge(text)'
    hints:
    - Integer.parseInt throws NumberFormatException for text that is not a whole number.
    - Catch it and throw your InvalidAgeException instead, passing the original as the cause.
    - After parsing, an age outside 0 to 150 is also an InvalidAgeException.
    examples:
    - call: "parseAge(\" 42 \")"
      gives: "42"
    - call: "parseAge(\"abc\")"
      gives: "InvalidAgeException"
      note: "cause: NumberFormatException"
  - id: safe_sum
    title: 'Ages.java: safeSum(values)'
    hints:
    - 'Keep two things while you loop: the running total and a list of bad values.'
    - Put Double.parseDouble inside try; in catch, remember the value and carry on.
    - Give back both at once in the SumResult record.
    examples:
    - call: "safeSum([\"10\", \"x\", \"2.5\", \"\"])"
      gives: "total 12.5, bad [\"x\", \"\"]"
    - call: "safeSum([])"
      gives: "total 0, no bad values"
- id: 11-lambdas-and-streams
  title: Lambdas and streams
  file: chapters/14-lambdas-and-streams.md
  minutes: 45
  folder: 14-lambdas-and-streams
  tasks:
  - id: passing
    title: 'Streams.java: passing(marks)'
    hints:
    - marks.stream() turns the list into a stream you can filter.
    - filter keeps the items for which a lambda like m -> m >= 40 is true.
    - toList() collects the result into a new list.
    examples:
    - call: "passing([72, 30, 90, 40, 39])"
      gives: "[72, 90, 40]"
      note: "40 or more, same order"
  - id: sort_by_length
    title: 'Streams.java: sortByLength(words)'
    hints:
    - Comparator.comparing(String::length) compares words by their length.
    - thenComparing(...) breaks ties; the natural order of strings is alphabetical.
    - Sort a stream with sorted(...) and collect it, so the caller's list is untouched.
    examples:
    - call: "sortByLength([banana, fig, apple, kiwi, date])"
      gives: "[fig, date, kiwi, apple, banana]"
      note: "ties alphabetical"
- id: 12-files-and-cli
  title: Files and a command-line program
  file: chapters/15-files-and-cli.md
  minutes: 50
  folder: 15-files-and-cli
  tasks:
  - id: read_totals
    title: 'Expenses.java: readTotals(path)'
    hints:
    - Files.readAllLines(path) reads the whole file; it throws NoSuchFileException for a missing file.
    - Skip the header, blank lines, rows without three parts and amounts Double.parseDouble cannot read.
    - Add each good amount to its category with merge(category, amount, Double::sum), then round.
    examples:
    - call: "readTotals(Path.of(\"expenses.csv\")).get(\"rent\")"
      gives: "18000.0"
    - call: "readTotals(Path.of(\"missing.csv\"))"
      gives: "NoSuchFileException"
  - id: summary_cli
    title: 'Summary.java: the top categories'
    hints:
    - 'args holds the words after the class name: the path, and maybe --top and a number.'
    - Catch NoSuchFileException, print the message to System.err and end with exit code 1.
    - 'Sort the categories by total, biggest first, and print category: amount with %.2f.'
    examples:
    - call: "java -cp out Summary expenses.csv --top 2"
      gives: "rent: 18000.00 / shopping: 4095.00"
      note: "two lines"
    - call: "java -cp out Summary missing.csv"
      gives: "File not found: missing.csv"
      note: "stderr, exit 1"
- id: packages-and-maven
  title: Packages, jar files and Maven
  file: chapters/16-packages-and-maven.md
  minutes: 50
  folder: 16-packages-and-maven
  tasks:
  - id: package_catalog
    title: 'Catalog.java: into the package shelf.catalog'
    hints:
    - mvn -o -q package says package shelf.catalog does not exist. Which folder would that package live in?
    - The folders under src/main/java must spell the package, one folder per dot.
    - Move the file with mkdir -p and mv, then give it a package line at the very top.
    examples:
    - call: mvn -o -q package
      gives: target/shelf.jar
      note: no errors
  - id: runnable_jar
    title: 'pom.xml: a jar that runs with java -jar'
    hints:
    - java -jar target/shelf.jar says no main manifest attribute. The jar does not know where main is.
    - The maven-jar-plugin in pom.xml has an empty mainClass element.
    - A class's full name includes its package, with dots.
    examples:
    - call: java -jar target/shelf.jar
      gives: 'Shelf 1.0: 2 books'
- id: testing
  title: Testing with JUnit
  file: chapters/17-testing.md
  minutes: 50
  folder: 17-testing
  tasks:
  - id: fix_renewal
    title: 'Renewals.java: make the red test green'
    hints:
    - mvn -o -q test shows which test failed, with its message and the line.
    - noThirdRenewal calls canRenew(2, false). Two renewals have already happened.
    - Compare the symbols < and <= on the return line.
    examples:
    - call: canRenew(1, false)
      gives: 'true'
    - call: canRenew(2, false)
      gives: 'false'
  - id: test_late_fee
    title: 'FinesTest.java: tests that catch a broken late fee'
    hints:
    - 'Read the rules in Fines.java: 2 rupees a day for the first week, 5 a day after that, at most 100.'
    - Test the edges, where bugs live. The last day of the first week, the first day after it, and the day the fee reaches 100.
    - A negative number of days must throw. assertThrows checks that.
    examples:
    - call: mvn -o -q test
      gives: your tests pass on the real lateFee
      note: and fail on three broken copies of it
- id: 13-capstone
  title: 'Capstone: a monthly report'
  file: chapters/18-capstone.md
  minutes: 60
  folder: 18-capstone
  part: Capstone
  tasks:
  - id: fix_book
    title: 'Book.java: fix the inherited class'
    hints:
    - 'Put two equal books in a HashSet: how many does it hold?'
    - A HashSet asks hashCode first; equal objects must have equal hash codes.
    - 'Add a hashCode built from the same field equals compares: Objects.hash(...).'
    examples:
    - call: "set.add(book); set.add(sameIsbnCopy); set.size()"
      gives: "1"
      note: "it is 2 now"
    - call: "map.get(sameIsbnCopy)"
      gives: "the value stored for book"
  - id: monthly_report
    title: 'Report.java: monthly(path)'
    hints:
    - 'Read the lines and keep their numbers: the header is line 1.'
    - A row is bad when its category is empty or its amount is not a number; blank lines are skipped,
      not reported.
    - From the good rows work out the total, count, average (0 when none), the totals per category and
      the bad line numbers.
    examples:
    - call: "monthly(the five lines in Guess first)"
      gives: "total 18120.0, count 2"
      note: "badLines [3, 4]"
