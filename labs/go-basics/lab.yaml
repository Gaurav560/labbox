# Go from zero. Chapter ids 01-slices-and-errors and 02-maps-and-structs are the original chapters
# (kept so learners keep their progress); they sit at positions 5 and 8.
id: go-basics
version: 2
title: Go from zero
subtitle: From your very first line of Go to interfaces, files, goroutines and tests, one curious step at a time.
description: 'Learn Go from the very first line: types, loops, slices, maps, structs, methods and interfaces, real
  error handling, a command-line program and goroutines. Plain explanations, everyday examples and real tests.'
language: go
track: languages
tags:
- go
- beginner
level: beginner
estimated_minutes: 805
cover: cover.svg
cover_credit:
  by: 'Logos: go'
  source: devicon (MIT)
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Nothing. This course starts from your very first line of Go and explains every term the first time it appears.
    Some experience with any other language makes the first chapters faster, but it is not needed.
  needs: []
image: labbox/go-basics:v1
resources:
  cpus: 0.5
  memory: 512m
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
check:
  command:
  - bash
  - /check/tests/run_checks.sh
  timeout_seconds: 30
  network: none
chapters:
- id: hello-go
  title: Your first Go program
  file: chapters/01-hello-go.md
  minutes: 45
  folder: 01-hello-go
  part: Starting out
  tasks:
  - id: hello_parcel
    title: 'parcel.go: Parcel says hello'
    hints:
    - Look at first.go. It imports fmt, and each fmt.Println prints one line.
    - Text goes inside double quotes.
    - Two lines, two fmt.Println calls, the words exactly as shown, capitals and full stops included.
    examples:
    - call: go run parcel.go
      gives: 'Hello! I am Parcel. / I will track your deliveries.'
      note: two lines
  - id: fix_first_errors
    title: 'fixme.go: make Go happy'
    hints:
    - Run go run fixme.go and read both errors. Each names a line and a column.
    - Go refuses an import that nothing uses. Which package is never used?
    - Go also refuses a variable that nothing uses. Use count on the last line instead of the number.
    examples:
    - call: go run fixme.go
      gives: 'Parcel is starting... / Ready to track your deliveries. / Parcels on the van: 12'
      note: three lines
- id: 01-first-program
  title: Functions
  file: chapters/02-functions.md
  minutes: 40
  folder: 02-functions
  tasks:
  - id: greeting
    title: 'hello.go: Greeting(name)'
    hints:
    - Go joins strings with +, just like numbers are added.
    - The result must be exactly Hello, then a comma and a space, then the name, then an exclamation mark.
    - Return the joined string; Go functions always say what type they return.
    examples:
    - call: "Greeting(\"Asha\")"
      gives: "\"Hello, Asha!\""
    - call: "Greeting(\"Kabir\")"
      gives: "\"Hello, Kabir!\""
  - id: total_minutes
    title: 'hello.go: TotalMinutes(hours, minutes)'
    hints:
    - An hour has 60 minutes.
    - Multiply the hours by 60 first, then add the minutes.
    - 'Both inputs are int and so is the result: no conversion is needed.'
    examples:
    - call: "TotalMinutes(2, 15)"
      gives: "135"
    - call: "TotalMinutes(0, 45)"
      gives: "45"
- id: 02-numbers-and-text
  title: Numbers and text
  file: chapters/03-numbers-and-text.md
  minutes: 40
  folder: 03-numbers-and-text
  tasks:
  - id: percent
    title: 'numbers.go: Percent(scored, total)'
    hints:
    - '45 / 50 is 0 in Go: dividing two ints throws the fraction away.'
    - 'Convert both to float64 before dividing: float64(scored).'
    - Check total == 0 first, and round to one decimal with math.Round(x*10) / 10.
    examples:
    - call: "Percent(45, 50)"
      gives: "90"
    - call: "Percent(1, 3)"
      gives: "33.3"
      note: "one decimal"
  - id: format_rupees
    title: 'numbers.go: FormatRupees(paise)'
    hints:
    - '1250 paise is 12 rupees and 50 paise: use / and % with 100.'
    - fmt.Sprintf builds a string; the verb %02d pads a number to two digits with a zero.
    - Put the rupee sign, the rupees, a dot and the two-digit paise together in one Sprintf.
    examples:
    - call: "FormatRupees(1250)"
      gives: "\"₹12.50\""
    - call: "FormatRupees(5)"
      gives: "\"₹0.05\""
- id: 03-decisions
  title: Making decisions
  file: chapters/04-decisions.md
  minutes: 40
  folder: 04-decisions
  tasks:
  - id: grade
    title: 'decisions.go: Grade(marks)'
    hints:
    - 'Check the invalid marks first: below 0 or above 100.'
    - 'Then test from the highest grade down: 80, then 60, then 40.'
    - 'A switch with nothing after the word switch reads like a list of rules: one case per grade, the highest first.'
    examples:
    - call: "Grade(80)"
      gives: "\"A\""
    - call: "Grade(79)"
      gives: "\"B\""
    - call: "Grade(101)"
      gives: "\"Invalid\""
  - id: leap_year
    title: 'decisions.go: IsLeapYear(year)'
    hints:
    - Divisible by 4 is usually a leap year, with two exceptions.
    - Divisible by 100 is not, unless it is also divisible by 400.
    - Combine the tests with &&, || and !; 1900 is false, 2000 is true.
    examples:
    - call: "IsLeapYear(2024)"
      gives: "true"
    - call: "IsLeapYear(1900)"
      gives: "false"
    - call: "IsLeapYear(2000)"
      gives: "true"
- id: 04-loops
  title: Loops
  file: chapters/05-loops.md
  minutes: 40
  folder: 05-loops
  tasks:
  - id: sum_to
    title: 'loops.go: SumTo(n)'
    hints:
    - "A classic for loop has three parts: start i at 1, keep going while i is at most n, add one each round."
    - Add each i to a running total that starts at 0.
    - When n is 0 or negative the loop never runs, so the total stays 0.
    examples:
    - call: "SumTo(5)"
      gives: "15"
      note: "1 + 2 + 3 + 4 + 5"
    - call: "SumTo(100)"
      gives: "5050"
  - id: count_vowels
    title: 'loops.go: CountVowels(text)'
    hints:
    - for _, r := range text gives you each character (a rune) in turn.
    - unicode.ToLower(r) lets you treat A and a the same.
    - A switch with case 'a', 'e', 'i', 'o', 'u' counts the vowels.
    examples:
    - call: "CountVowels(\"Hello World\")"
      gives: "3"
    - call: "CountVowels(\"rhythm\")"
      gives: "0"
- id: finding-bugs
  title: Finding bugs
  file: chapters/06-finding-bugs.md
  minutes: 45
  folder: 06-finding-bugs
  tasks:
  - id: fix_total_weight
    title: 'van.go: the total that forgets a parcel'
    hints:
    - 23 should come out, 19 does. 23 - 19 = 4. Which parcel is missing?
    - Print i and weights[i] inside the loop and run go run ask.go. Which positions does the loop visit?
    - Positions in a slice start at 0. Look at where the loop variable starts.
    examples:
    - call: TotalWeight([]int{4, 12, 7})
      gives: '23'
    - call: TotalWeight([]int{})
      gives: '0'
  - id: fix_can_load
    title: 'van.go: a full van takes no more'
    hints:
    - Try CanLoad(10, 10) in ask.go. A van with 10 parcels and room for 10 is full.
    - Print room before the return. What is room exactly at the limit?
    - Loading needs some room left, more than none. Compare the symbols > and >= on the last line.
    examples:
    - call: CanLoad(9, 10)
      gives: 'true'
    - call: CanLoad(10, 10)
      gives: 'false'
      note: at the limit
- id: 01-slices-and-errors
  title: Slices and errors
  file: chapters/07-slices-and-errors.md
  minutes: 45
  folder: 07-slices-and-errors
  part: Working with data
  tasks:
  - id: total
    title: 'till.go: Total(prices)'
    xp: 20
    hints:
    - prices is a slice of ints in paise. You need their sum.
    - range over the slice and add each value to a total.
    - Start a running total at zero, add every price inside a for range loop, then return the total.
    examples:
    - call: "Total([]int{1250, 700})"
      gives: "1950"
    - call: "Total(nil)"
      gives: "0"
  - id: parse_amount
    title: 'till.go: ParseAmount(text)'
    xp: 20
    hints:
    - '"12.50" means 12 rupees and 50 paise, so 1250 paise. Bad text must give an error, not a panic.'
    - strings.Cut splits on the dot; strconv.Atoi turns each part into an int and returns an error when it cannot.
    - Allow no dot or exactly two digits after it, return 0 and an error for anything else, otherwise rupees*100
      plus paise.
    examples:
    - call: "ParseAmount(\"12.50\")"
      gives: "1250, nil"
    - call: "ParseAmount(\"7\")"
      gives: "700, nil"
    - call: "ParseAmount(\"abc\")"
      gives: "0, an error"
- id: 06-strings
  title: Strings
  file: chapters/08-strings.md
  minutes: 40
  folder: 08-strings
  tasks:
  - id: count_words
    title: 'words.go: CountWords(text)'
    hints:
    - Words are separated by one or more spaces, tabs or new lines.
    - strings.Fields already ignores extra spaces at the ends and in between.
    - Count the pieces with len().
    examples:
    - call: "CountWords(\"Go is fun\")"
      gives: "3"
    - call: "CountWords(\"  lots   of   spaces  \")"
      gives: "3"
  - id: clean_name
    title: 'words.go: CleanName(raw)'
    hints:
    - strings.Fields splits on any run of spaces and drops the empty pieces.
    - 'For each word: the first letter upper case, the rest lower case (strings.ToUpper and strings.ToLower on slices
      of the word).'
    - strings.Join puts the words back together with a single space.
    examples:
    - call: "CleanName(\"  riya   SHARMA \")"
      gives: "\"Riya Sharma\""
    - call: "CleanName(\"ARJUN\")"
      gives: "\"Arjun\""
- id: 07-more-slices
  title: More slices
  file: chapters/09-more-slices.md
  minutes: 40
  folder: 09-more-slices
  tasks:
  - id: top_n
    title: 'slicetools.go: TopN(numbers, n)'
    hints:
    - 'Sorting the slice you were given changes the caller''s slice too: they share the same array.'
    - slices.Clone makes a separate copy you can sort safely.
    - Sort the copy from biggest to smallest, then keep at most n items (min(n, len(...))).
    examples:
    - call: "TopN([]int{72, 45, 90, 66}, 2)"
      gives: "[90 72]"
      note: "the slice passed in stays as it was"
    - call: "TopN([]int{5, 1}, 5)"
      gives: "[5 1]"
  - id: unique
    title: 'slicetools.go: Unique(items)'
    hints:
    - Keep a map of the items you have already seen.
    - Loop in the original order and append an item only the first time you see it.
    - Start the result as an empty slice, not nil, so an empty input gives an empty slice.
    examples:
    - call: "Unique([]string{\"jelly\", \"cookie\", \"jelly\", \"mint\"})"
      gives: "[jelly cookie mint]"
    - call: "Unique(nil)"
      gives: "[]"
- id: 02-maps-and-structs
  title: Maps and structs
  file: chapters/10-maps-and-structs.md
  minutes: 45
  folder: 10-maps-and-structs
  tasks:
  - id: count_by_item
    title: 'orders.go: CountByItem(orders)'
    xp: 20
    hints:
    - Each Order has an Item and a Qty. Add up Qty per Item.
    - A map[string]int is the counter; a missing key reads as 0, so you can add to it directly.
    - Make the map with make, loop over orders and add o.Qty to the entry for o.Item.
    examples:
    - call: "CountByItem([]Order{{\"jelly\", 2}, {\"mint\", 1}, {\"jelly\", 3}})"
      gives: "map[jelly:5 mint:1]"
    - call: "CountByItem(nil)"
      gives: "map[]"
      note: "empty, not nil"
  - id: busiest
    title: 'orders.go: Busiest(orders)'
    xp: 20
    hints:
    - 'Start from CountByItem: the best seller is the item with the biggest count.'
    - 'Map order is random in Go, so ties need a rule: the name that sorts first wins.'
    - Loop over the counts and keep the best item, replacing it when a count is bigger, or equal with a smaller
      name.
    examples:
    - call: "Busiest([]Order{{\"jelly\", 2}, {\"mint\", 1}, {\"jelly\", 3}})"
      gives: "\"jelly\""
    - call: "Busiest(nil)"
      gives: "\"\""
- id: 11-pointers
  title: Pointers
  file: chapters/11-pointers.md
  minutes: 40
  folder: 11-pointers
  tasks:
  - id: deposit
    title: 'wallet.go: fix Deposit'
    hints:
    - 'With a value receiver, the method gets a copy of the wallet: the change is lost when it returns.'
    - A pointer receiver (w *Wallet) lets the method change the caller's wallet.
    - Change only the receiver; Go calls pointer methods on addressable values for you.
    examples:
    - call: "w := Wallet{Balance: 100}; w.Deposit(50); w.Deposit(25)"
      gives: "w.Balance is 175"
  - id: swap
    title: 'wallet.go: Swap(a, b)'
    hints:
    - 'a and b are pointers: *a reads or writes the int they point to.'
    - 'Go can swap two values in one line: x, y = y, x.'
    - Swap the values the pointers point to, not the pointers themselves.
    examples:
    - call: "x, y := 1, 2; Swap(&x, &y)"
      gives: "x is 2, y is 1"
    - call: "Swap(&x, &x)"
      gives: "x unchanged"
- id: 09-methods-and-interfaces
  title: Methods and interfaces
  file: chapters/12-methods-and-interfaces.md
  minutes: 45
  folder: 12-methods-and-interfaces
  tasks:
  - id: areas
    title: 'shapes.go: Area() for Rect and Circle'
    hints:
    - 'A method is a function with a receiver: func (r Rect) Area() float64.'
    - A rectangle's area is width times height.
    - 'A circle''s area is pi times the radius squared: math.Pi * c.R * c.R.'
    examples:
    - call: "Rect{W: 3, H: 4}.Area()"
      gives: "12"
    - call: "Circle{R: 2}.Area()"
      gives: "12.566..."
      note: "π times 2 squared"
  - id: total_area
    title: 'shapes.go: TotalArea(shapes)'
    hints:
    - Any type with an Area() float64 method is a Shape, so the slice can mix rectangles and circles.
    - Loop over the shapes and add up s.Area().
    - Round the total to 2 decimals with math.Round(total*100) / 100.
    examples:
    - call: "TotalArea([]Shape{Rect{3, 4}, Circle{1}})"
      gives: "15.14"
      note: "rounded"
    - call: "TotalArea(nil)"
      gives: "0"
- id: 10-errors-in-depth
  title: Errors in depth
  file: chapters/13-errors-in-depth.md
  minutes: 45
  folder: 13-errors-in-depth
  part: Real programs
  tasks:
  - id: withdraw
    title: 'bank.go: Withdraw(balance, amount)'
    hints:
    - 'Check the amount first: zero or negative is an error of its own.'
    - For too little money, wrap the sentinel error with fmt.Errorf and the %w verb, so callers can use errors.Is.
    - On success give back the new balance and a nil error.
    examples:
    - call: "Withdraw(500, 200)"
      gives: "300, nil"
    - call: "Withdraw(100, 250)"
      gives: "100, ErrInsufficientFunds"
      note: "balance unchanged"
  - id: parse_age
    title: 'bank.go: ParseAge(text)'
    hints:
    - strconv.Atoi turns text into an int, or returns an error you can wrap.
    - Wrap that error with %w so errors.Is(err, strconv.ErrSyntax) still works for the caller.
    - After parsing, an age outside 0 to 150 is also an error.
    examples:
    - call: "ParseAge(\"17\")"
      gives: "17, nil"
    - call: "ParseAge(\"abc\")"
      gives: "0, an error"
      note: "wraps strconv.ErrSyntax"
- id: packages-and-json
  title: Packages, modules and JSON
  file: chapters/14-packages-and-json.md
  minutes: 45
  folder: 14-packages-and-json
  tasks:
  - id: save_manifest
    title: 'manifest.go: SaveManifest(van, parcels)'
    hints:
    - A struct tag goes after a field's type, between backticks, and names its JSON key.
    - Count is how many parcels there are, and a slice knows its own length.
    - Build a Manifest value and give it to json.Marshal, which already returns bytes and an error.
    examples:
    - call: SaveManifest("Van 7", parcels)
      gives: '{"van":"Van 7","count":1,"parcels":[...]}'
  - id: load_manifest
    title: 'manifest.go: LoadManifest(data)'
    hints:
    - json.Unmarshal fills in a variable, so it needs that variable's address.
    - Broken JSON makes Unmarshal return an error. Pass it on.
    - A missing parcels key leaves the slice nil. Return an empty slice instead.
    examples:
    - call: LoadManifest of two parcels
      gives: the two parcels, nil
    - call: 'LoadManifest of {"van":"Van 1"}'
      gives: '[]Parcel{}, nil'
- id: 12-files-and-cli
  title: Files and a command-line program
  file: chapters/15-files-and-cli.md
  minutes: 50
  folder: 15-files-and-cli
  tasks:
  - id: read_totals
    title: 'expenses.go: ReadTotals(path)'
    hints:
    - os.Open gives a file and an error; return the error (wrapped) when the file is missing.
    - csv.NewReader reads rows; set FieldsPerRecord to -1 so short rows do not stop the reading.
    - Skip the header and any row whose amount strconv.ParseFloat cannot read; add the rest per category.
    examples:
    - call: "ReadTotals(\"expenses.csv\")"
      gives: "map[...rent:18000 shopping:4095...]"
    - call: "ReadTotals(\"missing.csv\")"
      gives: "nil, fs.ErrNotExist"
  - id: summary_cli
    title: 'summary/main.go: the top categories'
    hints:
    - flag.Int defines -top; flag.Parse, then flag.Arg(0) is the file path.
    - For a missing file, print the message to os.Stderr, then end the program with exit code 1 (the os package has a function for it).
    - 'Sort the categories by total, biggest first, and print category: amount with %.2f.'
    examples:
    - call: "go run ./cmd/summary -top 2 expenses.csv"
      gives: "rent: 18000.00 / shopping: 4095.00"
      note: "two lines"
    - call: "go run ./cmd/summary missing.csv"
      gives: "File not found: missing.csv"
      note: "stderr, exit 1"
- id: 13-goroutines
  title: Goroutines and channels
  file: chapters/16-goroutines.md
  minutes: 50
  folder: 16-goroutines
  tasks:
  - id: fetch_all
    title: 'concurrent.go: FetchAll(items, fetch)'
    hints:
    - go f() runs f at the same time as the rest of the program.
    - 'Make the result slice first, and let each goroutine write only its own index: the order stays right.'
    - A sync.WaitGroup waits until every goroutine is done before you return.
    examples:
    - call: "FetchAll([]string{\"a\", \"b\"}, strings.ToUpper)"
      gives: "[A B]"
      note: "same order"
    - call: "five fetches of 200 ms"
      gives: "well under 1 s"
      note: "all at once"
  - id: word_counts
    title: 'concurrent.go: CountWords(texts)'
    hints:
    - Several goroutines writing to one map at once crash the program.
    - Protect the map with a sync.Mutex (Lock before writing, Unlock after), or send counts over a channel.
    - Count each text's words in its own goroutine and wait for all of them with a WaitGroup.
    examples:
    - call: "CountWords([]string{\"Go is fun\", \"go GO\"})"
      gives: "map[fun:1 go:3 is:1]"
    - call: "CountWords(nil)"
      gives: "map[]"
- id: testing
  title: Testing with go test
  file: chapters/17-testing.md
  minutes: 50
  folder: 17-testing
  tasks:
  - id: fix_next_stop
    title: 'stops.go: make the red test green'
    hints:
    - go test shows which test failed, its file and line, and what it got.
    - With 3 stops the positions are 0, 1 and 2. After 2, the van goes back to 0.
    - The remainder operator % wraps a number around. What is 3 % 3?
    examples:
    - call: NextStop(0, 3)
      gives: '1'
    - call: NextStop(2, 3)
      gives: '0'
      note: back to the depot
  - id: test_eta
    title: 'eta_test.go: a table that catches a broken ETA'
    hints:
    - 'Read the rules in eta.go: minutes under an hour, hours with two-digit minutes from 60 up, negative is an error.'
    - Test the edges, where bugs live. Just under an hour, exactly one hour, and a few minutes past it.
    - A negative number must return an error. Write a small test that checks err is not nil.
    examples:
    - call: go test
      gives: your tests pass on the real FormatETA
      note: and fail on three broken copies of it
- id: capstone
  title: 'Capstone: a depot report'
  file: chapters/18-capstone.md
  minutes: 60
  folder: 18-capstone
  part: Capstone
  tasks:
  - id: depot_report
    title: 'report.go: DepotReport(path)'
    hints:
    - Count every line as you read it, blank ones too, and skip the header and blank lines.
    - A row is bad when it has no depot, or when strconv.Atoi refuses its weight or its minutes.
    - Start the map and the slice empty, not nil, and guard the average when nothing was delivered.
    examples:
    - call: DepotReport of the five lines in Guess first
      gives: 2 delivered, 10 kg, 40.0 min
      note: bad lines [3 4]
    - call: DepotReport("deliveries.csv").Delivered
      gives: '7'
  - id: busiest_depot
    title: 'report.go: BusiestDepot(r)'
    hints:
    - Walk the PerDepot map, keeping the best depot so far.
    - Map order is random, so a tie needs a rule of its own.
    - On equal kilograms, keep the name that sorts first, with depot < best.
    examples:
    - call: BusiestDepot with Pune 26, Mumbai 13
      gives: '"Pune"'
    - call: BusiestDepot with Pune 7, Goa 7
      gives: '"Goa"'
      note: a tie
cover_scene: A calm desk with a laptop showing a few lines of Go and a small gopher figure beside it, soft morning
  light.
