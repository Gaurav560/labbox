id: fastapi-first-api
version: 2
title: "FastAPI"
subtitle: Build Lostdesk, the lost-property API of a city metro, from your first route to a tested, secured service.
description: 'Learn FastAPI from your first route, following the official tutorial at FastAPI 0.165: path and query
  parameters, validation, Pydantic models, responses and errors, files, dependencies, a real database with SQLModel,
  bigger applications, testing, passwords and tokens, background tasks, middleware, settings and live updates. One
  running project, Lostdesk, the API behind the lost-property office of a city metro, grows chapter by chapter.'
language: python
track: frameworks
tags: [python, fastapi]
level: beginner
estimated_minutes: 1050
story:
  company: Lostdesk
  character: { name: Lostdesk, role: "The lost-property API of a city metro" }
  pitch: "Every day the metro's trains collect umbrellas, phones and school bags. Lostdesk is the API that finds them their owners again."
cover_scene: "A metro station's lost-property counter at night, shelves of labelled umbrellas, bags and keys, a terminal screen showing JSON."
cover: cover.svg
cover_credit: { by: "Logos: fastapi,python", source: "devicon (MIT)" }
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Python basics. Every FastAPI route is a Python function that takes parameters and gives back dictionaries and
    lists, so you should be comfortable writing small functions with them. The course explains everything about the web
    (HTTP, JSON, status codes) from the start.
  needs:
  - know: Python functions, lists and dictionaries
    why: Every route is a function that returns a dictionary or a list, which FastAPI sends as JSON.
    lab: python-basics
    where: chapters 2, 8 and 9 (Your first functions, Lists, Dictionaries)
  - know: Classes, and type hints like name str
    why: FastAPI reads your type hints to check the data, and request bodies are small classes (Pydantic models).
    lab: python-basics
    where: chapter 15 (Classes and objects) and chapter 12 (Functions in depth)
image: labbox/fastapi-first-api:v2
resources:
  cpus: 0.5
  memory: 512m
  pids_limit: 256
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
preview:
  - { name: "Lostdesk API", port: 8000, path: "/" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 60
  network: none
chapters:
  - id: 01-menu-api
    title: Your first API
    file: chapters/01-first-api.md
    minutes: 45
    folder: 01-first-api
    part: First steps
    tasks:
      - id: menu
        title: "GET /items: every found item"
        hints:
          - "Right now there is no /items route, so FastAPI answers 404 Not Found. Look at how home() is written."
          - "A route is a function with @app.get(...) above it. The function gives back a dict, and FastAPI sends it as JSON."
          - "FOUND.values() gives the items in id order; put them in a list under the key items."
        examples:
          - call: "GET /items"
            gives: '{"items": [{"id": 1, ...}, ...]}'
            note: "four items"
      - id: price
        title: "GET /items/{item_id}: one item, or 404"
        hints:
          - "Curly braces in the path, like {item_id}, become a parameter of the function with the same name."
          - "Give the parameter the type int: FOUND's keys are numbers, and the URL is text until FastAPI converts it."
          - "When the id is not in FOUND, raise HTTPException with status_code 404 instead of returning."
        examples:
          - call: "GET /items/3"
            gives: '{"id": 3, "title": "silver phone", ...}'
          - call: "GET /items/99"
            gives: "404"
            note: "not found"
  - id: http-basics
    title: How a request travels
    file: chapters/02-http.md
    minutes: 45
    folder: 02-http
    tasks:
      - id: health
        title: "GET /health: the status and the count"
        hints:
          - "There is no /health route yet. It is a GET route like the others in main.py."
          - "Give back a dict with two keys: status, always the text ok, and items."
          - "len(FOUND) counts the items, so the number stays right when items are added."
        examples:
          - call: "GET /health"
            gives: '{"status": "ok", "items": 4}'
      - id: stations
        title: "GET /stations: each station once, A to Z"
        hints:
          - "Every item has a station. Riverside has two items but must appear once."
          - "A set comprehension over FOUND.values() collects each station once."
          - "sorted() turns the set into a list, A to Z; give it back under the key stations."
        examples:
          - call: "GET /stations"
            gives: '{"stations": ["Old Market", "Riverside", "Tech Park"]}'
  - id: path-and-query
    title: Path and query parameters
    file: chapters/03-path-and-query.md
    minutes: 50
    folder: 03-path-and-query
    tasks:
      - id: search
        title: "GET /items?q=&category=&limit=: search"
        hints:
          - "Function parameters that are not in the path become query parameters: the part after ? in the URL."
          - "Give q and category the type str | None with the default None, and limit the type int with the default 10."
          - "Keep the items whose lower-cased title contains q.lower(), then those of the category, then slice to limit."
        examples:
          - call: "GET /items?q=UMBRELLA"
            gives: "items 1 and 6"
          - call: "GET /items?category=bag&limit=1"
            gives: "item 2"
      - id: by_line
        title: "GET /lines/{line}/items: one line's items"
        hints:
          - "The path has a parameter, {line}, and the function needs a parameter with the same name."
          - "Give it the type Line, the Enum at the top of the file, so purple is refused with 422."
          - "line.value is the text red, blue or green; keep the items whose line equals it."
        examples:
          - call: "GET /lines/red/items"
            gives: '{"line": "red", "items": [item 1, item 3]}'
          - call: "GET /lines/purple/items"
            gives: "422"
  - id: validation
    title: Validating input
    file: chapters/04-validation.md
    minutes: 45
    folder: 04-validation
    tasks:
      - id: limits
        title: "limit 1 to 20, and an offset"
        hints:
          - "Right now /items?limit=0 and limit=500 are both accepted. The rules go into the parameter's type."
          - "Annotated[int, Query(ge=1, le=20)] = 10 says: a whole number from 1 to 20, 10 when not given."
          - "Add offset the same way with ge=0, and slice the list from offset to offset + limit."
        examples:
          - call: "GET /items?limit=0"
            gives: "422"
          - call: "GET /items?offset=2&limit=2"
            gives: "items 3 and 4"
      - id: search_rules
        title: "q 3 to 40 characters, item_id 1 or more"
        hints:
          - "/items?q=ab is accepted today. A search of two letters matches far too much."
          - "Query(min_length=3, max_length=40) inside Annotated sets the rule for q."
          - "For the path, use Path instead of Query, with ge=1."
        examples:
          - call: "GET /items?q=ab"
            gives: "422"
          - call: "GET /items/0"
            gives: "422"
  - id: request-body
    title: Request bodies
    file: chapters/05-request-body.md
    minutes: 50
    folder: 05-request-body
    tasks:
      - id: found_item
        title: "POST /items: log a found item"
        hints:
          - "A POST route is written like a GET one, with @app.post. Its data arrives in the request body as JSON."
          - "A parameter whose type is a Pydantic model, item: FoundItemIn, is read from the body and checked for you."
          - "The new id is max(FOUND) + 1. Store the id and item.model_dump(mode=\"json\") together, then give it back."
        examples:
          - call: 'POST /items {"title": "red scarf", ...}'
            gives: '{"id": 4, "title": "red scarf", ...}'
          - call: 'POST /items {"line": "purple", ...}'
            gives: "422"
      - id: report_lost
        title: "POST /reports: a passenger's report"
        hints:
          - "The model LostReport is ready at the top of the file; the route is not."
          - "details has a default, None, so it is optional; every other field is required."
          - "The id is len(REPORTS) + 1. Append the stored dict to REPORTS and give it back."
        examples:
          - call: 'POST /reports {"title": "grey laptop bag", ...}'
            gives: '{"id": 1, ..., "details": null}'
  - id: fields-and-nested
    title: Fields and nested models
    file: chapters/06-models.md
    minutes: 50
    folder: 06-models
    part: Models and responses
    tasks:
      - id: item_fields
        title: "title rules, a date and a list of tags"
        hints:
          - "Today a title of one letter and an item with no date are both accepted. The rules go into the model."
          - "Field(min_length=3, max_length=60) as the title's default sets its rules; a field typed date makes a real date required."
          - "tags: list[str] with Field(default=[], max_length=5): an empty list when not sent, at most five."
        examples:
          - call: 'POST /items {"title": "ab", ...}'
            gives: "422"
          - call: 'POST /items {..., "found_on": "2026-11-27"}'
            gives: '{"id": 2, ..., "found_on": "2026-11-27", "tags": []}'
      - id: nested_location
        title: "a Location model inside the item"
        hints:
          - "line and station belong together: write them as their own small model."
          - "class Location(BaseModel) with line: Line and station with Field(min_length=2, max_length=40)."
          - "In FoundItemIn, remove line and station and add one field, location, whose type is your new model. The JSON then nests."
        examples:
          - call: 'POST /items {"location": {"line": "blue", "station": "University"}, ...}'
            gives: "200"
          - call: 'POST /items {"line": "blue", "station": "University", ...}'
            gives: "422"
  - id: response-models
    title: Response models
    file: chapters/07-responses.md
    minutes: 45
    folder: 07-responses
    tasks:
      - id: public_report
        title: "GET /reports/{report_id} without the contact"
        hints:
          - "Open /reports/1 in the Preview: the passenger's phone number is there for anyone to read."
          - "ReportPublic, at the top of the file, has every field except contact."
          - "Declare the function's return type as ReportPublic, and FastAPI keeps only those fields."
        examples:
          - call: "GET /reports/1"
            gives: '{"id": 1, "title": "grey laptop bag", ..., "status": "open"}'
            note: "no contact"
      - id: report_list_public
        title: "GET /reports: a list of public reports"
        hints:
          - "The list route shows every contact too."
          - "A return type can be a list of models."
          - "Declare the return type as list[ReportPublic]."
        examples:
          - call: "GET /reports"
            gives: "[{...}, {...}]"
            note: "no contacts"
  - id: status-and-errors
    title: Status codes and errors
    file: chapters/08-errors.md
    minutes: 50
    folder: 08-errors
    tasks:
      - id: created_201
        title: "201 Created for a new item"
        hints:
          - "POST /items works, but answers 200 OK, which does not say that something new now exists."
          - "The decorator takes a status_code argument."
          - "status.HTTP_201_CREATED is 201, with a name that says what it means."
        examples:
          - call: 'POST /items {"title": "red scarf", ...}'
            gives: "201"
      - id: claim_conflict
        title: "409 when an item is already claimed"
        hints:
          - "Claim item 1 twice in /docs: both claims succeed, and the first owner loses it."
          - "When item claimed_by is not None, raise AlreadyClaimed(item_id, item claimed_by)."
          - "Then register a handler function for that exception with the app's exception_handler decorator; it returns a JSONResponse with status 409."
        examples:
          - call: "POST /items/1/claim, twice"
            gives: '409 {"detail": "Item 1 is already claimed", "claimed_by_report": 12}'
  - id: updates
    title: "Updating: PUT, PATCH and DELETE"
    file: chapters/09-updates.md
    minutes: 45
    folder: 09-updates
    tasks:
      - id: patch_item
        title: "PATCH /items/{item_id}: change only what was sent"
        hints:
          - "PUT replaces the whole item. Moving an umbrella to another shelf should not need its title and line again."
          - "ItemUpdate has every field optional. Take it as the body of a @app.patch route."
          - "changes.model_dump(mode=\"json\", exclude_unset=True) holds only what was sent; update the stored dict with it."
        examples:
          - call: 'PATCH /items/2 {"shelf": "B-12"}'
            gives: "item 2 with shelf B-12, everything else as before"
      - id: delete_item
        title: "DELETE /items/{item_id}: 204 No Content"
        hints:
          - "There is no DELETE route yet, so DELETE /items/1 gives 405."
          - "Use find(item_id) for the 404, then remove the key from FOUND with del."
          - "Give the decorator status_code 204 and answer with an empty Response(status_code=204)."
        examples:
          - call: "DELETE /items/1"
            gives: "204"
          - call: "GET /items/1 afterwards"
            gives: "404"
  - id: forms-and-files
    title: Headers, forms and files
    file: chapters/10-files.md
    minutes: 50
    folder: 10-files
    tasks:
      - id: desk_header
        title: "X-Desk-Key: only staff log items"
        hints:
          - "POST /items accepts anyone today."
          - "A parameter x_desk_key with Annotated[str | None, Header()] = None reads the X-Desk-Key header."
          - "When it is not DESK_KEY, raise HTTPException with status 401."
        examples:
          - call: "POST /items without X-Desk-Key"
            gives: "401"
      - id: upload_photo
        title: "POST /items/{item_id}/photo: a checked upload"
        hints:
          - "A parameter photo: UploadFile receives an uploaded file; it needs an async def route to await photo.read()."
          - "photo.content_type says what kind of file it claims to be; PHOTO_TYPES maps the allowed ones to an extension."
          - "len(data) is the size in bytes. Save with Path.write_bytes under photos/, named by the item id."
        examples:
          - call: "POST /items/1/photo (a small PNG)"
            gives: '{"item_id": 1, "filename": "umbrella.png", "saved_as": "photos/1.png", "size": 1000}'
          - call: "POST /items/1/photo (a text file)"
            gives: "415"
  - id: dependencies
    title: Dependencies
    file: chapters/11-dependencies.md
    minutes: 50
    folder: 11-dependencies
    part: Structure and data
    tasks:
      - id: pagination_dep
        title: "paginate: one dependency for every list"
        hints:
          - "GET /items pages with offset and limit; GET /reports gives back everything. The paging should be written once."
          - "A dependency is a plain function whose parameters FastAPI reads like a route's: put offset and limit there."
          - "Give back both values together (a small model), and take it in each route with Annotated and Depends(paginate)."
        examples:
          - call: "GET /reports?offset=1&limit=2"
            gives: "reports 2 and 3"
          - call: "GET /reports?limit=0"
            gives: "422"
      - id: desk_dep
        title: "require_desk: guard two routes"
        hints:
          - "DELETE /items/1 works without any key today; POST /items checks the key by hand."
          - "Move the key check into a function require_desk that reads the header, raises 401, and gives back the station."
          - "POST takes the station as a parameter with Depends; DELETE only needs the guard: dependencies= in its decorator."
        examples:
          - call: "DELETE /items/1 without X-Desk-Key"
            gives: "401"
          - call: "POST /items with the Airport key"
            gives: '{"id": 7, "title": ..., "logged_at": "Airport"}'
  - id: databases
    title: A real database
    file: chapters/12-database.md
    minutes: 55
    folder: 12-database
    tasks:
      - id: create_found
        title: "POST /items: save a row"
        hints:
          - "There is no POST route yet. The table model Item and the input model ItemCreate are ready."
          - "Item.model_validate(item) turns the input into a row; the session dependency gives you a session."
          - "session.add, then session.commit, then session.refresh so the row gets its id; give it back with status 201."
        examples:
          - call: 'POST /items {"title": "red scarf", "station": "University"}'
            gives: '201 {"id": 1, "title": "red scarf", "station": "University", "status": "held"}'
      - id: read_found
        title: "GET /items/{item_id}: read a row"
        hints:
          - "There is no route for one item yet."
          - "session.get(Item, item_id) finds a row by its primary key, or gives None."
          - "When it gives None, raise HTTPException with 404."
        examples:
          - call: "GET /items/1"
            gives: '{"id": 1, ...}'
          - call: "GET /items/999999"
            gives: "404"
  - id: crud
    title: Create, read, update, delete
    file: chapters/13-crud.md
    minutes: 55
    folder: 13-crud
    tasks:
      - id: filter_db
        title: "filter in the database"
        hints:
          - "GET /items ignores station and q: the query is always select(Item)."
          - "query.where(...) with a comparison on Item.station gives back a narrower query; store it, and only when station was given."
          - "For q, col(Item.title).contains(q) becomes SQL's LIKE."
        examples:
          - call: "GET /items?station=Riverside"
            gives: "the Riverside items"
          - call: "GET /items?q=umbrella"
            gives: "the umbrellas"
      - id: update_db
        title: "PATCH /items/{item_id} on a row"
        hints:
          - "There is no PATCH route yet; ItemUpdate has every field optional."
          - "Find the row (find gives 404), then db_item.sqlmodel_update with the fields that were sent."
          - "model_dump(exclude_unset=True), then session.add, commit, refresh, and give the row back."
        examples:
          - call: 'PATCH /items/2 {"status": "returned"}'
            gives: "item 2, status returned"
  - id: bigger-apps
    title: Bigger applications
    file: chapters/14-bigger-app.md
    minutes: 50
    folder: 14-bigger-app
    tasks:
      - id: reports_router
        title: "a router for reports"
        hints:
          - "The report routes sit in app/main.py; the item routes already have their own file. Open app/routers/items.py."
          - "Create app/routers/reports.py with router = APIRouter(prefix=..., tags=[...]) and the three routes on router."
          - "In main.py, import it next to items, include it, and delete the old report routes there."
        examples:
          - call: "GET /reports"
            gives: "tagged reports in /docs"
      - id: app_metadata
        title: "a name, a version and a summary"
        hints:
          - "The top of /docs says FastAPI 0.1.0: those are the defaults."
          - "FastAPI(...) takes title, version and summary."
          - "Keep lifespan=lifespan among the arguments."
        examples:
          - call: "GET /openapi.json"
            gives: '"info": {"title": "Lostdesk", "version": "1.0.0", ...}'
  - id: testing
    title: Testing your API
    file: chapters/15-testing.md
    minutes: 55
    folder: 15-testing
    tasks:
      - id: override_db
        title: "a test database, not the real one"
        hints:
          - "Run the tests, then look: lostdesk.db appears. Tests that create items would write into it."
          - "A pytest fixture can create an in-memory engine (sqlite:// with StaticPool) and its tables."
          - "Point the app at it with app.dependency_overrides[get_session], yield a TestClient, then clear the overrides."
        examples:
          - call: "python -m pytest -q"
            gives: "passed, and no rows in lostdesk.db"
      - id: write_tests
        title: "tests that catch three bugs"
        hints:
          - "The check runs your tests on the real app (all must pass) and on three copies with a bug planted in each."
          - "Each rule needs a test that would fail if the rule broke: a status code, a read-back, a filter."
          - "Compare the whole read-back answer with what POST gave you, and check exactly which titles a filter gives."
        examples:
          - call: "python -m pytest -q"
            gives: "4 passed"
  - id: security
    title: Passwords and tokens
    file: chapters/16-security.md
    minutes: 55
    folder: 16-security
    part: Production
    tasks:
      - id: hash_passwords
        title: "hash passwords, check them, sign staff in"
        hints:
          - "Right now hash_password gives back the password itself, so STAFF stores every password as plain text."
          - "password_hash, made with PasswordHash.recommended(), has hash and verify methods."
          - "authenticate looks the user up, verifies the password against hashed_password, and checks DUMMY_HASH for unknown names."
        examples:
          - call: "hash_password(...)"
            gives: "$argon2id$v=19$..."
      - id: login_token
        title: "POST /token: a signed token"
        hints:
          - "There is no /token route yet. The login form arrives as form fields named username and password."
          - "A parameter typed Annotated[OAuth2PasswordRequestForm, Depends()] reads that form."
          - "On success give back Token(access_token=create_access_token(...), token_type=\"bearer\"); otherwise 401 with WWW-Authenticate: Bearer."
        examples:
          - call: "POST /token username=meera password=..."
            gives: '{"access_token": "eyJ...", "token_type": "bearer"}'
          - call: "POST /token with a wrong password"
            gives: "401"
  - id: current-user
    title: Protecting routes
    file: chapters/17-current-user.md
    minutes: 50
    folder: 17-current-user
    tasks:
      - id: current_user
        title: "get_current_user: check the token"
        hints:
          - "Today get_current_user gives back Meera whatever the token says."
          - "jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM]) checks the signature and the expiry, and gives back the claims."
          - "It raises InvalidTokenError for any bad token: catch it and raise a 401 with WWW-Authenticate: Bearer. Then look up the sub."
        examples:
          - call: "GET /me with Arjun's token"
            gives: '{"username": "arjun", ..., "role": "supervisor"}'
          - call: "GET /me with an expired token"
            gives: "401"
      - id: supervisor_only
        title: "403 for anyone but a supervisor"
        hints:
          - "A clerk can delete items today."
          - "require_supervisor already receives the current user; check its role."
          - "Raise HTTPException with status 403 for other roles, and add the dependency to the DELETE route's decorator."
        examples:
          - call: "DELETE /items/1 as Meera (clerk)"
            gives: "403"
          - call: "DELETE /items/1 as Arjun (supervisor)"
            gives: "204"
  - id: async-and-background
    title: Async and background tasks
    file: chapters/18-background.md
    minutes: 50
    folder: 18-background
    tasks:
      - id: notify_background
        title: "send the text message after the answer"
        hints:
          - "POST /items/1/match/1 takes 1.5 seconds: the text message is sent before the answer."
          - "Add a parameter of type BackgroundTasks to the route."
          - "Call its add_task with send_text_message and the same two arguments, instead of calling send_text_message."
        examples:
          - call: "POST /items/1/match/1"
            gives: '{"item_id": 1, "report_id": 1, "notice": "queued"}, at once'
      - id: parallel_search
        title: "two searches at the same time"
        hints:
          - "GET /search waits for one search, then the other: about 0.8 seconds."
          - "asyncio.gather takes several awaitables and waits for all of them at once."
          - "reports, logs = await asyncio.gather(..., ...) keeps the order you gave."
        examples:
          - call: "GET /search?q=laptop"
            gives: "in about 0.4 s"
  - id: middleware-and-settings
    title: Middleware, CORS and settings
    file: chapters/19-settings.md
    minutes: 50
    folder: 19-settings
    tasks:
      - id: timing_header
        title: "X-Process-Time on every response"
        hints:
          - "No response says how long it took. Something must wrap every request."
          - "An async function decorated with the app's middleware decorator (for http) receives the request and call_next."
          - "Note time.perf_counter() before and after await call_next(request), and set the header on the response."
        examples:
          - call: "GET /items"
            gives: "X-Process-Time: 0.42 ms"
      - id: settings_env
        title: "settings from environment variables"
        hints:
          - "The three values are written into the code; changing one means changing the code."
          - "A class that inherits from BaseSettings reads each field from an environment variable of the same name."
          - "SettingsConfigDict(env_prefix=\"LOSTDESK_\") as model_config adds the prefix; then use settings.app_name and the rest."
        examples:
          - call: "LOSTDESK_MAX_PHOTO_MB=5, then GET /info"
            gives: '{"app_name": "Lostdesk", "max_photo_mb": 5}'
  - id: live-updates
    title: Live updates with Server-Sent Events
    file: chapters/20-live.md
    minutes: 45
    folder: 20-live
    tasks:
      - id: sse_feed
        title: "GET /items/feed: a stream of found items"
        hints:
          - "There is no feed yet. A Server-Sent Events route gives EventSourceResponse as its response_class."
          - "Make the function async def and yield instead of return: each yield is one event."
          - "Yield a ServerSentEvent(data=item) for each item whose id is greater than since."
        examples:
          - call: "GET /items/feed?since=2"
            gives: 'data: {"id": 3, ...}'
      - id: sse_resume
        title: "named events, with ids, and Last-Event-ID"
        hints:
          - "A browser that loses the stream reconnects and sends the last id it saw in the Last-Event-ID header."
          - "ServerSentEvent takes event= and id= (the id as text)."
          - "Read the header with a parameter last_event_id and Header(); use it when since was not given."
        examples:
          - call: "GET /items/feed with Last-Event-ID: 2"
            gives: "event: found, id: 3"
  - id: capstone
    title: "Capstone: claims, and going live"
    file: chapters/21-capstone.md
    minutes: 60
    folder: 21-capstone
    tasks:
      - id: claim_flow
        title: "POST /claims: an item meets its report"
        hints:
          - "There is no /claims POST route. Read the item and the report with session.get first."
          - "404 when either is missing; 409 when the item is not held or the report is not open."
          - "Change both statuses, make a Claim, add all three to the session and commit once; refresh the claim."
        examples:
          - call: 'POST /claims {"item_id": 1, "report_id": 1}'
            gives: '201 {"id": 1, "item_id": 1, "report_id": 1, "collected_on": null}'
          - call: "the same claim again"
            gives: "409"
      - id: collect_item
        title: "POST /claims/{claim_id}/collect: the owner collects"
        hints:
          - "The owner came to the desk. Find the claim, or 404."
          - "A claim with collected_on already set gives 409."
          - "Set the item to returned and collected_on to date.today(), save both, give back the claim."
        examples:
          - call: "POST /claims/1/collect"
            gives: '{"id": 1, ..., "collected_on": "2026-11-28"}'
