id: fastapi-first-api
version: 2
title: "FastAPI: your first API"
subtitle: Build a real menu API for a snack corner and watch it answer in the Preview tab.
description: Build a real menu API for a snack corner and watch it answer in the Preview tab.
language: python
track: frameworks
tags: [python, fastapi]
level: beginner
estimated_minutes: 15
story:
  company: Ravi's Snack Corner
  character: { name: Ravi, role: "Owner, Ravi's Snack Corner" }
  pitch: "Ravi wants his WhatsApp bot to read the menu and prices from an API instead of a photo."
cover_scene: "Ravi's Snack Corner: a small roadside snack counter at night, plates of vada pav and bun maska on the counter, glowing translucent menu cards floating above it connected by thin lines of light to a smartphone."
cover: cover.svg
cover_credit: { by: "Logos: fastapi,python", source: "devicon (MIT)" }
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Python basics. You build a small web API with FastAPI, so you should be comfortable with functions and dictionaries
    in Python.
  needs:
  - know: Python functions, lists and dictionaries
    why: Every endpoint in FastAPI is a Python function that returns data.
    lab: python-basics
    where: chapters 1 to 12
image: labbox/fastapi-first-api:v1
resources: xs
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
preview:
  - { name: "Menu API", port: 8000, path: "/" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 30
  network: none
chapters:
  - id: 01-menu-api
    title: A menu that answers
    file: chapters/01-menu-api.md
    minutes: 15
    tasks:
      - id: menu
        title: "GET /menu: list every item"
        hints:
          - "Look at the second TODO in main.py: there is no /menu route yet."
          - "A route is a function with a decorator above it, just like home(), but for the /menu path. Return a dict."
          - "sorted() on a dict gives a list of its keys, A to Z. Return that list under the key items."
      - id: price
        title: "GET /menu/{item}: one item's price"
        hints:
          - "The item name comes from the URL path, like /menu/fried idli."
          - "Put the item name in the path inside curly braces, and give the function a parameter with the same name."
          - "If item is not in MENU, raise HTTPException(status_code=404). Otherwise return the item and MENU[item]."
