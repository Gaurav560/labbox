id: spring-boot-first-api
version: 2
title: "Spring Boot"
subtitle: From zero to a tested, secure, database-backed REST API, explained line by line in 31 chapters.
description: "Learn Spring Boot from the beginning: what a framework is and why Spring exists, how a Spring Boot
  application starts, beans and dependency injection, controllers, services and repositories, requests and
  responses, validation and errors, databases with Spring Data JPA, transactions, testing and security, by
  building one Shop API chapter by chapter."
language: java
track: frameworks
tags: [java, spring-boot]
level: beginner
estimated_minutes: 1200
cover_scene: "A small online shop's backend: a clean server rack with a green leaf on top, product cards and JSON brackets floating beside it."
cover: cover.svg
cover_credit: { by: "Logos: spring,java", source: "devicon (MIT)" }
# What a learner needs to know first (shown on the course page; owner, 24 November).
before_you_start:
  summary: Basic Java, and nothing about Spring. Chapter 0 explains what a backend is, and the early chapters explain HTTP
    and Maven before any Spring code.
  needs:
  - know: Basic Java, meaning classes, methods, if, loops and lists
    why: Every chapter writes Java classes; Spring adds annotations on top of ordinary Java.
    lab: java-basics
    where: chapters 1 to 12
image: labbox/spring-boot-first-api:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
preview:
  - { name: "Shop API", port: 8080, path: "/hello" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
  - id: 00-what-is-spring-boot
    part: Foundations
    title: What Spring Boot is, and why it exists
    file: chapters/00-what-is-spring-boot.md
    minutes: 35
    tasks:
      - id: app_name
        title: "Name the application"
        hints:
          - "Open 00-what-is-spring-boot/src/main/resources/application.properties: the TODO line is there."
          - "A setting is one line: the property name, an equals sign, then the value, with no spaces around it."
          - "The property is spring.application.name and the value is shop-api, with no quotes. Replace the TODO comment with it."
        examples:
          - call: "spring.application.name"
            gives: "shop-api"
          - call: "the start-up log"
            gives: "[shop-api] in every line"
  - id: 01-how-the-web-works
    title: How the web works
    file: chapters/01-how-the-web-works.md
    minutes: 40
    tasks:
      - id: http_status
        title: "Read the answers to GET requests"
        hints:
          - "Start the menu API in Terminal 1, open Terminal 2 with +, and run curl -i on /menu and on /menu/42."
          - "The status code is the number on the first line of the answer, after HTTP/1.1."
          - "The Content-Type line is among the headers; write only the part before any semicolon."
        examples:
          - call: "curl -i localhost:8080/menu"
            gives: "a status, headers, a blank line, then JSON"
      - id: http_methods
        title: "Create and remove menu items"
        hints:
          - "Use the POST command from the lesson exactly, with -i so the headers are shown."
          - "The status and the Location header are both in the answer to that POST."
          - "For the delete, run curl -i -X DELETE localhost:8080/menu/2 and read its first line."
        examples:
          - call: "POST /menu with a JSON body"
            gives: "a status, and a Location header"
  - id: 02-maven-and-the-project
    title: Maven and the pom.xml
    file: chapters/02-maven-and-the-project.md
    minutes: 35
    tasks:
      - id: add_actuator
        title: "Add the Actuator starter"
        hints:
          - "A new library means a new dependency block inside dependencies in pom.xml."
          - "Copy the shape of the spring-boot-starter-web block: a groupId and an artifactId, and no version."
          - "The groupId is org.springframework.boot and the artifactId is spring-boot-starter-actuator."
        examples:
          - call: "GET /actuator/health"
            gives: "{\"status\":\"UP\"}"
      - id: project_identity
        title: "Name the project shop-api"
        hints:
          - "Two values in pom.xml still say demo."
          - "Change the project's own artifactId (not the one inside parent), then look inside build."
          - "Both the artifactId under groupId com.shop and the finalName inside build should read shop-api."
        examples:
          - call: "mvn -q -o package -DskipTests"
            gives: "target/shop-api.jar"
  - id: 03-first-endpoints
    title: Your first endpoints
    file: chapters/03-first-endpoints.md
    minutes: 35
    tasks:
      - id: hello
        title: "GET /hello: a plain text greeting"
        hints:
          - "MerchantController has no methods yet, so every URL returns 404."
          - "Add a public method with a mapping annotation for GET on the /hello path, like StatusController in the lesson."
          - "The method returns a String: Hello from the Shop API! with exactly those capitals and the exclamation mark."
        examples:
          - call: "GET /hello"
            gives: "Hello from the Shop API!"
      - id: merchants
        title: "GET /merchants: names A to Z, as JSON"
        hints:
          - "MERCHANTS is already there, but it is not in A to Z order, and you should not change the constant."
          - "Return a List<String> from a GET method for /merchants: Spring turns it into a JSON array."
          - "Build a sorted copy with a stream: take MERCHANTS, sort it, collect it to a list, and return that."
        examples:
          - call: "GET /merchants"
            gives: "[\"Annapurna Mess\",\"Book Point\",\"Kirana King\"]"
  - id: 04-app-startup
    title: How a Spring Boot app starts
    file: chapters/04-app-startup.md
    minutes: 35
    tasks:
      - id: component_scan
        title: "Make Spring find StatusController"
        hints:
          - "Compare the package of StatusController with the package of ShopApiApplication."
          - "Component scanning only searches com.shop and the packages below it."
          - "Move the file to src/main/java/com/shop/status/ and change its package line to match that folder."
        examples:
          - call: "GET /status"
            gives: "ok"
      - id: greeting_property
        title: "Set the greeting in application.properties"
        hints:
          - "GreetingController reads the property shop.greeting with @Value, and falls back to not set."
          - "Add one line to 04-app-startup/src/main/resources/application.properties."
          - "The line is the property name, an equals sign, and the text Welcome to the Shop API."
        examples:
          - call: "GET /greeting"
            gives: "Welcome to the Shop API"
  - id: 05-beans
    title: Beans and the application context
    file: chapters/05-beans.md
    minutes: 40
    tasks:
      - id: price_service
        title: "Inject the price calculator"
        hints:
          - "Spring can only inject beans, and PriceCalculator is not one yet."
          - "Mark PriceCalculator as a service, then give PriceController a constructor with a PriceCalculator parameter."
          - "In the constructor, assign the parameter to the calculator field, and make the field final."
        examples:
          - call: "GET /kulfi/price"
            gives: "2360"
            note: "2000 paise plus 18% GST"
      - id: one_counter
        title: "One visit counter for everyone"
        hints:
          - "HomeController creates its own VisitCounter, so StatsController never sees those visits."
          - "Ask for the VisitCounter in HomeController's constructor, the way StatsController does."
          - "Remove the creation with new, keep the field final, and set it from the constructor parameter."
        examples:
          - call: "GET / twice, then GET /stats"
            gives: "2 more than before"
  - id: 06-dependency-injection
    title: Dependency injection in depth
    file: chapters/06-dependency-injection.md
    minutes: 35
    tasks:
      - id: primary_gateway
        title: "Make UPI the main payment gateway"
        hints:
          - "Two beans implement PaymentGateway, so Spring cannot choose one for CheckoutService."
          - "One annotation on a bean marks it as the default when several fit."
          - "Put @Primary on UpiGateway, with the import org.springframework.context.annotation.Primary."
        examples:
          - call: "GET /pay/5000"
            gives: "Paid Rs 50 by UPI"
      - id: all_gateways
        title: "List every payment gateway"
        hints:
          - "A constructor can ask Spring for every bean of a type at once."
          - "Take a List<PaymentGateway> in a GatewayController constructor and keep it in a final field."
          - "In gateways(), stream the list, map each gateway to its name(), sort, and collect to a list."
        examples:
          - call: "GET /gateways"
            gives: "[\"card\",\"upi\"]"
  - id: 07-configuration-and-profiles
    title: Configuration and profiles
    file: chapters/07-configuration-and-profiles.md
    minutes: 40
    tasks:
      - id: shop_properties
        title: "The shop's settings, typed"
        hints:
          - "Three files: the settings in application.yml, the binding on ShopProperties, and the controller."
          - "Bind the record with @ConfigurationProperties and the prefix shop; in YAML, put name and free-delivery-above-paise under shop."
          - "Give ShopInfoController a constructor that takes ShopProperties, and answer with its name and freeDeliveryAbovePaise."
        examples:
          - call: "GET /shop/info"
            gives: "{\"name\": \"Shop API\", \"freeDeliveryAbovePaise\": 50000}"
      - id: prod_profile
        title: "Production settings in a profile"
        hints:
          - "A profile file sits next to application.yml and is named after the profile."
          - "Create application-prod.yml with only the settings that differ in production."
          - "Under shop, set the name to Shop API (production) and free-delivery-above-paise to 100000."
        examples:
          - call: "GET /shop/info with --spring.profiles.active=prod"
            gives: "{\"name\": \"Shop API (production)\", \"freeDeliveryAbovePaise\": 100000}"
  - id: 08-auto-configuration
    title: How auto-configuration works
    file: chapters/08-auto-configuration.md
    minutes: 40
    tasks:
      - id: backs_off
        title: "Make ShopKit's default greeter back off"
        hints:
          - "Two Greeter beans exist: the shop's own and ShopKit's default; the default should step aside."
          - "Spring Boot's defaults use a condition that only applies when no bean of that type exists yet."
          - "On the defaultGreeter method, add the condition named ConditionalOnMissingBean (import it from org.springframework.boot.autoconfigure.condition)."
        examples:
          - call: "GET /greeting"
            gives: "Welcome to the Shop API"
          - call: "an app without its own Greeter"
            gives: "Hello from ShopKit"
      - id: on_property
        title: "A festival switch in the settings"
        hints:
          - "A condition can look at a setting: the banner should exist only when shop.festival.enabled is true."
          - "Use @ConditionalOnProperty with the prefix shop.festival, the name enabled, and havingValue true."
          - "Then switch it on for the shop: add shop.festival.enabled with the value true to application.properties."
        examples:
          - call: "GET /banner"
            gives: "Diwali sale: 20% off sweets!"
          - call: "GET /banner with --shop.festival.enabled=false"
            gives: "No festival today"
  - id: 09-bean-lifecycle
    title: The life of a bean
    file: chapters/09-bean-lifecycle.md
    minutes: 35
    tasks:
      - id: post_construct
        title: "Load the prices at start-up"
        hints:
          - "load() reads prices.csv, but nothing ever calls it."
          - "Spring can call a method once, right after it creates the bean, if you mark it."
          - "The annotation is PostConstruct, from jakarta.annotation; it goes on the line above load()."
        examples:
          - call: "GET /prices/KUL-1"
            gives: "2000"
          - call: "GET /prices/count"
            gives: "3"
      - id: prototype_scope
        title: "A fresh receipt for every customer"
        hints:
          - "ReceiptPrinter keeps state, but it is a singleton, so every customer shares one."
          - "A bean's scope decides how many copies Spring makes."
          - "Use the Scope annotation (org.springframework.context.annotation.Scope) on ReceiptPrinter, with the value prototype."
        examples:
          - call: "GET /receipt/kulfi, then GET /receipt/samosa"
            gives: "[\"1 x samosa\"]"
  - id: 10-how-spring-handles-requests
    part: REST APIs
    title: How Spring handles a request
    file: chapters/10-how-spring-handles-requests.md
    minutes: 35
    tasks:
      - id: class_prefix
        title: "Move the cart under /api/v1"
        hints:
          - "A mapping on the class is joined in front of every method's mapping."
          - "Put a RequestMapping annotation on CartController with the path /api/v1, and leave the method mappings alone."
          - "Import org.springframework.web.bind.annotation.RequestMapping; then GET /api/v1/cart works and GET /cart is 404."
        examples:
          - call: "GET /api/v1/cart"
            gives: "[]"
          - call: "GET /cart"
            gives: "404"
      - id: method_routing
        title: "DELETE empties the cart"
        hints:
          - "The same path can have one Java method per HTTP method."
          - "Add a method with a DeleteMapping for the cart path, the same path the GET uses."
          - "In it, clear the items list and return it."
        examples:
          - call: "DELETE /api/v1/cart"
            gives: "[]"
  - id: 11-reading-the-request
    title: Reading the request
    file: chapters/11-reading-the-request.md
    minutes: 40
    tasks:
      - id: product_by_id
        title: "GET /products/{id}"
        hints:
          - "Map /products/{id} and declare a long parameter with @PathVariable."
          - "Search the repository's list for the product with that id."
          - "When there is none, throw new ResponseStatusException with HttpStatus.NOT_FOUND."
        examples:
          - call: "GET /products/3"
            gives: "{\"id\":3,\"name\":\"Samosa\",\"pricePaise\":1800}"
          - call: "GET /products/99"
            gives: "404"
      - id: search_products
        title: "GET /products/search"
        hints:
          - "Two @RequestParam parameters: an optional Integer maxPrice and a String sort with a default."
          - "Filter with maxPrice only when it is not null, then sort with a Comparator chosen by sort."
          - "For sort=price use Comparator.comparingInt on the price; otherwise compare the names."
        examples:
          - call: "GET /products/search?maxPrice=2000"
            gives: "[Mango kulfi, Samosa]"
          - call: "GET /products/search?sort=price"
            gives: "[Samosa, Mango kulfi, Fruit custard, Paneer roll]"
  - id: 12-request-bodies
    title: Request bodies and DTOs
    file: chapters/12-request-bodies.md
    minutes: 40
    tasks:
      - id: create_product
        title: "POST /products"
        hints:
          - "Add a method with @PostMapping for /products and a NewProduct parameter."
          - "Mark the parameter with @RequestBody so Spring reads it from the JSON body."
          - "Store it with the repository's add method, passing the name, the price and NEW_PRODUCT_COST_PAISE, and return what it gives back."
        examples:
          - call: "POST /products {\"name\": \"Vada pav\", \"pricePaise\": 2500}"
            gives: "{\"id\": 4, \"name\": \"Vada pav\", ...}"
      - id: product_view
        title: "a ProductView without the cost"
        hints:
          - "The method returns the whole Product, so costPaise is in the JSON."
          - "Change the return type to ProductView and build one from the product's id and name."
          - "Format the price with String.format(\"Rs %d.%02d\", ...) using paise / 100 and paise % 100."
        examples:
          - call: "GET /products/1/view"
            gives: "{\"id\": 1, \"name\": \"Mango kulfi\", \"price\": \"Rs 20.00\"}"
            note: "no costPaise"
  - id: 13-status-codes
    title: Status codes and ResponseEntity
    file: chapters/13-status-codes.md
    minutes: 35
    tasks:
      - id: created_201
        title: "201 Created with a Location"
        hints:
          - "A plain return value always answers 200; return a ResponseEntity<Product> instead."
          - "ResponseEntity.created(uri) sets 201 and the Location header; .body(product) adds the body."
          - "Build the URI from the new product's id, for example with URI.create and the path /products/ plus the id."
        examples:
          - call: "POST /products {\"name\": \"Poha\", \"pricePaise\": 2200}"
            gives: "201, Location: /products/4"
      - id: delete_204
        title: "DELETE answers 204 or 404"
        hints:
          - "repository.delete(id) returns true when it deleted a product."
          - "Return ResponseEntity<Void> so you can choose the status code."
          - "Use noContent().build() when it deleted something, and notFound().build() otherwise."
        examples:
          - call: "DELETE /products/3"
            gives: "204"
          - call: "DELETE /products/3 again"
            gives: "404"
  - id: 14-layers
    title: "Layers: controller, service, repository"
    file: chapters/14-layers.md
    minutes: 35
    tasks:
      - id: thin_controller
        title: "move the average into ProductService"
        hints:
          - "ProductService.averagePrice() returns 0, and the controller does the work itself."
          - "Move the loop from the controller into averagePrice(), reading products from the service's repository."
          - "In the controller, just return what the service method gives; the repository field is then no longer needed there."
        examples:
          - call: "GET /products/average-price"
            gives: "3950"
            note: "worked out by the service"
      - id: budget_products
        title: "findCheaperThan in the repository"
        hints:
          - "budgetProducts() returns an empty list, and the repository has no findCheaperThan yet."
          - "In ProductRepository, filter the products whose pricePaise is below the parameter."
          - "In ProductService.budgetProducts(), return the repository's result for BUDGET_PAISE."
        examples:
          - call: "GET /products/budget"
            gives: "Mango kulfi, Fruit custard, Samosa"
            note: "under Rs 50"
  - id: 15-updating-and-deleting
    title: Updating and deleting
    file: chapters/15-updating-and-deleting.md
    minutes: 35
    tasks:
      - id: put_product
        title: "PUT /products/{id} replaces a product"
        hints:
          - "Add a method with PutMapping for /{id}, taking the id from the path and a ProductInput from the body."
          - "If findById(id) is empty, answer ResponseEntity.notFound().build()."
          - "Otherwise save new Product(id, name, price, stock) from the body, and answer ResponseEntity.ok with the saved product."
        examples:
          - call: "PUT /products/2 {\"name\": \"Fruit custard (large)\", \"pricePaise\": 3500, \"stock\": 20}"
            gives: "200 with the new product"
          - call: "PUT /products/99"
            gives: "404"
      - id: patch_price
        title: "PATCH /products/{id} changes only what is sent"
        hints:
          - "Add a method with PatchMapping for /{id}, with a ProductPatch body; its fields are null when not sent."
          - "Find the old product; for each field, use the patch's value when it is not null, otherwise the old one."
          - "Save the result and answer 200 with it, or 404 when the product does not exist (the map and orElse shape works well)."
        examples:
          - call: "PATCH /products/1 {\"pricePaise\": 2200}"
            gives: "{\"id\":1,\"name\":\"Mango kulfi\",\"pricePaise\":2200,\"stock\":40}"
  - id: 16-validation
    title: Validation
    file: chapters/16-validation.md
    minutes: 35
    tasks:
      - id: validate_product
        title: "validate NewProduct"
        hints:
          - "Constraints go on the record's components, and @Valid goes on the controller parameter."
          - "Use @NotBlank and @Size(max = 40) on the name, and @Positive on the price."
          - "In ProductController, put @Valid before @RequestBody NewProduct."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": 2000}"
            gives: "400"
          - call: "POST /products {\"name\": \"Kulfi\", \"pricePaise\": 2000}"
            gives: "201"
      - id: validate_customer
        title: "validate NewCustomer"
        hints:
          - "Three components, three rules: name, email and phone."
          - "Use @NotBlank on name, @NotBlank and @Email on email, and @Pattern on phone."
          - "The phone pattern is the regular expression for exactly ten digits; then add @Valid in CustomerController."
        examples:
          - call: "POST /customers with \"phone\": \"98765\""
            gives: "400"
          - call: "POST /customers with a valid name, email and phone"
            gives: "201"
  - id: 17-errors
    title: Errors, the same everywhere
    file: chapters/17-errors.md
    minutes: 40
    tasks:
      - id: not_found_problem
        title: "a ProblemDetail for ProductNotFoundException"
        hints:
          - "ApiErrors is already the advice class for every controller; it needs a handler method."
          - "Mark a method as the exception handler for ProductNotFoundException, and return a ProblemDetail."
          - "Create it with ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, the message), then set its title."
        examples:
          - call: "GET /products/99"
            gives: "404 {\"title\": \"Product not found\", \"detail\": \"No product 99\"}"
      - id: validation_problem
        title: "a ProblemDetail for validation errors"
        hints:
          - "Validation failures throw MethodArgumentNotValidException."
          - "Collect getBindingResult().getFieldErrors() into a map of field name to default message."
          - "Return a 400 ProblemDetail titled Invalid request, and add the map with setProperty(\"errors\", ...)."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": -1}"
            gives: "400 {\"title\": \"Invalid request\", \"errors\": {\"name\": ..., \"pricePaise\": ...}}"
  - id: 18-filters-and-interceptors
    title: Filters and interceptors
    file: chapters/18-filters-and-interceptors.md
    minutes: 35
    tasks:
      - id: request_id_filter
        title: "Give every request an id"
        hints:
          - "Everything before chain.doFilter runs before the controller; set the header there."
          - "Read the request's X-Request-Id header; when it is null or blank, use UUID.randomUUID().toString()."
          - "Then call response.setHeader with the name X-Request-Id and that id, before chain.doFilter."
        examples:
          - call: "GET /api/products"
            gives: "X-Request-Id: a new UUID"
          - call: "GET /api/products with X-Request-Id: order-42"
            gives: "X-Request-Id: order-42"
      - id: handled_by_interceptor
        title: "Register the interceptor for the API"
        hints:
          - "An interceptor does nothing until it is registered in a WebMvcConfigurer."
          - "Override addInterceptors(InterceptorRegistry registry) in WebConfig."
          - "Add handledBy to the registry and limit it with addPathPatterns(\"/api/**\")."
        examples:
          - call: "GET /api/products"
            gives: "X-Handled-By: ProductController#all"
          - call: "GET /ping"
            gives: "no X-Handled-By header"
  - id: 19-database
    part: Data
    title: A real database
    file: chapters/19-database.md
    minutes: 45
    tasks:
      - id: product_entity
        title: "make Product a JPA entity"
        hints:
          - "The application does not start: Spring Data says Product is not a managed type."
          - "Put @Entity on the class. Mark the id field as the primary key, and let the database generate it with the IDENTITY strategy."
          - "JPA also needs a constructor with no arguments; make it protected so other code keeps using the real one."
        examples:
          - call: "GET /products"
            gives: "[Mango kulfi, Fruit custard, Samosa], each with an id"
      - id: unique_sku
        title: "one product per SKU"
        hints:
          - "Rules for a single column go in a @Column annotation on its field."
          - "The column must be unique and must not be null."
          - "Use @Column with nullable = false and unique = true on the sku field."
        examples:
          - call: "save a second product with sku KUL-1"
            gives: "DataIntegrityViolationException"
            note: "the database refuses it"
  - id: 20-repositories
    title: Repositories and derived queries
    file: chapters/20-repositories.md
    minutes: 40
    tasks:
      - id: find_by_category
        title: "products by category"
        hints:
          - "A derived query is a method declaration whose name describes the query."
          - "Declare findByCategoryOrderByNameAsc with a String parameter, returning a List<Product>."
          - "In the controller, call it when category is not null, and findAll() otherwise."
        examples:
          - call: "GET /products?category=snacks"
            gives: "[Bhel puri, Kachori, Samosa]"
      - id: sku_conflict
        title: "409 for a duplicate SKU"
        hints:
          - "Spring Data can answer yes or no with an existsBy... method."
          - "Declare a method named existsBySku with a String parameter, returning boolean."
          - "In POST /products, return ResponseEntity.status(HttpStatus.CONFLICT).build() before saving when it is true."
        examples:
          - call: "POST /products with sku KUL-1"
            gives: "409"
          - call: "POST /products with sku RAS-1"
            gives: "201"
  - id: 21-relationships
    title: Relationships and the N+1 problem
    file: chapters/21-relationships.md
    minutes: 45
    tasks:
      - id: order_items
        title: "map orders and their items"
        hints:
          - "Hibernate cannot store a CustomerOrder field as a column until the relationship is mapped."
          - "OrderItem.order is the many-to-one side: it owns the order_id foreign key column (a join column)."
          - "CustomerOrder.items is the one-to-many side, mapped by the order field; cascade all operations so saving an order saves its items."
        examples:
          - call: "GET /orders/1"
            gives: "{\"items\": 2, \"totalPaise\": 9400}"
      - id: fix_n_plus_one
        title: "one query for the order list"
        hints:
          - "findAll() loads the orders; each getItems() then runs one more query."
          - "Add a repository method with @Query using JOIN FETCH, so items load with their orders."
          - "The JPQL is select distinct o from CustomerOrder o join fetch o.items; call that method in summaries()."
        examples:
          - call: "GET /orders"
            gives: "1 SQL query"
            note: "it was 6"
  - id: 22-paging
    title: Queries, paging and sorting
    file: chapters/22-paging.md
    minutes: 35
    tasks:
      - id: paged_products
        title: "products a page at a time"
        hints:
          - "Spring fills a Pageable parameter from ?page, ?size and ?sort by itself."
          - "Add a Pageable parameter to the method and change its return type to Page<Product>."
          - "JpaRepository already has findAll(Pageable): return its result."
        examples:
          - call: "GET /products?page=1&size=2&sort=name"
            gives: "content [Kachori, Mango kulfi], totalElements 6"
      - id: price_range
        title: "a price range with @Query"
        hints:
          - "JPQL works on entity names and fields: Product and pricePaise."
          - "Use between :min and :max and order by the price, with @Param on each parameter."
          - "Declare inPriceRange(int min, int max) with that @Query, and return it from the controller."
        examples:
          - call: "GET /products/price-range?min=2000&max=3000"
            gives: "[Mango kulfi, Kachori, Vada pav, Fruit custard]"
  - id: 23-transactions
    title: Transactions
    file: chapters/23-transactions.md
    minutes: 40
    tasks:
      - id: place_order_atomic
        title: "placing an order is all or nothing"
        hints:
          - "Without a transaction, every saveAndFlush commits on its own."
          - "One annotation makes the whole method run in one transaction."
          - "Mark placeOrder as transactional with Spring's annotation; OutOfStockException is unchecked, so it rolls back."
        examples:
          - call: "placeOrder(kulfi x2, samosa x5), samosas run out"
            gives: "kulfi stock unchanged"
      - id: rollback_checked
        title: "a declined card undoes the order"
        hints:
          - "PaymentDeclinedException extends Exception: it is checked."
          - "Checked exceptions commit by default; the annotation can list exceptions that roll back."
          - "Add rollbackFor = PaymentDeclinedException.class to the transactional annotation on placePaidOrder."
        examples:
          - call: "placePaidOrder(custard x1, \"DECLINE-4242\")"
            gives: "custard stock unchanged"
  - id: 24-migrations
    title: Database migrations with Flyway
    file: chapters/24-migrations.md
    minutes: 35
    tasks:
      - id: add_category_column
        title: "V2 adds the category column"
        hints:
          - "Hibernate validates the schema and finds no category column in product."
          - "Add a new file next to V1, named with version 2 and two underscores before the description."
          - "In it, ALTER TABLE product ADD COLUMN category VARCHAR(40) with a default of 'other', NOT NULL."
        examples:
          - call: "flyway_schema_history"
            gives: "versions 1, 2"
          - call: "GET /products"
            gives: "each product has \"category\": \"other\""
      - id: set_categories
        title: "V3 sets the categories"
        hints:
          - "A data change is a migration too, with the next version number."
          - "Use UPDATE product SET category = ... WHERE sku ..."
          - "KUL-1 and CUS-1 are sweets; SAM-1 is snacks."
        examples:
          - call: "SELECT sku, category FROM product"
            gives: "KUL-1 sweets, CUS-1 sweets, SAM-1 snacks"
  - id: 25-testing-controllers
    part: Production basics
    title: Testing the web layer
    file: chapters/25-testing-controllers.md
    minutes: 40
    tasks:
      - id: controller_test
        title: "test ProductController"
        hints:
          - "The test class needs a MockMvc field and a mocked ProductService field, both filled by Spring."
          - "In each test, first tell the mock what find(...) answers with when(...).thenReturn(...), then perform the request."
          - "For the missing product, the mock answers Optional.empty(), and the test expects status().isNotFound()."
        examples:
          - call: "mvn -q -o test"
            gives: "2 tests, 0 failures"
      - id: catches_bug
        title: "your tests catch a broken controller"
        hints:
          - "The broken controller answers one of the two cases wrongly."
          - "A test that only checks the found product cannot notice a wrong answer for a missing one."
          - "Make sure one test asks for an id the mock does not find, and expects 404."
        examples:
          - call: "your tests, on the broken controller"
            gives: "at least 1 failure"
            note: "that is a pass for this task"
  - id: 26-testing-data
    title: Testing the data layer
    file: chapters/26-testing-data.md
    minutes: 35
    tasks:
      - id: repository_test
        title: "test the category query"
        hints:
          - "Let Spring inject the repository into a field; @DataJpaTest gives it an empty in-memory database."
          - "Save products of two categories, so the test can see that the other category is left out."
          - "Map the result to names and compare with AssertJ's containsExactly, which also checks the order."
        examples:
          - call: "findByCategoryOrderByNameAsc(\"snacks\")"
            gives: "[Bhel puri, Kachori, Samosa]"
      - id: catches_query_bug
        title: "your test catches a wrong order"
        hints:
          - "The broken query finds the right products in the wrong order."
          - "contains(...) and hasSize(...) do not look at the order."
          - "Save at least two snacks whose names sort differently, and assert the exact sorted list."
        examples:
          - call: "your test, on the broken repository"
            gives: "1 failure"
            note: "that is a pass for this task"
  - id: 27-logging-and-health
    title: Logging and health checks
    file: chapters/27-logging-and-health.md
    minutes: 35
    tasks:
      - id: log_warning
        title: "a WARN line, not println"
        hints:
          - "SLF4J's Logger and LoggerFactory come from the org.slf4j package."
          - "Keep one private static final Logger for the class, made by LoggerFactory.getLogger with StockService.class."
          - "Call its warn method with the text Out of stock: {} and the sku as the argument."
        examples:
          - call: "take(\"SAM-1\")"
            gives: "WARN ... c.shop.stock.StockService : Out of stock: SAM-1"
      - id: health_info
        title: "expose health and info"
        hints:
          - "Endpoints are exposed over HTTP with management.endpoints.web.exposure.include."
          - "List both endpoint names, separated by a comma; then turn on the env info contributor with management.info.env.enabled."
          - "Properties starting with info. appear in the info endpoint: set info.app.name."
        examples:
          - call: "GET /actuator/health"
            gives: "{\"status\": \"UP\"}"
          - call: "GET /actuator/info"
            gives: "{\"app\": {\"name\": \"Shop API\"}}"
  - id: 28-security
    title: Security
    file: chapters/28-security.md
    minutes: 45
    tasks:
      - id: public_and_protected
        title: "a public list, a protected rest"
        hints:
          - "Two beans in SecurityConfig: a SecurityFilterChain built from HttpSecurity, and an InMemoryUserDetailsManager."
          - "In authorizeHttpRequests, permit GET on /products first, and require authentication for any other request last."
          - "Turn on HTTP Basic with Customizer.withDefaults(), turn CSRF off, and build users with User.withUsername(...).password(\"{noop}...\").roles(...)."
        examples:
          - call: "GET /products, no login"
            gives: "200"
          - call: "GET /admin/report, no login"
            gives: "401"
          - call: "GET /admin/report as staff"
            gives: "200"
      - id: admin_only
        title: "only admins delete"
        hints:
          - "A rule can match an HTTP method and a path pattern together."
          - "Match DELETE on /products/** and require the ADMIN role with hasRole."
          - "Put that rule before the anyRequest rule; the first match decides."
        examples:
          - call: "DELETE /products/1 as staff"
            gives: "403"
          - call: "DELETE /products/1 as admin"
            gives: "204"
  - id: 29-calling-services
    title: Calling other services
    file: chapters/29-calling-services.md
    minutes: 40
    tasks:
      - id: fetch_stock
        title: "read the supplier's stock"
        hints:
          - "The RestClient already has the supplier's base URL; start with http.get()."
          - "Give uri(...) the path with a {sku} placeholder and the sku, then retrieve() and read the body as SupplierStock.class."
          - "Return the record's available() value."
        examples:
          - call: "GET /supplier-stock/KUL-1"
            gives: "{\"sku\": \"KUL-1\", \"available\": 120}"
      - id: handle_supplier_errors
        title: "not stocked, down, or too slow"
        hints:
          - "A 404 from the supplier throws HttpClientErrorException; catch it in available() and check the status value."
          - "Build a SimpleClientHttpRequestFactory with a read timeout of one second and pass it to the builder's requestFactory(...)."
          - "In the controller, catch RestClientException and answer ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE)."
        examples:
          - call: "GET /supplier-stock/MISSING"
            gives: "{\"available\": 0}"
          - call: "GET /supplier-stock/SLOW"
            gives: "503 after about 1 second"
  - id: 30-capstone
    title: "Capstone: the checkout API"
    file: chapters/30-capstone.md
    minutes: 60
    tasks:
      - id: checkout
        title: "POST /checkout"
        hints:
          - "The service method needs one annotation so all stock changes and the order commit together."
          - "Loop over request.items(): find the StockItem by sku (orElseThrow an OutOfStockException), call take, and add price times quantity."
          - "In the controller, the parameter is @Valid and @RequestBody; answer ResponseEntity.created(...) with the order's id in the URI."
        examples:
          - call: "POST /checkout, 2 x KUL-1 and 1 x CUS-1"
            gives: "201, Location: /orders/1, totalPaise 7000"
      - id: checkout_errors
        title: "clear errors, nothing half-done"
        hints:
          - "ApiErrors needs two @ExceptionHandler methods, each returning a ProblemDetail."
          - "For OutOfStockException: status CONFLICT, the title, and setProperty(\"sku\", e.sku())."
          - "For MethodArgumentNotValidException: collect the field errors into a map, as in chapter 9."
        examples:
          - call: "POST /checkout with 5 x SAM-1 (1 left)"
            gives: "409 {\"title\": \"Out of stock\", \"sku\": \"SAM-1\"}"
          - call: "POST /checkout with a bad email and no items"
            gives: "400 {\"title\": \"Invalid request\", \"errors\": {...}}"
