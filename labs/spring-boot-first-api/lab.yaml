id: spring-boot-first-api
version: 2
title: "Spring Boot"
subtitle: From what a framework is to a tested, secure REST API, one plain step at a time.
description: "Learn Spring Boot from the beginning: what a framework is and why Spring exists, how a Spring Boot
  application starts, beans and dependency injection, controllers, services and repositories, requests and
  responses, validation and errors, databases with Spring Data JPA, transactions, testing and security, by
  building one Shop API chapter by chapter."
language: java
track: frameworks
tags: [java, spring-boot]
level: beginner
estimated_minutes: 440
cover_scene: "A small online shop's backend: a clean server rack with a green leaf on top, product cards and JSON brackets floating beside it."
cover: cover.svg
cover_credit: { by: "Logos: spring,java", source: "devicon (MIT)" }
image: labbox/spring-boot-first-api:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
preview:
  - { name: "Shop API", port: 8080, path: "/hello" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
  - id: 00-what-is-a-framework
    title: What a framework is, and why Spring Boot
    file: chapters/00-what-is-a-framework.md
    minutes: 15
    tasks:
      - id: app_name
        title: "application.properties: name the application"
        hints:
          - "Open src/main/resources/application.properties: there is a TODO line for this task."
          - "A setting is one line: the property name, an equals sign, then the value."
          - "The property is spring.application.name; the value is shop-api, with no quotes."
        examples:
          - call: "spring.application.name in application.properties"
            gives: "shop-api"
  - id: 01-first-endpoints
    title: Your first endpoints
    file: chapters/01-first-endpoints.md
    minutes: 20
    tasks:
      - id: hello
        title: "GET /hello: a plain text greeting"
        hints:
          - "MerchantController has no methods yet, so every URL returns 404."
          - "Add a method to MerchantController with a mapping annotation for the /hello path, like the status example in the lesson."
          - "Return the String Hello from the Shop API! from that method; Spring sends it as plain text."
        examples:
          - call: "GET /hello"
            gives: "Hello from the Shop API!"
      - id: merchants
        title: "GET /merchants: names A to Z, as JSON"
        hints:
          - "MERCHANTS is already there, but it is not in A to Z order."
          - "Return a List<String> from a @GetMapping method: Spring turns it into a JSON array."
          - "Copy the list and sort it (for example with stream().sorted().toList()) before returning it."
        examples:
          - call: "GET /merchants"
            gives: "[\"Annapurna Mess\",\"Brew Point\",\"Kirana King\"]"
  - id: 02-app-startup
    title: How a Spring Boot app starts
    file: chapters/02-app-startup.md
    minutes: 18
    tasks:
      - id: component_scan
        title: "02-app-startup: make Spring find StatusController"
        hints:
          - "Look at the folder StatusController.java is in, and compare it with ShopApiApplication's package."
          - "Component scanning only searches com.shop and the packages below it."
          - "Move the file to src/main/java/com/shop/status/ and change its first line to that package."
        examples:
          - call: "GET /status"
            gives: "ok"
      - id: greeting_property
        title: "02-app-startup: the greeting from application.properties"
        hints:
          - "GreetingController reads the property shop.greeting with @Value."
          - "Add one line to 02-app-startup/src/main/resources/application.properties."
          - "The line is the property name, an equals sign, and the text Welcome to the Shop API."
        examples:
          - call: "GET /greeting"
            gives: "Welcome to the Shop API"
  - id: 03-beans
    title: Beans and dependency injection
    file: chapters/03-beans.md
    minutes: 20
    tasks:
      - id: price_service
        title: "03-beans: inject PriceCalculator into PriceController"
        hints:
          - "Spring can only inject beans, and PriceCalculator is not one yet."
          - "Put @Service on PriceCalculator, then add a constructor to PriceController with a PriceCalculator parameter."
          - "In the constructor, assign the parameter to the calculator field."
        examples:
          - call: "GET /tea/price"
            gives: "2360"
            note: "2000 paise plus 18% GST"
      - id: one_counter
        title: "03-beans: share one VisitCounter"
        hints:
          - "HomeController creates its own VisitCounter, so StatsController never sees its visits."
          - "Ask for the VisitCounter in HomeController's constructor, like StatsController does."
          - "Remove the new VisitCounter() and make the field final, set from the constructor parameter."
        examples:
          - call: "GET / twice, then GET /stats"
            gives: "2 more than before"
  - id: 04-layers
    title: "Layers: controller, service, repository"
    file: chapters/04-layers.md
    minutes: 18
    tasks:
      - id: thin_controller
        title: "04-layers: move the average into ProductService"
        hints:
          - "ProductService.averagePrice() returns 0, and the controller does the work itself."
          - "Move the loop from the controller into averagePrice(), reading products from the service's repository."
          - "In the controller, just return what the service method gives; the repository field is then no longer needed there."
        examples:
          - call: "GET /products/average-price"
            gives: "3950"
            note: "worked out by the service"
      - id: budget_products
        title: "04-layers: findCheaperThan in the repository"
        hints:
          - "budgetProducts() returns an empty list, and the repository has no findCheaperThan yet."
          - "In ProductRepository, filter the products whose pricePaise is below the parameter."
          - "In ProductService.budgetProducts(), return the repository's result for BUDGET_PAISE."
        examples:
          - call: "GET /products/budget"
            gives: "Masala tea, Filter coffee, Samosa"
            note: "under Rs 50"
  - id: 05-reading-the-request
    title: Reading the request
    file: chapters/05-reading-the-request.md
    minutes: 20
    tasks:
      - id: product_by_id
        title: "05-reading-the-request: GET /products/{id}"
        hints:
          - "Map /products/{id} and declare a long parameter with @PathVariable."
          - "Search the repository's list for the product with that id."
          - "When there is none, throw new ResponseStatusException with HttpStatus.NOT_FOUND."
        examples:
          - call: "GET /products/3"
            gives: "{\"id\":3,\"name\":\"Samosa\",\"pricePaise\":1800}"
          - call: "GET /products/99"
            gives: "404"
      - id: search_products
        title: "05-reading-the-request: GET /products/search"
        hints:
          - "Two @RequestParam parameters: an optional Integer maxPrice and a String sort with a default."
          - "Filter with maxPrice only when it is not null, then sort with a Comparator chosen by sort."
          - "For sort=price use Comparator.comparingInt on the price; otherwise compare the names."
        examples:
          - call: "GET /products/search?maxPrice=2000"
            gives: "[Masala tea, Samosa]"
          - call: "GET /products/search?sort=price"
            gives: "[Samosa, Masala tea, Filter coffee, Paneer roll]"
  - id: 06-request-bodies
    title: Request bodies and DTOs
    file: chapters/06-request-bodies.md
    minutes: 20
    tasks:
      - id: create_product
        title: "06-request-bodies: POST /products"
        hints:
          - "Add a method with @PostMapping for /products and a NewProduct parameter."
          - "Mark the parameter with @RequestBody so Spring reads it from the JSON body."
          - "Store it with the repository's add method, passing the name, the price and NEW_PRODUCT_COST_PAISE, and return what it gives back."
        examples:
          - call: "POST /products {\"name\": \"Vada pav\", \"pricePaise\": 2500}"
            gives: "{\"id\": 4, \"name\": \"Vada pav\", ...}"
      - id: product_view
        title: "06-request-bodies: a ProductView without the cost"
        hints:
          - "The method returns the whole Product, so costPaise is in the JSON."
          - "Change the return type to ProductView and build one from the product's id and name."
          - "Format the price with String.format(\"Rs %d.%02d\", ...) using paise / 100 and paise % 100."
        examples:
          - call: "GET /products/1/view"
            gives: "{\"id\": 1, \"name\": \"Masala tea\", \"price\": \"Rs 20.00\"}"
            note: "no costPaise"
  - id: 07-status-codes
    title: Answers and status codes
    file: chapters/07-status-codes.md
    minutes: 18
    tasks:
      - id: created_201
        title: "07-status-codes: 201 Created with a Location"
        hints:
          - "A plain return value always answers 200; return a ResponseEntity<Product> instead."
          - "ResponseEntity.created(uri) sets 201 and the Location header; .body(product) adds the body."
          - "Build the URI from the new product's id, for example with URI.create and the path /products/ plus the id."
        examples:
          - call: "POST /products {\"name\": \"Poha\", \"pricePaise\": 2200}"
            gives: "201, Location: /products/4"
      - id: delete_204
        title: "07-status-codes: DELETE answers 204 or 404"
        hints:
          - "repository.delete(id) returns true when it deleted a product."
          - "Return ResponseEntity<Void> so you can choose the status code."
          - "Use noContent().build() when it deleted something, and notFound().build() otherwise."
        examples:
          - call: "DELETE /products/3"
            gives: "204"
          - call: "DELETE /products/3 again"
            gives: "404"
  - id: 08-validation
    title: Validation
    file: chapters/08-validation.md
    minutes: 18
    tasks:
      - id: validate_product
        title: "08-validation: validate NewProduct"
        hints:
          - "Constraints go on the record's components, and @Valid goes on the controller parameter."
          - "Use @NotBlank and @Size(max = 40) on the name, and @Positive on the price."
          - "In ProductController, put @Valid before @RequestBody NewProduct."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": 2000}"
            gives: "400"
          - call: "POST /products {\"name\": \"Tea\", \"pricePaise\": 2000}"
            gives: "201"
      - id: validate_customer
        title: "08-validation: validate NewCustomer"
        hints:
          - "Three components, three rules: name, email and phone."
          - "Use @NotBlank on name, @NotBlank and @Email on email, and @Pattern on phone."
          - "The phone pattern is the regular expression for exactly ten digits; then add @Valid in CustomerController."
        examples:
          - call: "POST /customers with \"phone\": \"98765\""
            gives: "400"
          - call: "POST /customers with a valid name, email and phone"
            gives: "201"
  - id: 09-errors
    title: Errors, the same everywhere
    file: chapters/09-errors.md
    minutes: 20
    tasks:
      - id: not_found_problem
        title: "09-errors: a ProblemDetail for ProductNotFoundException"
        hints:
          - "ApiErrors is already the advice class for every controller; it needs a handler method."
          - "Mark a method as the exception handler for ProductNotFoundException, and return a ProblemDetail."
          - "Create it with ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, the message), then set its title."
        examples:
          - call: "GET /products/99"
            gives: "404 {\"title\": \"Product not found\", \"detail\": \"No product 99\"}"
      - id: validation_problem
        title: "09-errors: a ProblemDetail for validation errors"
        hints:
          - "Validation failures throw MethodArgumentNotValidException."
          - "Collect getBindingResult().getFieldErrors() into a map of field name to default message."
          - "Return a 400 ProblemDetail titled Invalid request, and add the map with setProperty(\"errors\", ...)."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": -1}"
            gives: "400 {\"title\": \"Invalid request\", \"errors\": {\"name\": ..., \"pricePaise\": ...}}"
  - id: 10-configuration
    title: Configuration and profiles
    file: chapters/10-configuration.md
    minutes: 18
    tasks:
      - id: shop_properties
        title: "10-configuration: typed shop settings"
        hints:
          - "ShopProperties needs @ConfigurationProperties with the prefix shop."
          - "Add the shop settings to application.yml, with name and free-delivery-above-paise under shop."
          - "Give ShopInfoController a constructor that takes ShopProperties, and answer with its name and freeDeliveryAbovePaise."
        examples:
          - call: "GET /shop/info"
            gives: "{\"name\": \"Shop API\", \"freeDeliveryAbovePaise\": 50000}"
      - id: prod_profile
        title: "10-configuration: production settings in a profile"
        hints:
          - "A profile file sits next to application.yml and is named after the profile."
          - "Create application-prod.yml with only the settings that change in production."
          - "Set shop.name to Shop API (production) and shop.free-delivery-above-paise to 100000."
        examples:
          - call: "GET /shop/info with the prod profile"
            gives: "{\"name\": \"Shop API (production)\", \"freeDeliveryAbovePaise\": 100000}"
  - id: 11-database
    title: A real database
    file: chapters/11-database.md
    minutes: 20
    tasks:
      - id: product_entity
        title: "11-database: make Product a JPA entity"
        hints:
          - "The application does not start: Spring Data says Product is not a managed type."
          - "Put @Entity on the class. Mark the id field as the primary key, and let the database generate it with the IDENTITY strategy."
          - "JPA also needs a constructor with no arguments; make it protected so other code keeps using the real one."
        examples:
          - call: "GET /products"
            gives: "[Masala tea, Filter coffee, Samosa], each with an id"
      - id: unique_sku
        title: "11-database: one product per SKU"
        hints:
          - "Rules for a single column go in a @Column annotation on its field."
          - "The column must be unique and must not be null."
          - "Use @Column with nullable = false and unique = true on the sku field."
        examples:
          - call: "save a second product with sku TEA-1"
            gives: "DataIntegrityViolationException"
            note: "the database refuses it"
  - id: 12-repositories
    title: Repositories and derived queries
    file: chapters/12-repositories.md
    minutes: 18
    tasks:
      - id: find_by_category
        title: "12-repositories: products by category"
        hints:
          - "A derived query is a method declaration whose name describes the query."
          - "Declare findByCategoryOrderByNameAsc with a String parameter, returning a List<Product>."
          - "In the controller, call it when category is not null, and findAll() otherwise."
        examples:
          - call: "GET /products?category=snacks"
            gives: "[Bhel puri, Kachori, Samosa]"
      - id: sku_conflict
        title: "12-repositories: 409 for a duplicate SKU"
        hints:
          - "Spring Data can answer yes or no with an existsBy... method."
          - "Declare a method named existsBySku with a String parameter, returning boolean."
          - "In POST /products, return ResponseEntity.status(HttpStatus.CONFLICT).build() before saving when it is true."
        examples:
          - call: "POST /products with sku TEA-1"
            gives: "409"
          - call: "POST /products with sku LAS-1"
            gives: "201"
  - id: 13-relationships
    title: Relationships and the N+1 problem
    file: chapters/13-relationships.md
    minutes: 22
    tasks:
      - id: order_items
        title: "13-relationships: map orders and their items"
        hints:
          - "Hibernate cannot store a CustomerOrder field as a column until the relationship is mapped."
          - "OrderItem.order is the many-to-one side: it owns the order_id foreign key column (a join column)."
          - "CustomerOrder.items is the one-to-many side, mapped by the order field; cascade all operations so saving an order saves its items."
        examples:
          - call: "GET /orders/1"
            gives: "{\"items\": 2, \"totalPaise\": 9400}"
      - id: fix_n_plus_one
        title: "13-relationships: one query for the order list"
        hints:
          - "findAll() loads the orders; each getItems() then runs one more query."
          - "Add a repository method with @Query using JOIN FETCH, so items load with their orders."
          - "The JPQL is select distinct o from CustomerOrder o join fetch o.items; call that method in summaries()."
        examples:
          - call: "GET /orders"
            gives: "1 SQL query"
            note: "it was 6"
  - id: 14-paging
    title: Queries, paging and sorting
    file: chapters/14-paging.md
    minutes: 18
    tasks:
      - id: paged_products
        title: "14-paging: products a page at a time"
        hints:
          - "Spring fills a Pageable parameter from ?page, ?size and ?sort by itself."
          - "Add a Pageable parameter to the method and change its return type to Page<Product>."
          - "JpaRepository already has findAll(Pageable): return its result."
        examples:
          - call: "GET /products?page=1&size=2&sort=name"
            gives: "content [Kachori, Masala tea], totalElements 6"
      - id: price_range
        title: "14-paging: a price range with @Query"
        hints:
          - "JPQL works on entity names and fields: Product and pricePaise."
          - "Use between :min and :max and order by the price, with @Param on each parameter."
          - "Declare inPriceRange(int min, int max) with that @Query, and return it from the controller."
        examples:
          - call: "GET /products/price-range?min=2000&max=3000"
            gives: "[Masala tea, Kachori, Vada pav, Filter coffee]"
  - id: 15-transactions
    title: Transactions
    file: chapters/15-transactions.md
    minutes: 20
    tasks:
      - id: place_order_atomic
        title: "15-transactions: placing an order is all or nothing"
        hints:
          - "Without a transaction, every saveAndFlush commits on its own."
          - "One annotation makes the whole method run in one transaction."
          - "Mark placeOrder as transactional with Spring's annotation; OutOfStockException is unchecked, so it rolls back."
        examples:
          - call: "placeOrder(tea x2, samosa x5), samosas run out"
            gives: "tea stock unchanged"
      - id: rollback_checked
        title: "15-transactions: a declined card undoes the order"
        hints:
          - "PaymentDeclinedException extends Exception: it is checked."
          - "Checked exceptions commit by default; the annotation can list exceptions that roll back."
          - "Add rollbackFor = PaymentDeclinedException.class to the transactional annotation on placePaidOrder."
        examples:
          - call: "placePaidOrder(coffee x1, \"DECLINE-4242\")"
            gives: "coffee stock unchanged"
  - id: 16-migrations
    title: Database migrations with Flyway
    file: chapters/16-migrations.md
    minutes: 18
    tasks:
      - id: add_category_column
        title: "16-migrations: V2 adds the category column"
        hints:
          - "Hibernate validates the schema and finds no category column in product."
          - "Add a new file next to V1, named with version 2 and two underscores before the description."
          - "In it, ALTER TABLE product ADD COLUMN category VARCHAR(40) with a default of 'other', NOT NULL."
        examples:
          - call: "flyway_schema_history"
            gives: "versions 1, 2"
          - call: "GET /products"
            gives: "each product has \"category\": \"other\""
      - id: set_categories
        title: "16-migrations: V3 sets the categories"
        hints:
          - "A data change is a migration too, with the next version number."
          - "Use UPDATE product SET category = ... WHERE sku ..."
          - "TEA-1 and COF-1 are drinks; SAM-1 is snacks."
        examples:
          - call: "SELECT sku, category FROM product"
            gives: "TEA-1 drinks, COF-1 drinks, SAM-1 snacks"
  - id: 17-testing-controllers
    title: Testing the web layer
    file: chapters/17-testing-controllers.md
    minutes: 22
    tasks:
      - id: controller_test
        title: "17-testing-controllers: test ProductController"
        hints:
          - "The test class needs a MockMvc field and a mocked ProductService field, both filled by Spring."
          - "In each test, first tell the mock what find(...) answers with when(...).thenReturn(...), then perform the request."
          - "For the missing product, the mock answers Optional.empty(), and the test expects status().isNotFound()."
        examples:
          - call: "mvn -q -o test"
            gives: "2 tests, 0 failures"
      - id: catches_bug
        title: "17-testing-controllers: your tests catch a broken controller"
        hints:
          - "The broken controller answers one of the two cases wrongly."
          - "A test that only checks the found product cannot notice a wrong answer for a missing one."
          - "Make sure one test asks for an id the mock does not find, and expects 404."
        examples:
          - call: "your tests, on the broken controller"
            gives: "at least 1 failure"
            note: "that is a pass for this task"
  - id: 18-testing-data
    title: Testing the data layer
    file: chapters/18-testing-data.md
    minutes: 18
    tasks:
      - id: repository_test
        title: "18-testing-data: test the category query"
        hints:
          - "Let Spring inject the repository into a field; @DataJpaTest gives it an empty in-memory database."
          - "Save products of two categories, so the test can see that the other category is left out."
          - "Map the result to names and compare with AssertJ's containsExactly, which also checks the order."
        examples:
          - call: "findByCategoryOrderByNameAsc(\"snacks\")"
            gives: "[Bhel puri, Kachori, Samosa]"
      - id: catches_query_bug
        title: "18-testing-data: your test catches a wrong order"
        hints:
          - "The broken query finds the right products in the wrong order."
          - "contains(...) and hasSize(...) do not look at the order."
          - "Save at least two snacks whose names sort differently, and assert the exact sorted list."
        examples:
          - call: "your test, on the broken repository"
            gives: "1 failure"
            note: "that is a pass for this task"
  - id: 19-logging-and-health
    title: Logging and health checks
    file: chapters/19-logging-and-health.md
    minutes: 16
    tasks:
      - id: log_warning
        title: "19-logging-and-health: a WARN line, not println"
        hints:
          - "SLF4J's Logger and LoggerFactory come from the org.slf4j package."
          - "Keep one private static final Logger for the class, made by LoggerFactory.getLogger with StockService.class."
          - "Call its warn method with the text Out of stock: {} and the sku as the argument."
        examples:
          - call: "take(\"SAM-1\")"
            gives: "WARN ... c.shop.stock.StockService : Out of stock: SAM-1"
      - id: health_info
        title: "19-logging-and-health: expose health and info"
        hints:
          - "Endpoints are exposed over HTTP with management.endpoints.web.exposure.include."
          - "List both endpoint names, separated by a comma; then turn on the env info contributor with management.info.env.enabled."
          - "Properties starting with info. appear in the info endpoint: set info.app.name."
        examples:
          - call: "GET /actuator/health"
            gives: "{\"status\": \"UP\"}"
          - call: "GET /actuator/info"
            gives: "{\"app\": {\"name\": \"Shop API\"}}"
  - id: 20-security
    title: Security
    file: chapters/20-security.md
    minutes: 22
    tasks:
      - id: public_and_protected
        title: "20-security: a public list, a protected rest"
        hints:
          - "Two beans in SecurityConfig: a SecurityFilterChain built from HttpSecurity, and an InMemoryUserDetailsManager."
          - "In authorizeHttpRequests, permit GET on /products first, and require authentication for any other request last."
          - "Turn on HTTP Basic with Customizer.withDefaults(), turn CSRF off, and build users with User.withUsername(...).password(\"{noop}...\").roles(...)."
        examples:
          - call: "GET /products, no login"
            gives: "200"
          - call: "GET /admin/report, no login"
            gives: "401"
          - call: "GET /admin/report as staff"
            gives: "200"
      - id: admin_only
        title: "20-security: only admins delete"
        hints:
          - "A rule can match an HTTP method and a path pattern together."
          - "Match DELETE on /products/** and require the ADMIN role with hasRole."
          - "Put that rule before the anyRequest rule; the first match decides."
        examples:
          - call: "DELETE /products/1 as staff"
            gives: "403"
          - call: "DELETE /products/1 as admin"
            gives: "204"
  - id: 21-calling-services
    title: Calling other services
    file: chapters/21-calling-services.md
    minutes: 20
    tasks:
      - id: fetch_stock
        title: "21-calling-services: read the supplier's stock"
        hints:
          - "The RestClient already has the supplier's base URL; start with http.get()."
          - "Give uri(...) the path with a {sku} placeholder and the sku, then retrieve() and read the body as SupplierStock.class."
          - "Return the record's available() value."
        examples:
          - call: "GET /supplier-stock/TEA-1"
            gives: "{\"sku\": \"TEA-1\", \"available\": 120}"
      - id: handle_supplier_errors
        title: "21-calling-services: not stocked, down, or too slow"
        hints:
          - "A 404 from the supplier throws HttpClientErrorException; catch it in available() and check the status value."
          - "Build a SimpleClientHttpRequestFactory with a read timeout of one second and pass it to the builder's requestFactory(...)."
          - "In the controller, catch RestClientException and answer ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE)."
        examples:
          - call: "GET /supplier-stock/MISSING"
            gives: "{\"available\": 0}"
          - call: "GET /supplier-stock/SLOW"
            gives: "503 after about 1 second"
  - id: 22-capstone
    title: "Capstone: the checkout API"
    file: chapters/22-capstone.md
    minutes: 20
    tasks:
      - id: checkout
        title: "22-capstone: POST /checkout"
        hints:
          - "The service method needs one annotation so all stock changes and the order commit together."
          - "Loop over request.items(): find the StockItem by sku (orElseThrow an OutOfStockException), call take, and add price times quantity."
          - "In the controller, the parameter is @Valid and @RequestBody; answer ResponseEntity.created(...) with the order's id in the URI."
        examples:
          - call: "POST /checkout, 2 x TEA-1 and 1 x COF-1"
            gives: "201, Location: /orders/1, totalPaise 7000"
      - id: checkout_errors
        title: "22-capstone: clear errors, nothing half-done"
        hints:
          - "ApiErrors needs two @ExceptionHandler methods, each returning a ProblemDetail."
          - "For OutOfStockException: status CONFLICT, the title, and setProperty(\"sku\", e.sku())."
          - "For MethodArgumentNotValidException: collect the field errors into a map, as in chapter 9."
        examples:
          - call: "POST /checkout with 5 x SAM-1 (1 left)"
            gives: "409 {\"title\": \"Out of stock\", \"sku\": \"SAM-1\"}"
          - call: "POST /checkout with a bad email and no items"
            gives: "400 {\"title\": \"Invalid request\", \"errors\": {...}}"
