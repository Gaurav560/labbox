id: spring-boot-first-api
version: 2
title: "Spring Boot"
subtitle: From what a framework is to a tested, secure REST API, one plain step at a time.
description: "Learn Spring Boot from the beginning: what a framework is and why Spring exists, how a Spring Boot
  application starts, beans and dependency injection, controllers, services and repositories, requests and
  responses, validation and errors, databases with Spring Data JPA, transactions, testing and security, by
  building one Shop API chapter by chapter."
language: java
track: frameworks
tags: [java, spring-boot]
level: beginner
estimated_minutes: 120
cover_scene: "A small online shop's backend: a clean server rack with a green leaf on top, product cards and JSON brackets floating beside it."
cover: cover.svg
cover_credit: { by: "Logos: spring,java", source: "devicon (MIT)" }
image: labbox/spring-boot-first-api:v1
resources: m
workspace:
  mount_path: /workspace
  shell: /bin/bash
  network: bridge
preview:
  - { name: "Shop API", port: 8080, path: "/hello" }
check:
  command: ["bash", "/check/tests/run_checks.sh"]
  timeout_seconds: 240
  network: none
chapters:
  - id: 00-what-is-a-framework
    title: What a framework is, and why Spring Boot
    file: chapters/00-what-is-a-framework.md
    minutes: 15
    tasks:
      - id: app_name
        title: "application.properties: name the application"
        hints:
          - "Open src/main/resources/application.properties: there is a TODO line for this task."
          - "A setting is one line: the property name, an equals sign, then the value."
          - "The property is spring.application.name; the value is shop-api, with no quotes."
        examples:
          - call: "spring.application.name in application.properties"
            gives: "shop-api"
  - id: 01-first-endpoints
    title: Your first endpoints
    file: chapters/01-first-endpoints.md
    minutes: 20
    tasks:
      - id: hello
        title: "GET /hello: a plain text greeting"
        hints:
          - "MerchantController has no methods yet, so every URL returns 404."
          - "Add a method to MerchantController with a mapping annotation for the /hello path, like the status example in the lesson."
          - "Return the String Hello from the Shop API! from that method; Spring sends it as plain text."
        examples:
          - call: "GET /hello"
            gives: "Hello from the Shop API!"
      - id: merchants
        title: "GET /merchants: names A to Z, as JSON"
        hints:
          - "MERCHANTS is already there, but it is not in A to Z order."
          - "Return a List<String> from a @GetMapping method: Spring turns it into a JSON array."
          - "Copy the list and sort it (for example with stream().sorted().toList()) before returning it."
        examples:
          - call: "GET /merchants"
            gives: "[\"Annapurna Mess\",\"Brew Point\",\"Kirana King\"]"
  - id: 02-app-startup
    title: How a Spring Boot app starts
    file: chapters/02-app-startup.md
    minutes: 18
    tasks:
      - id: component_scan
        title: "02-app-startup: make Spring find StatusController"
        hints:
          - "Look at the folder StatusController.java is in, and compare it with ShopApiApplication's package."
          - "Component scanning only searches com.shop and the packages below it."
          - "Move the file to src/main/java/com/shop/status/ and change its first line to that package."
        examples:
          - call: "GET /status"
            gives: "ok"
      - id: greeting_property
        title: "02-app-startup: the greeting from application.properties"
        hints:
          - "GreetingController reads the property shop.greeting with @Value."
          - "Add one line to 02-app-startup/src/main/resources/application.properties."
          - "The line is the property name, an equals sign, and the text Welcome to the Shop API."
        examples:
          - call: "GET /greeting"
            gives: "Welcome to the Shop API"
  - id: 03-beans
    title: Beans and dependency injection
    file: chapters/03-beans.md
    minutes: 20
    tasks:
      - id: price_service
        title: "03-beans: inject PriceCalculator into PriceController"
        hints:
          - "Spring can only inject beans, and PriceCalculator is not one yet."
          - "Put @Service on PriceCalculator, then add a constructor to PriceController with a PriceCalculator parameter."
          - "In the constructor, assign the parameter to the calculator field."
        examples:
          - call: "GET /tea/price"
            gives: "2360"
            note: "2000 paise plus 18% GST"
      - id: one_counter
        title: "03-beans: share one VisitCounter"
        hints:
          - "HomeController creates its own VisitCounter, so StatsController never sees its visits."
          - "Ask for the VisitCounter in HomeController's constructor, like StatsController does."
          - "Remove the new VisitCounter() and make the field final, set from the constructor parameter."
        examples:
          - call: "GET / twice, then GET /stats"
            gives: "2 more than before"
  - id: 04-layers
    title: "Layers: controller, service, repository"
    file: chapters/04-layers.md
    minutes: 18
    tasks:
      - id: thin_controller
        title: "04-layers: move the average into ProductService"
        hints:
          - "ProductService.averagePrice() returns 0, and the controller does the work itself."
          - "Move the loop from the controller into averagePrice(), reading products from the service's repository."
          - "In the controller, just return what the service method gives; the repository field is then no longer needed there."
        examples:
          - call: "GET /products/average-price"
            gives: "3950"
            note: "worked out by the service"
      - id: budget_products
        title: "04-layers: findCheaperThan in the repository"
        hints:
          - "budgetProducts() returns an empty list, and the repository has no findCheaperThan yet."
          - "In ProductRepository, filter the products whose pricePaise is below the parameter."
          - "In ProductService.budgetProducts(), return the repository's result for BUDGET_PAISE."
        examples:
          - call: "GET /products/budget"
            gives: "Masala tea, Filter coffee, Samosa"
            note: "under Rs 50"
  - id: 05-reading-the-request
    title: Reading the request
    file: chapters/05-reading-the-request.md
    minutes: 20
    tasks:
      - id: product_by_id
        title: "05-reading-the-request: GET /products/{id}"
        hints:
          - "Map /products/{id} and declare a long parameter with @PathVariable."
          - "Search the repository's list for the product with that id."
          - "When there is none, throw new ResponseStatusException with HttpStatus.NOT_FOUND."
        examples:
          - call: "GET /products/3"
            gives: "{\"id\":3,\"name\":\"Samosa\",\"pricePaise\":1800}"
          - call: "GET /products/99"
            gives: "404"
      - id: search_products
        title: "05-reading-the-request: GET /products/search"
        hints:
          - "Two @RequestParam parameters: an optional Integer maxPrice and a String sort with a default."
          - "Filter with maxPrice only when it is not null, then sort with a Comparator chosen by sort."
          - "For sort=price use Comparator.comparingInt on the price; otherwise compare the names."
        examples:
          - call: "GET /products/search?maxPrice=2000"
            gives: "[Masala tea, Samosa]"
          - call: "GET /products/search?sort=price"
            gives: "[Samosa, Masala tea, Filter coffee, Paneer roll]"
  - id: 06-request-bodies
    title: Request bodies and DTOs
    file: chapters/06-request-bodies.md
    minutes: 20
    tasks:
      - id: create_product
        title: "06-request-bodies: POST /products"
        hints:
          - "Add a method with @PostMapping for /products and a NewProduct parameter."
          - "Mark the parameter with @RequestBody so Spring reads it from the JSON body."
          - "Store it with the repository's add method, passing the name, the price and NEW_PRODUCT_COST_PAISE, and return what it gives back."
        examples:
          - call: "POST /products {\"name\": \"Vada pav\", \"pricePaise\": 2500}"
            gives: "{\"id\": 4, \"name\": \"Vada pav\", ...}"
      - id: product_view
        title: "06-request-bodies: a ProductView without the cost"
        hints:
          - "The method returns the whole Product, so costPaise is in the JSON."
          - "Change the return type to ProductView and build one from the product's id and name."
          - "Format the price with String.format(\"Rs %d.%02d\", ...) using paise / 100 and paise % 100."
        examples:
          - call: "GET /products/1/view"
            gives: "{\"id\": 1, \"name\": \"Masala tea\", \"price\": \"Rs 20.00\"}"
            note: "no costPaise"
  - id: 07-status-codes
    title: Answers and status codes
    file: chapters/07-status-codes.md
    minutes: 18
    tasks:
      - id: created_201
        title: "07-status-codes: 201 Created with a Location"
        hints:
          - "A plain return value always answers 200; return a ResponseEntity<Product> instead."
          - "ResponseEntity.created(uri) sets 201 and the Location header; .body(product) adds the body."
          - "Build the URI from the new product's id, for example with URI.create and the path /products/ plus the id."
        examples:
          - call: "POST /products {\"name\": \"Poha\", \"pricePaise\": 2200}"
            gives: "201, Location: /products/4"
      - id: delete_204
        title: "07-status-codes: DELETE answers 204 or 404"
        hints:
          - "repository.delete(id) returns true when it deleted a product."
          - "Return ResponseEntity<Void> so you can choose the status code."
          - "Use noContent().build() when it deleted something, and notFound().build() otherwise."
        examples:
          - call: "DELETE /products/3"
            gives: "204"
          - call: "DELETE /products/3 again"
            gives: "404"
  - id: 08-validation
    title: Validation
    file: chapters/08-validation.md
    minutes: 18
    tasks:
      - id: validate_product
        title: "08-validation: validate NewProduct"
        hints:
          - "Constraints go on the record's components, and @Valid goes on the controller parameter."
          - "Use @NotBlank and @Size(max = 40) on the name, and @Positive on the price."
          - "In ProductController, put @Valid before @RequestBody NewProduct."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": 2000}"
            gives: "400"
          - call: "POST /products {\"name\": \"Tea\", \"pricePaise\": 2000}"
            gives: "201"
      - id: validate_customer
        title: "08-validation: validate NewCustomer"
        hints:
          - "Three components, three rules: name, email and phone."
          - "Use @NotBlank on name, @NotBlank and @Email on email, and @Pattern on phone."
          - "The phone pattern is the regular expression for exactly ten digits; then add @Valid in CustomerController."
        examples:
          - call: "POST /customers with \"phone\": \"98765\""
            gives: "400"
          - call: "POST /customers with a valid name, email and phone"
            gives: "201"
  - id: 09-errors
    title: Errors, the same everywhere
    file: chapters/09-errors.md
    minutes: 20
    tasks:
      - id: not_found_problem
        title: "09-errors: a ProblemDetail for ProductNotFoundException"
        hints:
          - "ApiErrors is already the advice class for every controller; it needs a handler method."
          - "Mark a method as the exception handler for ProductNotFoundException, and return a ProblemDetail."
          - "Create it with ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, the message), then set its title."
        examples:
          - call: "GET /products/99"
            gives: "404 {\"title\": \"Product not found\", \"detail\": \"No product 99\"}"
      - id: validation_problem
        title: "09-errors: a ProblemDetail for validation errors"
        hints:
          - "Validation failures throw MethodArgumentNotValidException."
          - "Collect getBindingResult().getFieldErrors() into a map of field name to default message."
          - "Return a 400 ProblemDetail titled Invalid request, and add the map with setProperty(\"errors\", ...)."
        examples:
          - call: "POST /products {\"name\": \"\", \"pricePaise\": -1}"
            gives: "400 {\"title\": \"Invalid request\", \"errors\": {\"name\": ..., \"pricePaise\": ...}}"
  - id: 10-configuration
    title: Configuration and profiles
    file: chapters/10-configuration.md
    minutes: 18
    tasks:
      - id: shop_properties
        title: "10-configuration: typed shop settings"
        hints:
          - "ShopProperties needs @ConfigurationProperties with the prefix shop."
          - "Add the shop settings to application.yml, with name and free-delivery-above-paise under shop."
          - "Give ShopInfoController a constructor that takes ShopProperties, and answer with its name and freeDeliveryAbovePaise."
        examples:
          - call: "GET /shop/info"
            gives: "{\"name\": \"Shop API\", \"freeDeliveryAbovePaise\": 50000}"
      - id: prod_profile
        title: "10-configuration: production settings in a profile"
        hints:
          - "A profile file sits next to application.yml and is named after the profile."
          - "Create application-prod.yml with only the settings that change in production."
          - "Set shop.name to Shop API (production) and shop.free-delivery-above-paise to 100000."
        examples:
          - call: "GET /shop/info with the prod profile"
            gives: "{\"name\": \"Shop API (production)\", \"freeDeliveryAbovePaise\": 100000}"
