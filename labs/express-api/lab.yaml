  tasks:
  - id: get_order
    title: 'GET /orders/:id: one order, or 404'
    xp: 20
    hints:
    - The orders live in the ORDERS map in server.js, keyed by id.
    - Express puts the :id part of the path in req.params.id, as a string.
    - Look the id up in ORDERS; send 404 with an error message when it is missing, otherwise send the order as JSON.
  - id: create_order
    title: 'POST /orders: validate, then 201'
    xp: 20
    hints:
    - The JSON body is in req.body because express.json() is already set up.
    - A valid order has a non-empty items array of strings and an area string.
    - Answer 400 with an error for anything else; otherwise store a new order with the next id and status preparing,
      and answer 201.
